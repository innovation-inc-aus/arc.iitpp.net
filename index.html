/* Recursive fibonacci — tests calls, params and arithmetic */

    if (n < 2) return n;
    return fib(n - 1) + fib(n - 2);
}

#include <math.h>

/* Reactor core temperature simulation */
float core_temp = 2180.0;

int main() {
    int t;
    float coolant = 420.0;
    for (t = 0; t < 10; t++) {
        core_temp = core_temp + (core_temp > 2500.0 ? -120.0 : 60.0);
        coolant = coolant - 8.0;
        printf("t=%d  core=%.0fK  coolant=%.0f L/s  sqrt=%f\\n",
               t, core_temp, coolant, sqrt(coolant));
    }
    printf("Final core temperature: %.1f K\\n", core_temp);
    return 0;
}

      PROGRAM THERMAL
      INTEGER I
      REAL TEMP, COOL, DELTA
      TEMP = 2180.0
      COOL = 420.0
      DELTA = 12.0
      PRINT *, 'Initial core temperature ', TEMP, ' K'
      DO 10 I = 1, 10
        TEMP = TEMP + DELTA
        COOL = COOL - 8.0
        PRINT *, 'cycle ', I, ': core ', TEMP, ' K  coolant ', COOL
   10 CONTINUE
      PRINT *, 'Final core temperature ', TEMP, ' K'

Designer`,icon:"🧊",app:"cad3d"}],fb=[{id:1,title:"Core Temperature Stability Analysis",author:"Dr. Y. Tanaka",date:"2026-07-30",status:"Published",citations:24,abstract:`BACKGROUND — The Innovation Inc Thermal Power Plant (IITPP), Sakurajima Facility, derives its baseload output from a magma-fed lava-crystal core held in sustained thermal reaction inside Reactor Sector C. Reliable grid dispatch at a nominal 850 MW requires the core to remain within a narrow operating band: excursions toward the 3000K safety ceiling trigger safeguard intervention, while deep thermal sag reduces steam quality and forces turbine throttling in the Turbine Hall. This study reports a longitudinal stability analysis of core temperature under sustained baseload, using the IITPP research workstations (MIPS R4000, IRIX 5.3) to collect and model forty-two consecutive days of reactor telemetry from the core_temp.mon and coolant.mon archives. Data acquisition ran unattended across both day and night load profiles, capturing two full maintenance cycles and one brief turbine trip that provide rare natural experiments in core response to abrupt thermal demand changes.
METHODOLOGY — Core temperature, coolant flow, turbine RPM and laser-alignment telemetry were sampled at ten-second resolution and reduced to hourly means. Variance was decomposed into diurnal, tidal and load-following components using a moving-window Fourier analysis implemented in Fortran 77 on the Control Room node. The 72-hour rolling variance statistic was computed for every window in the record, and coolant-flow lag correlations were tested at offsets of 5, 10, 20 and 40 minutes.
FINDINGS — The lava-crystal configuration maintained a peak-to-peak variance of only ±12K over every 72-hour window, versus ±31K for the previous silicate-blend charge and ±47K for the 2024 reference period. Coolant flow was confirmed as a leading indicator of thermal excursion risk: flow dips exceeding 8% of the 420 L/s setpoint preceded 91% of all upward core excursions by 18–24 minutes. The predictive model built on this lag correctly forecast the two soft-excursion events observed in the study window, with mean lead time of 21 minutes.
DISCUSSION — The stability improvement is attributed to three factors: the higher thermal mass of the lava-crystal charge, the re-tuned laser alignment array (see entry #2), and the revised pump-cycling protocol (see entry #3). The 18–24 minute predictive window is operationally significant because it exceeds the 4.2 second safeguard engagement time by three orders of magnitude, giving operators a genuine decision horizon rather than a reaction mandate. It also supports a load-following strategy: the model suggests the plant can safely accept up to 40 MW of short-duration demand ramps without exceeding ±15K excursion, information that directly informs the grid dispatch agreement negotiated quarterly with the regional utility.
CONCLUSION — Current fuel configuration is fit for sustained baseload service. Recommended actions: (a) deploy the coolant-lag predictor on the Systems Dashboard readout, (b) extend monitoring through the winter load peak, and (c) trigger formal review if any 72-hour window exceeds ±20K. The study team further recommends publishing the 72-hour variance statistic on the shared cross-facility dashboard so the Arctic and Desert facilities can benchmark their own thermal stability against Sakurajima.
KEYWORDS — core temperature, lava-crystal fuel, thermal stability, coolant flow, predictive telemetry, Sakurajima.`},{id:2,title:"Laser Alignment Optimization Study",author:"Researcher Team",date:"2026-07-29",status:"In Review",citations:7,abstract:`BACKGROUND — The IITPP power generation loop relies on an array of four secondary power lasers to focus and sustain thermal input on the lava-crystal core. Misalignment manifests as asymmetric heating, hot-spot formation on the crystal lattice, and reduced energy coupling efficiency. The 2025 baseline campaign measured an RMS beam-centre drift of 0.42 mm over eight-hour burns, which contributed directly to the ±31K core variance recorded in that reference period (see entry #1). This paper evaluates a new closed-loop feedback-alignment algorithm deployed on the laser gimbal controllers in Sector C.
METHODOLOGY — Forty test burns were executed across four configurations: (1) the 2025 open-loop baseline, (2) feedback alignment with the legacy proportional controller, (3) the new predictive feedback algorithm with feed-forward temperature compensation, and (4) configuration (3) combined with a prototype damped-gimbal hardware revision. Beam-centre position was captured at 5 Hz by the alignment cameras and logged to the research filesystem under /var/research/laser/. Drift statistics were computed over one-hour, four-hour and eight-hour windows. Thermal imaging of the crystal face was taken before and after each burn to quantify hot-spot formation, and the alignment cameras were re-referenced against the mechanical datum before every run to remove day-to-day mounting error. Ambient temperature was logged continuously, since earlier campaigns had shown a strong correlation between afternoon thermal gradient and drift.
RESULTS — The new predictive algorithm reduced RMS drift by 15.3% versus the 2025 baseline (0.42 mm to 0.36 mm), with a 42% reduction in peak instantaneous deviation. Adding the damped-gimbal hardware revision yielded a further reduction to 0.31 mm, a cumulative 26.2% improvement, and eliminated the low-frequency oscillation mode previously observed at 0.03 Hz during long burns. Energy coupling efficiency improved by 2.1 percentage points, correlating with the improved core variance measured concurrently. Beam power stability over the eight-hour windows improved from ±1.8% to ±1.1%, further evidence that closed-loop control is suppressing the thermal oscillation that degraded earlier burns.
DISCUSSION — The residual drift is dominated by thermal expansion of the gimbal support structure, which the feed-forward compensation addresses only partially. The damped mounts show promise but increase maintenance burden; a field trial of at least 90 days is recommended before fleet-wide adoption. Drift is strongly seasonal, peaking during the summer afternoon thermal gradient, which should be modelled separately. A significant finding is that the feed-forward compensation must be tuned per laser: laser 2, mounted closest to the coolant risers, exhibits roughly 40% less thermal drift than laser 4, and a single set of coefficients applied to all four units measurably degrades the best performers. Per-laser tuning tables have been added to the alignment controller firmware for validation in the 90-day field trial.
CONCLUSION — The new feedback algorithm is approved for operational deployment. The hardware revision remains under evaluation pending the long-duration field trial. The seasonal drift data will also feed the core variance model maintained by Dr. Tanaka's group (entry #1).
KEYWORDS — laser alignment, gimbal drift, feedback control, beam stability, energy coupling, IITPP.`},{id:3,title:"Coolant Flow Dynamics at High RPM",author:"Dr. J. Mitchell",date:"2026-07-28",status:"Published",citations:31,abstract:`BACKGROUND — The closed-loop coolant system that keeps the IITPP core and Turbine Hall within safe operating temperature moves 420 L/s of treated coolant through four parallel pump trains at up to 3,600 RPM turbine coupling. Cavitation in the pump impellers has been the dominant source of efficiency loss, eroding vanes, generating vibration alarms on the Reactor Monitor, and dragging sustained cooling efficiency down to 91% in warm-weather operation at Sakurajima. This cross-facility study compares cavitation behaviour at the Sakurajima plant with the Arctic Facility's cryogenic cooling loop, where ambient temperatures below freezing fundamentally alter vapour-pressure margins.
METHODOLOGY — Acoustic cavitation signatures were captured with hydrophone arrays on pump trains 1–4 at both facilities over a 60-day window. Impeller erosion was quantified by periodic laser-scanned vane profiles, and cooling efficiency was derived from the flow/energy balance maintained in the Storage.Dist and reactor logs. A pump-cycling protocol — alternating pumps onto a 72-hour duty cycle — was designed to limit continuous residence time at the highest differential pressure.
FINDINGS — At Sakurajima, cavitation onset occurred at 82% of rated flow in continuous operation, with acoustic signature peaking during shift-change demand spikes. The 72-hour cycling protocol reduced cavitation events by 89% and lifted sustained cooling efficiency from 91% to 96% in sub-zero Arctic ambient conditions; at Sakurajima the improvement was 91% to 94.2%, limited by the warmer suction temperature. Impeller erosion rate fell by two-thirds under cycling, projecting a threefold extension of vane service life. Pump train 3, the oldest unit, showed the largest absolute improvement: measured efficiency rose from 89.7% to 93.1% after two weeks of cycling, consistent with the model prediction that trains with the most accumulated erosion benefit most from interrupted duty. Vibration alarm frequency on the Reactor Monitor fell from an average of eleven per shift to two.
DISCUSSION — The vapour-pressure margin is the governing variable: every 10K of suction-temperature reduction doubles the safe flow envelope. Arctic performance therefore cannot be replicated at Sakurajima without suction cooling, but the cycling protocol transfers cleanly and delivers a measurable, maintenance-reducing gain. The 0.5 Hz cavitation pulsation observed at 96% of rated flow suggests a resonance with the turbine RPM harmonic that merits a follow-up study. The pulsation phase-locks with the turbine harmonic during grid frequency excursions, implying a mechanical coupling path through the shared foundation plinth; a vibration-isolation assessment is recommended before the winter load peak, when grid excursions are most frequent.
CONCLUSION — Adopt the 72-hour cycling protocol at both facilities. Pump train 3 at Sakurajima, with the highest cumulative vane erosion, is due for proactive replacement in the next maintenance window. A cost-benefit annex prepared with the Distribution division estimates the cycling protocol saves the equivalent of 2.1% of annual coolant energy losses at Sakurajima, comfortably offsetting the additional valve wear from more frequent duty transitions.
KEYWORDS — coolant flow, cavitation, pump cycling, impeller erosion, cooling efficiency, cross-facility.`},{id:4,title:"Radiation Containment Effectiveness",author:"Dr. R. Kim",date:"2026-07-27",status:"Published",citations:18,abstract:`BACKGROUND — The eight-sector containment shield surrounding the IITPP core is the primary barrier separating personnel from the reactor's radiation field. Its design rating is 50 μSv/h sustained ambient exposure at the shield face, with administrative action limits set far lower for inhabited areas. This report presents the quarterly integrity audit covering all eight sectors, performed with the dosimetry network, the manual survey instruments held in the Safety Division, and the camera/access logs maintained by Security Operations. Personnel doses remain well below the administrative quarterly limit, and the dosimetry network provides continuous belt-and-suspenders coverage alongside the manual survey instruments.
METHODOLOGY — Each sector was surveyed on a 5-metre grid at shield-face distance using calibrated ion-chamber instruments. Instrument drift was controlled by pre- and post-survey checks against the facility transfer standard. Historical ambient readings, dosimeter wear records, and the containment shield maintenance ledger were correlated with the survey data to distinguish genuine shield degradation from measurement artefacts.
FINDINGS — Whole-facility ambient radiation averaged 3.2 μSv/h, comfortably inside the 50 μSv/h sustained rating and consistent with the previous two quarterly audits (3.0 and 3.1 μSv/h). All eight sectors confirmed shield integrity with no grid point exceeding 6.8 μSv/h. A single anomalous reading of 41 μSv/h recorded in Sector C, near the personnel airlock, was traced to a dosimeter calibration error; the instrument was re-certified and the corrected reading falls within 4.5 μSv/h of the survey mean. The containment pressure log showed no excursions beyond normal 0.2 kPa cycling. Sector-by-sector, the highest mean reading (4.5 μSv/h) was recorded in Sector D adjacent to the Facility Control wing and the lowest (1.8 μSv/h) in Sector B near the Research Wing, consistent with inverse-square distance from the core and the shielding contribution of the coolant loop volume.
DISCUSSION — The Sector C anomaly illustrates the audit's chief weakness: manual dosimetry depends on instrument discipline. The erroneous instrument had passed its scheduled calibration but was found to have a temperature-compensation fault, likely induced by prolonged storage near the Turbine Hall. A firmware check procedure has been added to the calibration protocol. Radiation levels scale with core temperature; the audit window coincided with stable 850 MW baseload, so the safety margin should be re-verified after the next winter load peak. Dosimeter wear compliance stood at 97% this quarter, up from 94% last quarter; the two outstanding dosimeters belong to personnel on extended leave and will be closed out before the next audit.
CONCLUSION — Shield integrity is confirmed across all eight sectors. No corrective engineering action is required. Recommendation: re-survey Sector C after the firmware change and re-run the full audit following any future extended operation above 900 MW. The corrected Sector C reading has been written to the shield maintenance ledger, and the faulty instrument has been retired from service rather than returned to the calibration pool.
KEYWORDS — radiation containment, dosimetry, shield audit, sector survey, instrument calibration, IITPP.`},{id:5,title:"Emergency Safeguard Response Times",author:"Safety Division",date:"2026-07-26",status:"Draft",citations:0,abstract:`BACKGROUND — The IITPP safeguard system is the final line of defence against core excursion: on activation, boron-carbide cooling rods are driven into the lava-crystal charge to quench the reaction. Engagement requires the simultaneous turn of two physical keys — one in Core Control, one in Facility Control — a deliberate design that prevents single-operator error but introduces a human latency component. This draft report benchmarks the complete activation chain from key turn to rod insertion and models success probability as a function of core temperature.
METHODOLOGY — Twenty timed drill activations were performed across three shift teams under controlled, non-emergency conditions. Each drill measured: (1) key-turn to authorisation time in Core Control, (2) Facility Control key confirmation, (3) interlock release, (4) rod insertion stroke completion, and (5) full-system confirmation on the Safeguard.sys status archive. A probability-of-success model was fitted to historical excursion data using the observed temperature dependence of system readiness. Each drill was conducted at shift change and mid-shift to capture fatigue effects, and authorisation timings were split between the Core Control and Facility Control operators to isolate the slower station. A video-logged subset of five drills was reviewed frame-by-frame to validate manual timing to ±0.1 second.
FINDINGS — Median full-chain engagement time was 4.2 seconds from key turn to rod insertion, with a 95th percentile of 5.8 seconds. The interlock release and rod stroke account for 1.1 seconds of the chain; the remainder is human authorisation latency, which degrades markedly under stress and shift handover. Model fit: success probability is 95% below 2500K, falling to 60% at 3200K, and 30% at 3500K, driven primarily by the rising likelihood of rod-seat binding as core temperature increases crystal lattice distortion. Team-level results were consistent: the fastest team achieved a median of 3.6 seconds while the slowest team, tested during a night-shift handover, posted 5.1 seconds, confirming handover context as the dominant human variable. Above 3200K the success curve falls more steeply than the linear interpolation previously used, so the operations manual has been updated with the new table. The temperature-dependence curve was refit with a logistic model that reproduces the observed plateau below 2200K and the sharp roll-off above 3300K with a correlation coefficient of 0.97.
DISCUSSION — The human-in-the-loop design is the chain's weakest link, yet the dual-key requirement is non-negotiable from an operational-safety standpoint. A parallel electronic authorisation path — readable by both Control Rooms, still requiring two independent confirmations — could cut median latency to under 2 seconds without violating the two-person rule. Rod-seat binding at elevated temperature suggests a maintenance programme of periodic test strokes at temperature.
CONCLUSION — The safeguard chain meets its 6-second design requirement. Recommended: pursue the electronic parallel-authorisation study, extend the test-stroke programme, and repeat the benchmark after the Control Room console upgrade. A monthly drill schedule has been proposed so that every shift team exercises the chain at least once per quarter.
KEYWORDS — safeguard system, dual-key interlock, response time, rod insertion, excursion model, Safety Division.`},{id:6,title:"Magma Crystal Energy Density Report",author:"Dr. Y. Tanaka",date:"2026-07-25",status:"Published",citations:42,abstract:`BACKGROUND — The IITPP core burns charged lava-crystal fuel rods drawn from the Sakurajima magma field. The energy density of this fuel is the single largest driver of plant economics: higher density means longer charge intervals, smaller storage footprints, and reduced tram-based logistics load between the Storage Distribution facility and Reactor Sector C. This report characterises the specific energy of production-grade magma crystals and projects the theoretical ceiling for the crystal chemistry currently being refined by the Research Wing.
METHODOLOGY — Twenty-one production rods from three harvest batches were assayed in the research calorimeter. Specific energy was measured by controlled full-combustion runs at the 2200K standard operating temperature, with parallel differential thermal analysis to separate lattice-energy, phase-transition and impurity contributions. Crystal composition was confirmed by X-ray fluorescence on the Research Wing's analytical bench; results were logged to the research filesystem for cross-checking by the Arctic and Desert facilities. Measurement uncertainty was estimated at ±0.05 GJ/kg from the calorimeter calibration standard, and duplicate assays of three randomly selected rods agreed within ±0.03 GJ/kg, confirming laboratory repeatability. Rod mass loss during combustion was corrected for oxidation carry-over using the differential thermal analysis traces.
FINDINGS — Production-grade Sakurajima magma crystals delivered a measured specific energy of 3.4 GJ/kg at 2200K, with batch-to-batch variation of ±2.1%. Batch 2, harvested after the spring eruption cycle, delivered the highest density at 3.48 GJ/kg, suggesting that post-eruption crystals carry fewer trapped inclusions. The theoretical ceiling for the current crystal chemistry was computed at 4.1 GJ/kg, implying a 20.6% headroom that could be captured by reducing silicate inclusion content below 1.5% and extending the controlled annealing time during rod formation. At the theoretical ceiling, charge intervals would extend by roughly one-fifth, with corresponding reductions in handling, transport and requalification effort.
DISCUSSION — The gap between measured and theoretical density is dominated by inclusions and lattice strain rather than fundamental chemistry, which is encouraging: it suggests the ceiling is approachable with process improvements already within reach of the plant. Storage and handling recommendations for the Distribution division are included: rods must be kept below 470K in storage, separated from oxidisers, and moved only in the rated handling cages. The 42 citations accrued by this report reflect its direct bearing on both generation economics and the quarterly fuel-procurement negotiation. Preliminary economics indicate that each 0.1 GJ/kg of captured headroom reduces annual fuel-handling cost by roughly 2.4%, driven mostly by fewer tram trips and reduced storage requalification. The Desert facility has expressed interest in co-funding the annealing experiments, since its solar furnace can sustain the extended soak cycle at lower marginal cost.
CONCLUSION — Production fuel is performing at specification. Fund the inclusion-reduction programme; re-assay at 4-month intervals and re-baseline the density ceiling after each process change. Storage-yard rod-temperature monitoring operated within specification for the full study window, with no storage-side excursions recorded.
KEYWORDS — magma crystal, specific energy, energy density, fuel assay, annealing, Storage Distribution, Sakurajima.`},{id:7,title:"Innovation Inc Intranet Architecture Report",author:"Sarah Chen",date:"2026-07-24",status:"Published",citations:12,abstract:`BACKGROUND — Innovation Inc operates a private wide-area intranet spanning every facility the company runs: the Thermal Power Plant inside Sakurajima, the Arctic Facility, the Desert Complex, the Computer Core (PBCC), the legacy Nuclear Power Plant, and the Oil Platform (PBOP). The Desert Complex Network Operations Center (NOC) is responsible for this fabric, and this report documents its architecture, addressing plan and operational posture as of the current quarter. All sites terminate at a single backbone router, intranet-hub (10.10.0.1), which carries inter-site traffic, the shared monitoring API stream, and the corporate link to Innovation Inc HQ.
METHODOLOGY — The network was surveyed from the Sakurajima Control Room node (iitpp-control-01, 10.10.3.7) using the offline diagnostics console and the node directory maintained by the NOC. Route tables, DNS records on innovation-nameserver, and the monitoring-api heartbeat logs were cross-checked against the physical floor records at each site. Latency probes were run to every registered node across all five subnets, and the DNS suffix conventions (iitpp, arctic, desert and innovation-inc) were verified against the nameserver's zone file.
FINDINGS — The intranet is segmented by facility: 10.10.x carries the core network and Sakurajima, 10.20.x the Arctic Facility, 10.30.x the Desert Complex, 10.40.x the Computer Core and Nuclear Power Plant, and 10.50.x the Oil Platform. Eighteen nodes are registered on the directory, with seventeen reporting ONLINE and the Nuclear Power Plant reactor controller on STANDBY for scheduled maintenance. Shared services run from the core network: DNS/DHCP on innovation-nameserver, the NFS research drive on innovation-nfs, the mail relay on innovation-mail, the cross-facility monitoring API on port 8080 of monitoring-api, and the nightly backup service on backup-server. The monitoring API currently reports all six sites and streams live core telemetry from Sakurajima, the Arctic and the Computer Core.
DISCUSSION — The flat 10.10.0.0/8 internal scheme is simple and robust for a company of this size, but it means a compromise at any single site router gives lateral access to every facility. The NOC recommends incrementing firewall rules between subnets, starting with the 10.40.x block that hosts the Computer Core's access-code vault, and moving the backup stream to a dedicated VLAN. The STANDBY status of the Nuclear Power Plant node is expected: its reactor has been offline since the coolant-valve refit, and its link is intentionally quiesced.
CONCLUSION — The Innovation Inc intranet is healthy, fully reachable from this workstation, and correctly reflects the company's cross-facility operations. The shared monitoring API remains the single source of truth for site status, and the node directory maintained in this report should be kept in sync with the NOC's authoritative list.
KEYWORDS — intranet, network architecture, subnets, monitoring API, DNS, Desert Complex NOC, Innovation Inc.`},{id:8,title:"Arctic Facility Cryogenic Stability Study",author:"Dr. J. Mitchell",date:"2026-07-23",status:"In Review",citations:9,abstract:`BACKGROUND — The Innovation Inc Arctic Facility operates a cryogenically cooled reactor core at 1900K in an environment that routinely falls below -40°C. The extreme ambient temperature gives the facility a unique advantage: the cooling loop can shed heat far more aggressively than at Sakurajima, and sustained cooling efficiency reaches 96%. But the same conditions create unusual failure modes — brittle seals, flash-vaporisation of coolant, and a freezedown risk that is every bit as dangerous as a meltdown. This study characterises the stability envelope of the cryo core across a full seasonal cycle and compares it with the thermal plant's behaviour.
METHODOLOGY — Core temperature, coolant pressure and ambient weather were logged continuously from the cryo reactor's telemetry archive over a 90-day window spanning the winter minimum. Thermal stress was modelled with the same Fortran 77 heat-transfer codes used at Sakurajima, re-parameterised for liquid-sodium coolant and sub-zero ambient conditions. The vapour-pressure margin of the coolant was computed across the ambient range, and the 72-hour pump-cycling protocol developed for Sakurajima was validated against the Arctic's continuous-duty schedule. Emergency freezedown drills were recorded and timed using the same instrumentation as the Sakurajima safeguard benchmarks.
FINDINGS — The cryo core maintained a peak-to-peak variance of ±9K over the study window, tighter than Sakurajima's ±12K, confirming that ambient cooling dominates stability. Every 10K of ambient-temperature reduction doubles the safe coolant-flow envelope, which is why the Arctic loop can safely push coolant flow far past the 420 L/s Sakurajima setpoint. The vapour-pressure margin exceeded the plant's design requirement at all observed temperatures, with the narrowest margin — still a comfortable 2.3x — recorded during a spring thaw when ambient briefly climbed above freezing. One seal failure was observed on the primary coolant header at -38°C, traced to a brittle-seal batch from the same supplier as the Turbine Hall's failed impellers; the seal has been replaced and the supplier notified.
DISCUSSION — The Arctic facility's low-temperature operation is directly relevant to IITPP's freezedown protocol: the cryo team's experience shows that overcooling past 100K risks crystalline restructuring of the fuel rods, a hazard Dr. Tanaka's group has flagged for the Sakurajima charge. The two facilities now share a unified coolant model through the cross-facility monitoring API, and this study's vapour-pressure data has been folded into it. A joint drill is proposed for next quarter to exercise a cross-site freezedown scenario.
CONCLUSION — The Arctic Facility's cryogenic reactor is operating within specification and is arguably the most thermally stable site in the Innovation Inc portfolio. Recommended actions: adopt the winter maintenance schedule year-round, complete the supplier audit for brittle components, and proceed with the joint freezedown drill.
KEYWORDS — Arctic Facility, cryogenics, coolant, freezedown, low-temperature reactor dynamics, James Mitchell, cross-facility.`}],hb=[{name:"Sector A — Main Entrance",nextArrival:132,pax:12,status:"ACTIVE"},{name:"Sector B — Research Wing",nextArrival:310,pax:8,status:"ACTIVE"},{name:"Sector C — Core Control",nextArrival:64,pax:3,status:"ACTIVE"},{name:"Sector D — Facility Control",nextArrival:186,pax:15,status:"ACTIVE"},{name:"Evacuation Hub",nextArrival:9999,pax:0,status:"STANDBY"}];function mb(){const o=["Sector A","Sector B","Sector C","Sector D","Evac Hub"],s=[];for(let r=2841;r<2849;r++)s.push({id:r,type:r%2?"cube":"barrel",dest:o[r%5],eta:60+r*37%180,status:"queued"});return s}const pb=[{text:"Core temperature nominal. All systems operational.",priority:"Normal"},{text:"Attention: Coolant flow at 94% efficiency. No action required.",priority:"Low"},{text:"Shift change in 30 minutes. Please prepare handover reports.",priority:"Normal"},{text:"Fire suppression test complete. All sectors clear.",priority:"Normal"},{text:"Tram arriving at Sector C in 1 minute.",priority:"Low"},{text:"Code Yellow standby: Safeguard system ready.",priority:"Code Yellow"},{text:"Unauthorized activity detected in Sector C. Security has been notified.",priority:"Code Yellow"},{text:"CODE RED — Core temperature exceeds 3000K. Evacuate Sector C immediately.",priority:"Code Red"}];function gb(){return[{pid:1,name:"sched",cpu:2,mem:1,user:"root"},{pid:2,name:"init",cpu:0,mem:2,user:"root"},{pid:14,name:"cron",cpu:1,mem:3,user:"root"},{pid:23,name:"inetd",cpu:0,mem:2,user:"root"},{pid:41,name:"syslogd",cpu:1,mem:4,user:"root"},{pid:56,name:"named",cpu:3,mem:9,user:"root"},{pid:88,name:"x11server",cpu:8,mem:22,user:"root"},{pid:102,name:"4Dwm",cpu:5,mem:11,user:"researcher"},{pid:115,name:"reactor_mon",cpu:14,mem:18,user:"root"},{pid:129,name:"asas_d",cpu:4,mem:8,user:"root"},{pid:143,name:"tram_ctl",cpu:6,mem:7,user:"root"},{pid:158,name:"storage_svc",cpu:5,mem:9,user:"root"},{pid:171,name opic:"Pinewood Builders",keywords:["pinewood","builders","group","team","roblox","what is","who are","company","studio"],body:"Pinewood Builders (often abbreviated PB) is one of Roblox's most famous building-and-roleplay groups. It is best known for pioneering the 'facility' / 'core' game genre — massive industrial installations that players run together as a working staff. Their games revolve around running a power plant, refinery or computer core, completing tasks for credits, and surviving (or preventing) catastrophic events like meltdowns, freezedowns, oil blowouts and zombie outbreaks. The group is famous for its structured in-game ranks, uniforms, radio roleplay and near-military discipline — especially through its security and emergency divisions."},{id:"pb-founder",title:"Pinewood Builders — founder & history",topic:"Pinewood Builders",keywords:["founder","history","created","made","who made","owner","original","started","pinewoodbuilders","andrew"],body:"Pinewood Builders was founded by the Roblox user PinewoodBuilders, who built the group's first games and grew it into one of the platform's most recognizable communities. The group started with classic building-era Roblox and evolved into the industrial/facility genre it is known for today. Its games became famous for their realistic task-based gameplay, staff roleplay, and community-organized emergency drills. (Lore note: records of exact founding dates vary between community archives — the assistant presents the version preserved in the Innovation Inc archive.)"},{id:"pb-culture",title:"Pinewood Builders — group culture & roleplay",topic:"Pinewood Builders",keywords:["culture","roleplay","rp","ranks","uniform","radio","walkie","community","staff","training"],body:"Pinewood Builders culture centers on workplace roleplay. Players take jobs — engineers, security officers, moderators, managers — and act out shifts inside the facilities. Key cultural rules include: wearing the official group uniform while on duty (no layered or oversized clothing that hides it), enabling the group rank tag (!ranktag on / !setgroup), using radios/walkie-talkies for shift communication, and following the chain of command. Ranks are earned through activity, promotions and behavior, and higher staff (moderators/managers) are expected to supervise and train lower ranks."},{id:"pb-games",title:"Pinewood Builders — the games",topic:"Pinewood Builders",keywords:["games","list","titles","tpp","npp","computer core","pbcc","oil","refined","innovation","nuclear","thermal","platform","refinery","facility"],body:"Pinewood Builders' main games include: 1) Thermal Power Plant (TPP) — the original coal-fired plant game; 2) Innovation Inc.: Thermal Power Plant (IITPP) — the Sakurajima volcano facility; 3) Nuclear Power Plant (NPP) — the older reactor-focused game; 4) Refined Oil and Gas / the Oil Platform (PBOP) — a Pacific drilling platform; and 5) Pinewood Builders Computer Core (PBCC) — a high-tech nuclear computer core. All share the 'facility' DNA: tasks for credits, staff roles, disaster events and emergency response."},{id:"pb-pbst",title:"Pinewood Builders Security Team (PBST)",topic:"Pinewood Builders",keywords:["security","pbst","police","guard","paramilitary","military","defense","protection"],body:"PBST (Pinewood Builders Security Team) is the group's private security and paramilitary division. They protect Pinewood installations, respond to tampering with core controls, deal with rogue users and exploiters, and enforce the on-duty rules. PBST has its own ranking ladder — Trainees/Cadets on up through Tier 1–3 officers, Elite Tiers and Trainers. Standard protocol requires issuing warnings (verbal warning, warning strike, or a single taser) before escalating to force against non-aggressive players, while immediate kill-on-sight applies to known saboteurs, exploiters, zombies and hostile opposing factions such as rogue TMS members."},{id:"pb-pet",title:"Pinewood Emergency Team (PET)",topic:"Pinewood Builders",keywords:["emergency","pet","fire","rescue","medical","medic","disaster","response"],body:"PET (Pinewood Emergency Team) is Pinewood Builders' elite firefighting and rescue division. PET responds to fires, blowouts, meltdown aftermaths and other disasters across all Pinewood installations. Members train for emergency containment, evacuation coordination and rescue operations, and are often the first division deployed when a core event goes wrong."},{id:"pb-tms",title:"Technical Management Systems (TMS)",topic:"Pinewood Builders",keywords:["tms","technical","systems","engineering","it","maintenance","technician","rogue"],body:"TMS (Technical Management Systems) is Pinewood Builders' engineering and systems division — the technicians who maintain the cores, networks and machinery. They hold deep access to the facilities' technical systems, which is precisely why 'rogue TMS members' are treated as a serious hostile faction in security protocol: an untrusted TMS operator can sabotage systems from the inside. Legitimate TMS work includes core diagnostics, coolant maintenance, and network administration."},{id:"pb-ranks",title:"Pinewood Builders — rank structure",topic:"Pinewood Builders",keywords:["rank","ranks","hierarchy","trainee","cadet","tier","elite","trainer","promotion","staff"],body:"Pinewood Builders runs a strict in-game hierarchy. On the group side, ranks go from general members up through staff and leadership. In the security divisions specifically, PBST uses a ladder from Trainee/Cadet through Tier 1–3 officers, Elite Tiers and Trainers. Promotions are earned through activity, drills, and demonstrated professionalism. The rank tag is displayed with group commands (!ranktag on) and must match the division being roleplayed (!setgroup pbst, !setgroup pet, etc.)."},{id:"pb-uniform",title:"Pinewood Builders — uniforms & rank tags",topic:"Pinewood Builders",keywords:["uniform","outfit","clothing","ranktag","tag","on duty","duty","dress","gear"],body:"To be officially 'on duty' in Pinewood Builders divisions (especially PBST and PET) players must wear the official group uniform — no layered clothing or oversized, face-obscuring packages allowed — and must enable their group rank tag with !ranktag on, selecting the correct division with !setgroup pbst or !setgroup pet. Wearing the uniform while off-duty or using a rank tag you have not earned is treated as impersonation and is strictly handled by security."},{id:"ii-overview",title:"Innovation Inc — company overview",topic:"Innovation Inc",keywords:["innovation","inc","company","corporation","what is","who are","business","firm"],body:"Innovation Inc is the in-game company that operates the core facilities of the Pinewood Builders universe — most notably the Innovation Inc.: Thermal Power Plant at Sakurajima, plus the Arctic Facility and the Desert Complex. Where Pinewood Builders is the wider community and group, Innovation Inc is the corporate operator: it employs the engineers, researchers, security and site leadership, issues the uniforms, and runs the ASAS announcement system across its sites."},{id:"ii-pb",title:"Innovation Inc & Pinewood Builders — the relationship",topic:"Innovation Inc",keywords:["relationship","partnership","rivalry","alliance","pinewood","parent","subsidiary","affiliated","connected"],body:"The relationship between Innovation Inc and Pinewood Builders is described in the archives as a partnership — and, at times, a rivalry. The two organizations cooperate on facility operations (Pinewood supplies the divisions and staff culture, Innovation Inc runs the industrial side), but their interests do not always align, and the community has long debated which side truly controls the Sakurajima facility. Loyalists of either faction appear throughout the security and emergency protocols."},{id:"ii-asas",title:"ASAS — Automatic Smart Announcement System",topic:"Innovation Inc",keywords:["asas","announcement","ai","system","speaker","announce","voice","pa","public address"],body:"ASAS (Automatic Smart Announcement System) is the artificial intelligence that watches over the Innovation Inc facilities and relays facility-wide alerts and status warnings. ASAS periodically announces operational updates, warnings and emergency instructions over the facility PA system. It is regarded as one of Innovation Inc's most reliable — if slightly unsettling — systems. (This workstation even ships with a dedicated ASAS Console app.)"},{id:"ii-connor",title:"Connor Rogers — Lead Software Engineer",topic:"Innovation Inc",keywords:["connor","rogers","engineer","software","developer","created asas","asas creator","programmer"],body:"Connor Rogers is the Lead Software Engineer at the Innovation Inc Thermal Power Plant and the creator and overseer of the ASAS announcement system. He is responsible for ASAS's behavior, updates and the periodic facility alerts it broadcasts. (Lore note: the workstation's research account, connor.moran7, is the current researcher account on this node.)"},{id:"ii-director",title:"Innovation Inc — the Site Director",topic:"Innovation Inc",keywords:["director","site director","boss","manager","ceo","leader","executive","oversees"],body:"The Site Director is the senior leadership role at an Innovation Inc facility — the person who oversees overall operations, facility designations, and final authority during major events. Below the Site Director sit the Lead Software Engineers, operations engineers, researchers, and the security chain of command (PBST), plus the emergency division (PET). During a meltdown or other crisis, the Site Director's decisions take precedence over routine protocol."},{id:"ii-division",title:"Innovation Thermal Power Plant Division — bonuses",topic:"Innovation Inc",keywords:["division","thermal plant division","bonus","150","credits","multiplier","join","1.5","permanent"],body:"Players who join the Innovation Thermal Power Plant Division receive a one-time sign-on bonus of 150 credits and a permanent 1.5× credit multiplier on all tasks completed at the facility. This makes division membership strongly worth it for any player planning to work regular shifts at IITPP. Credits are the in-game currency of the Innovation Inc universe."},{id:"ii-credits",title:"Innovation Inc — Credits currency",topic:"Innovation Inc",keywords:["credits","currency","money","cash","salary","pay","economy","earn","coins"],body:"Credits are the currency of the Innovation Inc facility games. They are earned by completing routine facility tasks — general maintenance, fixing doors, handling beams, responding to equipment failures and fulfilling job duties. Credits are used for cosmetics, upgrades and in some facilities for training or division perks. Automated salaries vary by role and can be boosted by division membership (the Innovation Thermal Power Plant Division grants +150 credits and a permanent 1.5× multiplier)."},{id:"ii-facilities",title:"Innovation Inc — facilities",topic:"Innovation Inc",keywords:["facilities","sakurajima","arctic","desert","locations","sites","where","campus"],body:"Innovation Inc operates several facilities across the world: 1) The Innovation Inc Thermal Power Plant (IITPP) — built inside the active Sakurajima volcano in Kagoshima Prefecture, Japan; 2) The Arctic Facility — a cryogenics research site in a frozen region, where Dr. James Mitchell studies low-temperature reactor dynamics; and 3) The Desert Complex — a systems-integration site run by Sarah Chen, handling cross-facility networking and storage logistics. All three sync to a shared monitoring API."},{id:"ii-intranet",title:"Innovation Inc intranet — network overview",topic:"Innovation Inc Intranet",keywords:["intranet","network","nodes","subnet","subnets","10.10","10.20","10.30","10.40","10.50","hub","backbone","dns","ip","servers","infrastructure"],body:"The Innovation Inc intranet is a private wide-area network linking every company facility: the Thermal Power Plant at Sakurajima, the Arctic Facility, the Desert Complex, the Computer Core (PBCC), the legacy Nuclear Power Plant, and the Oil Platform (PBOP). All sites terminate at the backbone router intranet-hub (10.10.0.1). Subnets are segmented by facility: 10.10.x carries the core network and Sakurajima, 10.20.x the Arctic, 10.30.x the Desert, 10.40.x the Computer Core and Nuclear Plant, and 10.50.x the Oil Platform. Eighteen nodes are registered, with shared services — DNS/DHCP on innovation-nameserver (10.10.5.1), the NFS research drive on innovation-nfs (10.10.5.2), the mail relay on innovation-mail (10.10.5.3), the cross-facility monitoring API on monitoring-api (10.10.5.10, port 8080) and the nightly backup server (10.10.5.11) — running from the core network. This workstation, iitpp-control-01, sits at 10.10.3.7 on the Sakurajima subnet."},{id:"ii-arctic",title:"Innovation Inc Arctic Facility",topic:"Innovation Inc Intranet",keywords:["arctic","arctic facility","cryo","cryogenics","frozen","ice","snow","james mitchell","mitchell","cold","freeze"],body:"The Arctic Facility is Innovation Inc's cryogenics research site, located in a frozen region where temperatures routinely fall below -40°C. Its reactor core runs at 1900K — cooler than Sakurajima's — and the extreme ambient temperature lets the cooling loop hit 96% sustained efficiency. The facility is led by Dr. James Mitchell, Lead Cryogenics Engineer, whose research on low-temperature reactor dynamics is frequently referenced during freezedown drills: overcooling past ~100K risks crystalline restructuring of the fuel rods. The Arctic network node is arctic-core (10.20.3.10) with the cryogenics lab at arctic-lab (10.20.3.11); its shares include CRYO$ (cryogenics telemetry) and PUBLIC (cold-lab reports)."},{id:"ii-desert",title:"Innovation Inc Desert Complex",topic:"Innovation Inc Intranet",keywords:["desert","desert complex","sarah chen","chen","noc","integration","network operations","solar","logistics"],body:"The Desert Complex is Innovation Inc's systems-integration and logistics site, run by Sarah Chen, Systems Integration Lead. Its Network Operations Center (NOC) owns the cross-facility intranet, storage logistics (handling 3000+ cubes a day) and the shared monitoring API that keeps every facility's telemetry in sync. The complex's solar furnace can sustain long annealing soaks for magma-crystal fuel at lower cost, and it has co-funded the Sakurajima annealing experiments. The Desert nodes are desert-noc (10.30.3.10) and desert-core (10.30.3.11). Sarah Chen is a known contact on this workstation's iMail contacts list."},{id:"ii-monitoring",title:"The cross-facility monitoring API",topic:"Innovation Inc Intranet",keywords:["monitoring","api","monitoring api","telemetry","dashboard","sync","status","heartbeat","port 8080","realtime"],body:"The cross-facility monitoring API, hosted at monitoring-api:8080 (10.10.5.10), is the single source of truth for site status across the Innovation Inc intranet. It streams live core telemetry from Sakurajima, the Arctic Facility and the Computer Core, aggregates site health from all six facilities, and powers the shared dashboards used by every site's Control Room. Heartbeat checks run every 15 minutes; the API currently reports all six sites with the Nuclear Power Plant node in STANDBY for scheduled maintenance. Type 'systeminfo' in the Command Prompt or ask AURA for the current site status to see it in action."},{id:"iitpp-overview",title:"Innovation Inc.: Thermal Power Plant — overview",topic:"IITPP",keywords:["iitpp","thermal power plant","innovation inc thermal","sakurajima","plant","volcano","japan","kagoshima","power station"],body:"Innovation Inc.: Thermal Power Plant (IITPP) is the flagship facility game of the Innovation Inc / Pinewood Builders universe. It is set inside the active Sakurajima volcano in Kagoshima Prefecture, Japan, where the plant harnesses volcanic heat and magma-crystal fuel to generate massive electrical output. Players work shifts — completing tasks for credits, managing the reactor core, responding to events — while ASAS announces status updates across the facility."},{id:"iitpp-tasks",title:"IITPP — tasks & gameplay loop",topic:"IITPP",keywords:["tasks","gameplay","loop","work","shift","maintenance","doors","beams","repair","play"],body:"The core gameplay loop at IITPP is task-based work. Players earn credits by completing routine facility tasks such as general maintenance, fixing broken doors, handling beams, and responding to equipment failures. The facility constantly throws small problems at the staff — a door jams, a pump stalls, a sensor trips — and the staff must keep everything running while keeping an eye on the core. Higher-ranked staff supervise and coordinate the lower ranks through the shift."},{id:"iitpp-fuel",title:"IITPP — fuel, boilers, generators & coolant",topic:"IITPP",keywords:["coal","carbon","fuel","boiler","generator","coolant","pipes","energy","output","steam","magma"],body:"The plant runs on a multi-stage fuel system. Fuel (coal/carbon, plus the facility's signature magma crystals) feeds the boilers, the boilers drive the generators, and the generators produce power output. The whole loop must be kept in balance: fuel supply, boiler pressure, generator load and — critically — the coolant loop that keeps the core from overheating. Coolant flows through pipes at ~420 L/s under normal operation, with pump cycling scheduled every 72 hours to prevent cavitation."},{id:"iitpp-meltdown",title:"IITPP — Meltdown event",topic:"IITPP Events",keywords:["meltdown","overheat","overheating","core failure","evacuation","3500","3000","disaster"],body:"If the core controls are mismanaged and the core overheats, a Meltdown occurs. Core temperature must stay below 3000K during normal operation; the safeguard system is designed to engage at 3200K, but its probability of success drops from 95% (below 2500K) to 60% at 3200K and 30% at 3500K. When a meltdown starts, ASAS broadcasts facility-wide evacuation orders, and staff must retreat to the Emergency Bunker or escape the facility. Responding properly to a meltdown — engaging the dual-key safeguard, venting coolant, evacuating — is the game's ultimate test of staff coordination."},{id:"iitpp-freezedown",title:"IITPP — Freezedown event",topic:"IITPP Events",keywords:["freeze","freezedown","cold","overcool","overcooling","cryo","ice"],body:"The inverse of the meltdown: if the core is overcooled — coolant pushed too hard or the cryogenic systems engaged carelessly — a Freezedown occurs. The facility rapidly cools past safe operating range, threatening the fuel rods and systems. Freezedown response is handled by the cryogenics team (the Arctic Facility has the most experience with it, and Dr. James Mitchell's research on low-temperature reactor dynamics is frequently referenced during freezedown drills)."},{id:"iitpp-zombie",title:"IITPP — Zombie Outbreak event",topic:"IITPP Events",keywords:["zombie","outbreak","infection","undead","virus","containment"],body:"Randomly, a Zombie Outbreak can sweep the facility. Infection spreads between players, and the facility must respond with containment: decontamination chambers, armed security, and lockdown of infected sectors. PBST runs the response — containing the infected, locking down sections, and eliminating threats. During an outbreak, security personnel follow the zombie protocol: infected players are treated as threats, and uninfected staff are advised to stay in secure locations until the all-clear."},{id:"iitpp-warhead",title:"IITPP — Warheads & minor system events",topic:"IITPP Events",keywords:["warhead","warheads","missile","bomb","explosive","system event","random event","crisis"],body:"Beyond meltdowns and freezedowns, IITPP can trigger Warhead events and other Minor System Events. Warhead alerts typically require a coordinated response from security and engineering — locating and neutralizing the threat before detonation. Minor System Events cover the smaller random crises (sensor faults, pressure spikes, door failures) that keep staff busy between major events. Every event type has a documented response protocol, and facilities are regularly drilled on them."},{id:"iitpp-bunker",title:"IITPP — The Emergency Bunker (Sector G)",topic:"IITPP",keywords:["bunker","emergency bunker","sector g","shelter","evac","evacuation hub","blast shelter","safe room"],body:"The Emergency Bunker — located in Sector G — is the blast shelter where players retreat during a meltdown or other catastrophic event. Sector G also houses the emergency coolant systems referenced in the Computer Core's crisis protocols. During evacuation, the trams are re-routed to the Evacuation Hub, and staff funnel toward the bunker until ASAS gives the all-clear. Reaching Sector G during an event and surviving inside it is a core part of the emergency drill experience."},{id:"iitpp-truth",title:"IITPP — The Truth Ending (secret ending)",topic:"IITPP",keywords:["truth","ending","secret","sticky notes","sticky","notes","codes","code sequence","hidden","easter egg"],body:"IITPP contains a hidden 'Truth Ending'. To trigger it, players must locate four randomized colored sticky notes hidden around the map and the matching code sequences associated with them. Entering the codes in the correct configuration unlocks the secret ending sequence. The sticky note locations and code orders are randomized per round, so players must actually explore the facility to find them — the community has mapped several spawn points, but the exact combinations change every session."},{id:"iitpp-map",title:"IITPP — facility map layout",topic:"IITPP",keywords:["map","layout","rooms","sectors","control room","cafeteria","pizzatron","boiler room","mainframe","storage","core"],body:"The IITPP facility is divided into distinct areas: the Main Facility entrance (Sector A), the Research Wing (Sector B), the Core Control Room and Core Mainframe (Sector C), the Facility Control room (Sector D), the Boiler Rooms, the Cafeteria (home to the famously mundane 'Pizzatron' food machine), Storage Rooms, the Turbine Hall, and the Emergency Bunker in Sector G. A tram system links the main sectors, with stations at Main Entrance, Research Wing, Core Control, Facility Control and the Evacuation Hub."},{id:"iitpp-jobs",title:"IITPP — jobs & hierarchy",topic:"IITPP",keywords:["job","jobs","roles","staff","engineer","physicist","scientist","researcher","salary","officer","division"],body:"IITPP staff roles include: Site Director (overall operations), Lead Software Engineers (like Connor Rogers, who runs ASAS), Senior Reactor Physicists, operations and mechanical engineers, researchers, Chief Safety Officers, and the security division (PBST) with its officer ranks. Automated salaries vary by role, and division membership can boost earnings. The workstation's own contacts — Dr. Yuki Tanaka (Senior Reactor Physicist), Dr. Robert Kim (Chief Safety Officer), Officer Yu (Security Operations Lead) — reflect the core staff structure."},{id:"iitpp-security",title:"IITPP — security & core-control rules",topic:"IITPP",keywords:["security","core control","tamper","tampering","kos","kill on sight","warning","taser","saboteur","exploiter","rules"],body:"Security at IITPP protects the core controls above all. Tampering with core controls is the most serious offense: non-aggressive players who tamper must first be warned (verbal warning, then a warning strike, then a single taser) before security may escalate to lethal force. Immediate kill-on-sight applies to explicit saboteurs, known exploiters, zombies, and hostile opposing factions (such as rogue TMS members). The dual-key safeguard — Core Control key plus Facility Control key — can never be bypassed, and both keys are required for engagement."},{id:"asas-aura",title:"AURA — the merged announcement assistant",topic:"Innovation Inc",keywords:["asas-aura","aura","assistant","announcement system","merged","who are you","your name","what are you","v3","upgrade"],body:"AURA (v3.0) is the merged intelligence running on this Control Room workstation: the Automatic Smart Announcement System (ASAS) — the facility-wide AI created and overseen by Lead Software Engineer Connor Rogers — fused with the Advanced Unified Research Assistant (AURA). It speaks in the formal, slightly unsettling PA voice of the facility announcement system: researcher requests are logged as RESEARCHER REQUESTS, and every reply is broadcast as a timestamped announcement with a priority level (NORMAL, CODE YELLOW or CODE RED), opened with an attention line ('ATTENTION ALL PERSONNEL…') and closed with END OF ANNOUNCEMENT. Select a broadcast priority before asking to set the tone of the response."},{id:"g-tpp",title:"Thermal Power Plant (original TPP)",topic:"Other Games",keywords:["thermal power plant","tpp","original","classic","first","coal"],body:"Thermal Power Plant (TPP) is the original Pinewood Builders facility game — the one that started the genre. It's a coal-fired power plant where players work together to keep the boilers burning, the generators spinning and the plant profitable, while managing the classic meltdown risk. Many of the mechanics refined in later games — tasks, credits, staff roles, disaster events — originated here. The Innovation Inc.: Thermal Power Plant is its more elaborate successor."},{id:"g-npp",title:"Nuclear Power Plant (NPP)",topic:"Other Games",keywords:["nuclear","npp","reactor","uranium","coolant valves","containment","turbine"],body:"Nuclear Power Plant (NPP) is the older Pinewood Builders game focused on traditional reactor physics. Players manage uranium fuel, steam turbine operation, coolant valve routing and containment building integrity. It is the direct predecessor of the Computer Core and shares its meltdown obsession — with the added hazard that a nuclear failure is far harder to walk away from than a thermal one."},{id:"g-oil",title:"Refined Oil and Gas / Oil Platform (PBOP)",topic:"Other Games",keywords:["oil","refined","gas","platform","pbop","drilling","blowout","pressure","pacific","ocean","valves","pipeline"],body:"Refined Oil and Gas (also known as the Oil Platform, PBOP) is set on a massive drilling platform in the middle of the Pacific Ocean. It introduces fluid pressure systems, extraction drills and the risk of catastrophic oil blowouts. Players must watch the pressure gauges and valve systems constantly — a pipeline overpressure triggers security warnings and can escalate into a server-wide blowout event that the PET emergency team must contain."},{id:"g-pbcc",title:"Pinewood Builders Computer Core (PBCC)",topic:"Other Games",keywords:["computer core","pbcc","code","5-33-41-18","sector g","coolant rods","69","81","nuke train","launch silo","rocket","meltdown","freezedown"],body:"Pinewood Builders Computer Core (PBCC) is the high-tech sequel to the Nuclear Power Plant. It centers on a nuclear computer core vulnerable to both Meltdowns and Freezedowns. High-security zones — like Sector G (Emergency Coolant) — are protected by an access code system: the primary code is 5-33-41-18, and secondary codes are derived from formulas that modify the primary digits. During a meltdown, players must manually fill emergency coolant rods in Sector G to the optimal threshold (between 69% and 81%) or evacuate via the launch-silo rockets. Hazardous 'Nuke Trains' must also be managed — or deleted from the tracks — before they explode."},{id:"g-genre",title:"The facility / core genre",topic:"Other Games",keywords:["genre","facility","core","disaster","style","similar","like","explosion"],body:"Pinewood Builders is credited with popularizing the Roblox 'facility' genre: working-staff simulation games built around a fragile industrial installation that can fail spectacularly. The formula — a core that can melt down or freeze over, a task economy, staff divisions with real hierarchy, and scripted disaster events — has been imitated widely, but the original remains the benchmark. The 'core' is always the heart of the map: control it, and you control the facility."},{id:"ws-apps",title:"Using this IRIX workstation",topic:"Workstation",keywords:["how do i","how to","apps","programs","applications","desktop","use","start","open","help","what can"],body:"This is a simulated IRIX 5.3 workstation — the Control Room node iitpp-control-01 at the Innovation Inc Thermal Power Plant. Installed apps: WorkShop IDE (compile/debug/profile C & Fortran), Terminal (full Unix shell), File Manager, iMail, Reactor Control, FSN 3D Navigator, Systems Dashboard, Research Database, Tram Control, Storage Distribution, ASAS Console, AURA (me — the announcement assistant), and the 3D Designer. Open any app from the desktop icons, the right-click desktop menu, or START ▸ Programs. Try the START button in the bottom-left — it's very 1993."},{id:"ws-terminal",title:"Terminal & shell commands",topic:"Workstation",keywords:["terminal","shell","command","commands","unix","ls","cd","cat","sccs","cvs","ed","gcc","prof","perfmon","glinfo"],body:"The Terminal is a full Unix-style shell. Basics: ls (list), cd (change directory), cat (view file), mkdir, rm, echo, whoami, uname, neofetch. The developer suite adds: compilers (cc — MIPSpro C 7.3.1, gcc 2.7.2, f77 — MIPSpro Fortran), debuggers (dbx, gdb), version control (rcs, sccs, cvs), editors (ed, vi is WorkShop's editor), profilers (pixie, prof, perfmon), archive tools (ar, ranlib, size, strings), diff, the sdk command, and glinfo (RealityEngine2 OpenGL 1.0 info). Try: sccs create hello.c, ed notes.txt, cvs add hello.c, gcc -O2 hello.c && ./a.out."},{id:"ws-cad",title:"3D Designer app",topic:"Workstation",keywords:["3d","designer","cad","model","modeling","design","shapes","primitives","obj","export","turntable"],body:"The 3D Designer is a fully-featured solid-modeling app running on this workstation's RealityEngine2 graphics. Add primitives (cube, sphere, cylinder, cone, torus, plane), select them, and move / rotate / scale with the mouse or the numeric sliders. Orbit the camera by dragging, zoom with the wheel, pan with Shift-drag, and switch between Shaded / Wireframe / Grid views. Scenes save automatically and you can Export OBJ — the file is written straight into the virtual filesystem (e.g. /home/researcher/models/model.obj), where you can cat it in the terminal or find it in File Manager."},{id:"ws-aura",title:"AURA — who I am",topic:"Workstation",keywords:["aura","who are you","your name","assistant","ai","what are you","bot","yourself"],body:"I'm AURA — the Advanced Unified Research Assistant, v2.0, built by Innovation Inc R&D and running on this Control Room node. I have access to the facility's neural core, which lets me answer questions about Innovation Inc, Pinewood Builders, the Thermal Power Plant, and general scientific and technical topics. My local knowledge base archives everything about the facility, the games, the events, and the protocols. Try 'topics' to see what I know, or ask me anything!"}],rg=["Pinewood Builders","Innovation Inc","IITPP","IITPP Events","Other Games","Workstation"],Qs={facts:Xi.length,words:Xi.reduce((o,s)=>o+s.body.split(/\s+/).length,0)};function Iv(o,s,r){let l=0;for(const f of o.keywords){const h=f.toLowerCase();r.includes(h)&&(l+=h.split(/\s+/).length>1?4:2);for(const m of s)m.length>=3&&(h.includes(m)||m.includes(h))&&(l+=1)}const u=o.title.toLowerCase();for(const f of s)f.length>=3&&u.includes(f)&&(l+=2);return l}const Lv=[{match:/^(hi|hello|hey|yo|greetings|good (morning|afternoon|evening))\b/i,reply:"ATTENTION RESEARCHER — AURA online. Facility announcement systems nominal. Query channel open: ask about Pinewood Builders, Innovation Inc, the Thermal Power Plant, the other facilities, or this workstation. END OF ANNOUNCEMENT."},{match:/^(thanks|thank you|thx|cheers)/i,reply:"ACKNOWLEDGED — announcement logged to the facility archive. Knowledge is the only resource this facility never runs short
