he Turbine Hall",category:"IITPP — Areas & Rooms",facility:"IITPP — Sakurajima",author:"Operations",classification:"INTERNAL",keywords:["turbine hall","turbines","generators","rpm","vibration","steam","machinery","floor"],summary:"The Turbine Hall is the plant's machine floor — twin turbine-generator sets at 3600 RPM, monitored continuously for vibration and load.",facts:["The Turbine Hall is the plant's machine floor, housing the turbine-generator sets that produce the plant's electrical output.","Turbines run near 3600 RPM and their vibration is monitored continuously.","The hall's cameras are channels 25-28, two of which are frequently down for maintenance.","A loose panel in the hall triggered a famous 0330 motion alarm, later replaced by maintenance.","The hall connects the boiler circuit to the grid tie and is a primary target for protective shutdown during events."]},{title:"The Security Hub",category:"IITPP — Areas & Rooms",facility:"IITPP — Sakurajima",author:"Security Operations",classification:"RESTRICTED",keywords:["security","hub","pbst","armory","surveillance","operations","monitor","barracks"],summary:"The Security Hub is PBST's base of operations — the surveillance wall, the armory and the coordination point for every security response.",facts:["The Security Hub is PBST's base of operations, housing the surveillance wall and the coordination consoles.","The armory is attached, holding the equipment issued for facility defense.","All camera feeds terminate here for live monitoring.","Security officers report to the hub before patrols and during incidents.","The hub coordinates with Facility Control during lockdowns and evacuations."]},{title:"Meltdown Event — Causes & Response",category:"IITPP — Events & Protocols",facility:"IITPP — Sakurajima",author:"Safety Division",classification:"RESTRICTED",keywords:["meltdown","overheat","evacuation","3500","3000","safeguard","core failure","disaster","protocol"],summary:"If the core overheats past the red line, a Meltdown occurs — ASAS broadcasts evacuation orders, and staff must engage the safeguard or retreat to the bunker.",facts:["If the core controls are mismanaged and the core overheats, a Meltdown occurs.","Core temperature must stay below 3000K during normal operation; the safeguard engages at 3200K but its success probability drops sharply at extreme temperature.","When a meltdown starts, ASAS broadcasts facility-wide evacuation orders and staff retreat to the Emergency Bunker or escape the facility.","Proper meltdown response — engaging the dual-key safeguard, venting coolant, evacuating — is the ultimate test of staff coordination.","The 3500K red-line protocol assumes safeguard failure and switches priority to evacuation and containment."]},{title:"Freezedown Event — Causes & Response",category:"IITPP — Events & Protocols",facility:"IITPP — Sakurajima",author:"Safety Division",classification:"RESTRICTED",keywords:["freeze","freezedown","cold","overcool","cryo","ice","overcooling","event"],summary:"The inverse of the meltdown: overcooling the core past safe range triggers a Freezedown, with the cryogenics team leading the response.",facts:["The inverse of the meltdown: if the core is overcooled — coolant pushed too hard or cryogenic systems engaged carelessly — a Freezedown occurs.","The facility rapidly cools past safe operating range, threatening the fuel rods and systems.","Freezedown response is handled by the cryogenics team; the Arctic Facility has the most experience with it.","Dr. James Mitchell's research on low-temperature reactor dynamics is frequently referenced during freezedown drills.","Overcooling past roughly 100K risks crystalline restructuring of the fuel rods, so response aims to hold temperature above that threshold."]},{title:"Zombie Outbreak Event — Containment Protocol",category:"IITPP — Events & Protocols",facility:"IITPP — Sakurajima",author:"Security Operations",classification:"RESTRICTED",keywords:["zombie","outbreak","infection","containment","undead","virus","decontamination","lockdown"],summary:"A Zombie Outbreak sweeps the facility randomly — infection spreads between players, and PBST runs containment with decontamination chambers and sector lockdowns.",facts:["Randomly, a Zombie Outbreak can sweep the facility, with infection spreading between players.","The facility responds with containment: decontamination chambers, armed security, and lockdown of infected sectors.","PBST runs the response — containing the infected, locking down sections, and eliminating threats.","Infected players are treated as threats; uninfected staff are advised to stay in secure locations until the all-clear.","Decontamination chambers are the primary tool for clearing infection at chokepoints."]},{title:"Warhead Event & Minor System Events",category:"IITPP — Events & Protocols",facility:"IITPP — Sakurajima",author:"Safety Division",classification:"RESTRICTED",keywords:["warhead","missile","bomb","explosive","minor events","sensor fault","pressure spike","random event"],summary:"Beyond meltdowns and freezedowns, IITPP can trigger Warhead events and Minor System Events — smaller crises that keep staff busy between major incidents.",facts:["Beyond meltdowns and freezedowns, IITPP can trigger Warhead events, which require a coordinated security and engineering response.","Warhead alerts typically involve locating and neutralizing the threat before detonation.","Minor System Events cover the smaller random crises: sensor faults, pressure spikes and door failures.","Every event type has a documented response protocol, and facilities are regularly drilled on them.","Minor events are the bread-and-butter of shift work, generating tasks and credits between major incidents."]},{title:"Evacuation Protocol",category:"IITPP — Events & Protocols",facility:"IITPP — Sakurajima",author:"Safety Division",classification:"INTERNAL",keywords:["evacuation","evac","protocol","assembly","bunker","hub","routes","drill","procedure"],summary:"The evacuation protocol routes every sector to assembly points and the Evacuation Hub, with trams re-routed and the bunker sealed once the count is clear.",facts:["Evacuation routes are drilled monthly, and every sector has a designated assembly point en route to the hub.","During evacuation, trams are re-routed to the Evacuation Hub and staff funnel toward the Emergency Bunker.","ASAS broadcasts the all-clear only after the bunker count is confirmed and the core event is contained.","Pet and security staff hold positions to direct traffic; the last to enter the bunker are the response teams.","The bunker doors are sealed from inside once the count is complete."]},{title:"Emergency Drills & Schedule",category:"IITPP — Events & Protocols",facility:"IITPP — Sakurajima",author:"Safety Division",classification:"PUBLIC",keywords:["drill","drills","schedule","training","safeguard drill","evacuation drill","monthly","exercise"],summary:"IITPP runs a monthly drill schedule — evacuation drills, safeguard activations and event-response exercises — so every shift team practices the chain at least once a quarter.",facts:["IITPP runs a monthly drill schedule covering evacuation, safeguard activation and event-response scenarios.","Every shift team exercises the emergency chain at least once per quarter.","Safeguard drills benchmark the dual-key activation chain under controlled conditions.","Drill results are logged and reviewed for response-time trends.","The monthly evacuation drill is announced by ASAS, and participation is mandatory for on-duty staff."]},{title:"Core-Control Tampering Rules",category:"IITPP — Events & Protocols",facility:"IITPP — Sakurajima",author:"Security Operations",classification:"RESTRICTED",keywords:["tamper","tampering","core controls","rules","warning","taser","kos","saboteur","offense"],summary:"Tampering with core controls is the most serious offense at IITPP — non-aggressive tamperers get warning escalation first, while saboteurs are subject to kill-on-sight.",facts:["Tampering with core controls is the most serious offense at the facility.","Non-aggressive players who tamper must first be warned — verbal warning, then a warning strike, then a single taser — before security may escalate to lethal force.","Immediate kill-on-sight applies to explicit saboteurs, known exploiters, zombies and hostile opposing factions such as rogue TMS members.","The dual-key safeguard can never be bypassed, and both keys are required for engagement.","Security officers are trained on the escalation ladder and tested on it during drills."]},{title:"The Truth Ending — Secret Ending Sequence",category:"IITPP — Events & Protocols",facility:"IITPP — Sakurajima",author:"Community Archives",classification:"RESTRICTED",keywords:["truth","ending","secret","sticky notes","codes","hidden","sequence","easter egg","true ending"],summary:"IITPP contains a hidden 'Truth Ending': find four randomized colored sticky notes and their code sequences, then enter the codes in the correct configuration to unlock it.",facts:["IITPP contains a hidden 'Truth Ending' that players can unlock by completing a secret sequence.","Players must locate four randomized colored sticky notes hidden around the map and the matching code sequences associated with them.","Entering the codes in the correct configuration unlocks the secret ending sequence.","The sticky note locations and code orders are randomized per round, so players must actually explore the facility to find them.","The community has mapped several spawn points, but the exact combinations change every session."]},{title:"Lockdown Procedures",category:"IITPP — Events & Protocols",facility:"IITPP — Sakurajima",author:"Security Operations",classification:"INTERNAL",keywords:["lockdown","lockdowns","procedure","secure","sectors","doors","containment","alert"],summary:"Lockdowns secure individual sectors or the whole facility — doors fail-secure, trams halt and camera priority shifts to the locked zones.",facts:["Lockdowns secure individual sectors or the whole facility in response to threats.","Doors fail-secure during lockdown: they default to locked except fire-exit paths.","Trams halt outside the locked zone and camera priority shifts to the affected sectors.","Security coordinates lockdowns from the hub and announces status via ASAS.","Lockdowns lift only when the threat is cleared and Facility Control confirms the all-clear."]},{title:"Decontamination Chambers",category:"IITPP — Events & Protocols",facility:"IITPP — Sakurajima",author:"Safety Division",classification:"INTERNAL",keywords:["decontamination","chambers","decon","radiation","infection","clean","shower","washdown"],summary:"Decontamination chambers flush radiation and infection exposure from staff at the sector chokepoints, and are the primary tool for clearing zombie infection.",facts:["Decontamination chambers are installed at the sector chokepoints to flush radiation and infection exposure.","During zombie outbreaks, the chambers are the primary tool for clearing infection at chokepoints.","Radiation-exposed staff must pass through decontamination before returning to inhabited areas.","Chamber systems are tested weekly and logged in the safety records.","The chambers double as quarantine holds when a sector is under containment."]},{title:"The 3500K Red-Line Protocol",category:"IITPP — Events & Protocols",facility:"IITPP — Sakurajima",author:"Safety Division",classification:"RESTRICTED",keywords:["3500","red line","redline","protocol","meltdown","abandon","evacuation","critical","worst case"],summary:"At 3500K the safeguard's success probability drops to 30% and the protocol flips to worst-case mode: abandon core control, vent coolant, and prioritize evacuation.",facts:["The 3500K red-line protocol assumes safeguard failure and switches priority to evacuation and containment.","At 3500K the safeguard's modeled success probability falls to about 30%.","Under the protocol, coolant is vented to buy time and the core area is abandoned to containment.","All non-essential staff evacuate to the bunker; only the Site Director's team remains in Facility Control.","The protocol is the final page of the meltdown response manual and is drilled in worst-case scenarios."]},{title:"Pinewood Builders — Group Overview",category:"Pinewood Builders — Group",facility:"Pinewood Builders",author:"Community Archives",classification:"PUBLIC",keywords:["pinewood","builders","group","roblox","what is","who are","overview","community","team"],summary:"Pinewood Builders is one of Roblox's most famous building-and-roleplay groups, pioneering the facility/core game genre with structured ranks, uniforms and disaster events.",facts:["Pinewood Builders is one of Roblox's most famous building-and-roleplay groups, best known for pioneering the 'facility' or 'core' game genre.","Its games revolve around running a power plant, refinery or computer core — completing tasks for credits and surviving catastrophic events.","The group is famous for its structured in-game ranks, uniforms, radio roleplay and near-military discipline.","Its divisions — especially security (PBST) and emergency (PET) — run the in-game workforce.","The group's games include the Thermal Power Plant, Innovation Inc: Thermal Power Plant, the Computer Core, the Oil Platform and the Nuclear Power Plant."]},{title:"Pinewood Builders — Founder & Early History",category:"Pinewood Builders — Group",facility:"Pinewood Builders",author:"Community Archives",classification:"PUBLIC",keywords:["founder","history","created","made","owner","started","pinewoodbuilders","original","who founded"],summary:"Pinewood Builders was founded by the Roblox user PinewoodBuilders, growing from a classic building-era group into the community that defined the industrial roleplay genre.",facts:["Pinewood Builders was founded by the Roblox user PinewoodBuilders, who built the group's first games.","The group started in the classic building era of Roblox and evolved into the industrial/facility genre it is known for today.","Its games became famous for task-based gameplay, staff roleplay and community-organized emergency drills.","Exact founding dates vary between community archives; this archive preserves the version maintained by Innovation Inc records.","The founder's identity remains part of the group's mythology, discussed in every community history thread."]},{title:"Pinewood Builders — Culture & Roleplay Rules",category:"Pinewood Builders — Group",facility:"Pinewood Builders",author:"Community Archives",classification:"PUBLIC",keywords:["culture","roleplay","rp","rules","uniform","radio","chain of command","on duty","workplace"],summary:"Pinewood culture is workplace roleplay: staff wear the uniform, run the rank tag, use radios and follow the chain of command through their shifts.",facts:["Pinewood Builders culture centers on workplace roleplay — players take jobs and act out shifts inside the facilities.","Key rules: wear the official group uniform while on duty, enable the rank tag, use radios for shift communication, and follow the chain of command.","Ranks are earned through activity, promotions and behavior.","Higher staff are expected to supervise and train lower ranks.","The culture treats the facility as a real workplace, with all the discipline that implies."]},{title:"Pinewood Builders — Rank Structure",category:"Pinewood Builders — Group",facility:"Pinewood Builders",author:"Community Archives",classification:"PUBLIC",keywords:["rank","ranks","hierarchy","trainee","cadet","tier","elite","trainer","promotion","ladder"],summary:"Pinewood runs a strict rank hierarchy from general members through staff and leadership, with division-specific ladders like PBST's Trainee-to-Trainer progression.",facts:["Pinewood Builders runs a strict in-game hierarchy, from general members up through staff and leadership.","PBST uses a ladder from Trainee/Cadet through Tier 1-3 officers, Elite Tiers and Trainers.","Promotions are earned through activity, drills and demonstrated professionalism.","The rank tag is displayed with group commands and must match the division being roleplayed.","Higher staff supervise training and hold the authority to run facility operations."]},{title:"Pinewood Builders — Uniforms & Rank Tags",category:"Pinewood Builders — Group",facility:"Pinewood Builders",author:"Community Archives",classification:"PUBLIC",keywords:["uniform","outfit","clothing","rank tag","ranktag","duty","gear","dress","impersonation"],summary:"Being officially on duty requires the official uniform and an enabled, division-matched rank tag — impersonation of either is handled strictly by security.",facts:["To be officially on duty in Pinewood divisions, players must wear the official group uniform — no layered or face-obscuring clothing.","The group rank tag must be enabled with the standard commands, selecting the correct division.","Wearing the uniform while off-duty or using an unearned rank tag is treated as impersonation.","Impersonation is handled strictly by security, following the warning escalation ladder.","The uniform rules apply across all divisions, from security to emergency response."]},{title:"Pinewood Builders — The Games Catalog",category:"Pinewood Builders — Group",facility:"Pinewood Builders",author:"Community Archives",classification:"PUBLIC",keywords:["games","titles","catalog","tpp","npp","pbcc","oil","innovation","list","facility games"],summary:"Pinewood's game catalog spans the Thermal Power Plant, Innovation Inc: Thermal Power Plant, the Nuclear Power Plant, the Oil Platform and the Computer Core.",facts:["Pinewood Builders' main games include the Thermal Power Plant (TPP), the original coal-fired plant game.","Innovation Inc.: Thermal Power Plant (IITPP) is the Sakurajima volcano facility, the current flagship.","The Nuclear Power Plant (NPP) is the older reactor-focused game.","Refined Oil and Gas / the Oil Platform (PBOP) is the Pacific drilling facility.","Pinewood Builders Computer Core (PBCC) is the high-tech nuclear computer core.","All share the facility DNA: tasks for credits, staff roles, disaster events and emergency response."]},{title:"Radio & Communication Protocols",category:"Pinewood Builders — Group",facility:"Pinewood Builders",author:"Community Archives",classification:"PUBLIC",keywords:["radio","walkie","communication","protocol","codes","channel","transmission","headset","comms"],summary:"Radio discipline is central to Pinewood shifts — clear, coded transmissions over the facility channels, with ASAS broadcasts taking priority.",facts:["Radio (walkie-talkie) roleplay is a core part of Pinewood shifts, with staff reporting over the facility channels.","Transmissions follow a clear protocol: identify yourself, state the situation, await acknowledgment.","ASAS broadcasts take priority over all routine radio traffic.","Security uses the radio to coordinate responses and the chain of command during events.","Poor radio discipline is a common training point for new staff."]},{title:"Community Events & Facility Raids",category:"Pinewood Builders — Group",facility:"Pinewood Builders",author:"Community Archives",classification:"PUBLIC",keywords:["events","raids","community","gatherings","drills","meetups","celebrations","anniversary"],summary:"The Pinewood community runs regular organized events — mass drills, raid defenses, anniversaries and cross-facility gatherings that test the whole staff.",facts:["The community organizes regular events: mass drills, raid defenses, game anniversaries and cross-facility gatherings.","Raid defenses are a staple — hostile groups attack facilities and the staff must repel them.","Anniversary events celebrate the group's history and release new content.","Events are announced in advance and often require divisions to operate at full strength.","Community event logs are preserved in the archives as some of the group's best stories."]},{title:"Staff Training & Promotions",category:"Pinewood Builders — Group",facility:"Pinewood Builders",author:"Community Archives",classification:"PUBLIC",keywords:["training","promotions","staff","moderator","manager","activity","behavior","advancement","interview"],summary:"Promotions at Pinewood are earned through activity, drills and professionalism — with higher staff training the ranks below them.",facts:["Promotions are earned through activity, participation in drills and demonstrated professionalism.","Higher staff — moderators and managers — are expected to supervise and train lower ranks.","Promotion decisions weigh behavior records maintained by the staff team.","Specialist divisions hold their own qualification tracks, like PBST's officer training.","The promotion system keeps the staff pipeline healthy and the facility culture consistent."]},{title:"The Pinewood Wiki & Community Archives",category:"Pinewood Builders — Group",facility:"Pinewood Builders",author:"Community Archives",classification:"PUBLIC",keywords:["wiki","archives","documentation","records","fandom","lore","history","information"],summary:"The Pinewood wiki and community archives preserve the group's lore, game mechanics and history — the source material for much of this intranet archive.",facts:["The Pinewood wiki and community archives preserve the group's lore, mechanics and history.","Much of this intranet archive is compiled from those community records.","Wiki entries cover every game, division, rank and event in the Pinewood universe.","Community archivists maintain the definitive lists of codes, endings and protocols.","The archives are open to the public and used by new players to learn the culture."]},{title:"PBST — Pinewood Builders Security Team",category:"Pinewood Builders — Divisions",facility:"Pinewood Builders",author:"Security Archives",classification:"PUBLIC",keywords:["pbst","security","team","police","guard","paramilitary","officer","defense","division"],summary:"PBST is the group's private security and paramilitary division — protecting installations, responding to tampering and enforcing on-duty rules with a structured escalation ladder.",facts:["PBST (Pinewood Builders Security Team) is the group's private security and paramilitary division.","They protect Pinewood installations, respond to tampering with core controls, deal with rogue users and enforce on-duty rules.","PBST has its own ranking ladder: Trainees/Cadets up through Tier 1-3 officers, Elite Tiers and Trainers.","Standard protocol requires warning escalation before force against non-aggressive players.","Immediate kill-on-sight applies to saboteurs, exploiters, zombies and hostile factions like rogue TMS members."]},{title:"PET — Pinewood Emergency Team",category:"Pinewood Builders — Divisions",facility:"Pinewood Builders",author:"Emergency Archives",classification:"PUBLIC",keywords:["pet","emergency","fire","rescue","medical","medic","response","firefighting","division"],summary:"PET is Pinewood's elite firefighting and rescue division, deployed to fires, blowouts and meltdown aftermaths across every installation.",facts:["PET (Pinewood Emergency Team) is Pinewood Builders' elite firefighting and rescue division.","PET responds to fires, blowouts, meltdown aftermaths and other disasters across all Pinewood installations.","Members train for emergency containment, evacuation coordination and rescue operations.","PET is often the first division deployed when a core event goes wrong.","The division coordinates with PBST for scene security during major responses."]},{title:"TMS — Technical Management Systems",category:"Pinewood Builders — Divisions",facility:"Pinewood Builders",author:"Engineering Archives",classification:"PUBLIC",keywords:["tms","technical","systems","engineering","maintenance","technician","it","division","access"],summary:"TMS is the engineering and systems division — the technicians who maintain the cores, networks and machinery, holding deep technical access.",facts:["TMS (Technical Management Systems) is Pinewood Builders' engineering and systems division.","Its technicians maintain the cores, networks and machinery across the facilities.","TMS holds deep access to the facilities' technical systems, which is why rogue TMS members are treated as a serious hostile faction.","Legitimate TMS work includes core diagnostics, coolant maintenance and network administration.","The division bridges the engineering staff and the facility command structure."]},{title:"The Moderator & Manager Staff",category:"Pinewood Builders — Divisions",facility:"Pinewood Builders",author:"Community Archives",classification:"PUBLIC",keywords:["moderator","moderators","manager","managers","staff","admin","supervision","discipline"],summary:"Moderators and managers form the community staff layer — supervising roleplay, resolving disputes and managing the divisions.",facts:["Moderators and managers form the community staff layer of Pinewood Builders.","They supervise roleplay, resolve disputes and manage the divisions below them.","Moderator authority includes handling rule violations and escalating serious incidents.","Managers coordinate division operations and liaise with site leadership.","The staff layer is itself ranked, with senior staff overseeing the training of new moderators."]},{title:"The Rogue TMS Faction",category:"Pinewood Builders — Divisions",facility:"Pinewood Builders",author:"Security Archives",classification:"INTERNAL",keywords:["rogue","tms","faction","hostile","sabotage","enemy","insider","threat"],summary:"Rogue TMS members — technicians turned hostile — are treated as one of the most dangerous threats because their insider access allows sabotage from within.",facts:["Rogue TMS members are treated as a serious hostile faction in security protocol.","An untrusted TMS operator can sabotage systems from the inside, which is why their access is closely watched.","Security protocol lists rogue TMS alongside saboteurs and exploiters for kill-on-sight rules.","The faction features in raid scenarios and event storylines across the games.","Facility security maintains a watchlist of technical staff under suspicion."]},{title:"The Innovation Inc Division",category:"Pinewood Builders — Divisions",facility:"Pinewood Builders",author:"HR Records",classification:"PUBLIC",keywords:["innovation inc division","division","iitpp division","join","150","multiplier","membership"],summary:"The Innovation Inc Division is the membership path for IITPP staff, granting the 150-credit sign-on bonus and the permanent 1.5x multiplier.",facts:["The Innovation Inc Division is the membership group for Thermal Power Plant staff.","Joining grants a one-time 150-credit sign-on bonus.","Membership carries a permanent 1.5x credit multiplier on facility tasks.","Division membership is managed through the group system.","It is the recommended first step for any player planning regular shifts at IITPP."]},{title:"Division Switching & !setgroup",category:"Pinewood Builders — Divisions",facility:"Pinewood Builders",author:"Community Archives",classification:"PUBLIC",keywords:["setgroup","division switch","switching","commands","ranktag","group","change division","pbst","pet"],summary:"Players switch between divisions with the group commands — the rank tag must always match the division being roleplayed.",facts:["Players switch between divisions using the standard group commands.","The rank tag must always match the division being roleplayed — !setgroup pbst for security, !setgroup pet for emergency, and so on.","Switching divisions can reset certain accumulated perks.","On-duty staff must be in the correct division group before starting their shift.","Division switching is logged by the group system and audited by the staff team."]},{title:"Recruitment & Applications",category:"Pinewood Builders — Divisions",facility:"Pinewood Builders",author:"HR Records",classification:"PUBLIC",keywords:["recruitment","apply","application","joining","enlist","recruit","requirements","join"],summary:"Recruitment into Pinewood divisions runs through applications reviewed by the staff team, with entry requirements varying by division.",facts:["Recruitment into Pinewood divisions runs through applications reviewed by the staff team.","Entry requirements vary by division — security and emergency divisions hold the strictest gates.","New recruits typically start at the trainee level and train up.","Applications weigh activity history and prior conduct.","The recruitment pipeline keeps the staff roster healthy across all facilities."]},{title:"Thermal Power Plant — The Original",category:"The Other Games",facility:"Pinewood Builders",author:"Community Archives",classification:"PUBLIC",keywords:["thermal power plant","tpp","original","classic","first","coal","coal-fired","game"],summary:"Thermal Power Plant (TPP) is the original Pinewood facility game — the coal-fired plant that started the genre and defined its mechanics.",facts:["Thermal Power Plant (TPP) is the original Pinewood Builders facility game — the one that started the genre.","It is a coal-fired power plant where players keep the boilers burning and the generators spinning.","Many mechanics refined in later games — tasks, credits, staff roles, disaster events — originated here.","The classic meltdown risk is present, with staff working to prevent and respond to it.","Innovation Inc.: Thermal Power Plant is its more elaborate successor."]},{title:"Nuclear Power Plant — The Reactor Game",category:"The Other Games",facility:"Pinewood Builders",author:"Community Archives",classification:"PUBLIC",keywords:["nuclear","npp","reactor","uranium","coolant valves","containment","turbine","game"],summary:"Nuclear Power Plant (NPP) is the older reactor-focused Pinewood game — uranium fuel, steam turbines, coolant valve routing and containment integrity.",facts:["Nuclear Power Plant (NPP) is the older Pinewood Builders game focused on traditional reactor physics.","Players manage uranium fuel, steam turbine operation, coolant valve routing and containment building integrity.","It is the direct predecessor of the Computer Core and shares its meltdown obsession.","A nuclear failure is treated as far harder to walk away from than a thermal one.","The NPP node on the intranet is currently in STANDBY for scheduled maintenance."]},{title:"Pinewood Builders Computer Core — The Sequel",category:"The Other Games",facility:"Computer Core (PBCC)",author:"Community Archives",classification:"PUBLIC",keywords:["computer core","pbcc","sequel","nuclear","meltdown","freezedown","nuke train","launch silo","rocket"],summary:"The Computer Core is the high-tech sequel to the Nuclear Power Plant — a nuclear computer core with meltdown and freezedown risks, Sector G coolant rods and launch-silo rockets.",facts:["Pinewood Builders Computer Core (PBCC) is the high-tech sequel to the Nuclear Power Plant.","It centers on a nuclear computer core vulnerable to both Meltdowns and Freezedowns.","High-security zones like Sector G are protected by access codes, with the primary code 5-33-41-18.","During a meltdown, players fill emergency coolant rods in Sector G to the optimal 69-81% threshold, or evacuate via the launch-silo rockets.","Hazardous Nuke Trains must be managed or deleted from the tracks before they explode."]},{title:"Refined Oil and Gas — The Platform Game",category:"The Other Games",facility:"Oil Platform (PBOP)",author:"Community Archives",classification:"PUBLIC",keywords:["oil","refined","gas","platform","drilling","blowout","pressure","valves","pacific","game"],summary:"Refined Oil and Gas (PBOP) is the Pacific platform game built around fluid pressure systems and the constant risk of catastrophic oil blowouts.",facts:["Refined Oil and Gas — also known as the Oil Platform or PBOP — is set on a massive drilling platform in the Pacific Ocean.","It introduces fluid pressure systems, extraction drills and the risk of catastrophic oil blowouts.","Operators must watch pressure gauges and valve systems constantly.","A pipeline overpressure can escalate into a server-wide blowout event that PET must contain.","The game's pressure mechanics are considered some of the most technical in the Pinewood catalog."]},{title:"The Facility / Core Genre",category:"The Other Games",facility:"Pinewood Builders",author:"Community Archives",classification:"PUBLIC",keywords:["genre","facility","core","disaster","simulation","style","formula","genre definition"],summary:"Pinewood Builders is credited with popularizing the Roblox facility genre: working-staff simulations built around a fragile installation that can fail spectacularly.",facts:["Pinewood Builders is credited with popularizing the Roblox 'facility' genre.","The formula: a core that can melt down or freeze over, a task economy, staff divisions with real hierarchy, and scripted disaster events.","The 'core' is always the heart of the map — control it, and you control the facility.","The genre has been imitated widely, but the originals remain the benchmark.","Every Pinewood game applies the formula with its own hazard twist."]},{title:"Disaster Events Across the Games",category:"The Other Games",facility:"Pinewood Builders",author:"Community Archives",classification:"PUBLIC",keywords:["disaster","events","meltdown","freezedown","blowout","zombie","warhead","comparison","across games"],summary:"Each Pinewood game has its signature disaster — meltdowns everywhere, freezedowns in the Computer Core, blowouts on the platform — all sharing the same response DNA.",facts:["Each Pinewood game has its signature disaster: meltdowns are universal, freezedowns hit the Computer Core hardest, and blowouts are the platform's domain.","All events share the same response DNA: announce, contain, evacuate, recover.","ASAS-style announcement systems broadcast the event in every facility.","The disaster events are scripted to test staff coordination under pressure.","Community drills rehearse cross-game response protocols."]},{title:"Credits Economy Across the Games",category:"The Other Games",facility:"Pinewood Builders",author:"Finance Division",classification:"PUBLIC",keywords:["credits","economy","across games","currency","payouts","salaries","spending","comparison"],summary:"Credits are the shared currency across the Pinewood games, with task payouts and salaries varying by facility and boosted by division multipliers.",facts:["Credits are the shared currency across the Pinewood games.","Task payouts and automated salaries vary by facility and role.","Division multipliers can boost earnings substantially.","Credits fund cosmetics, upgrades and training perks.","The finance division audits credit ledgers to keep the economy stable."]},{title:"The Pinewood Timeline",category:"The Other Games",facility:"Pinewood Builders",author:"Community Archives",classification:"PUBLIC",keywords:["timeline","history","updates","release","chronology","evolution","milestones","history of"],summary:"The Pinewood timeline charts the group's evolution from the original Thermal Power Plant through the Computer Core generation of today.",facts:["The Pinewood timeline charts the group's evolution from the original Thermal Power Plant through the Computer Core generation.","Each major release expanded the genre's mechanics and scope.","The Innovation Inc generation added the corporate layer, ASAS and cross-facility networking.","The Computer Core introduced access codes, Sector G coolant and rocket evacuation.","Community archivists maintain the timeline and debate its finer points."]},{title:"The Innovation Inc Intranet — Network Overview",category:"Intranet & IT",facility:"Core Network",author:"Network Operations",classification:"INTERNAL",keywords:["intranet","network","overview","subnets","10.10","10.20","10.30","10.40","10.50","hub","backbone"],summary:"The Innovation Inc intranet is a private WAN linking every facility, segmented by subnet and terminated at the backbone router intranet-hub (10.10.0.1).",facts:["The Innovation Inc intranet is a private wide-area network linking every company facility.","All sites terminate at the backbone router intranet-hub (10.10.0.1).","Subnets are segmented by facility: 10.10.x core and Sakurajima, 10.20.x Arctic, 10.30.x Desert, 10.40.x Computer Core and Nuclear Plant, 10.50.x Oil Platform.","Eighteen nodes are registered, with shared services running from the core network.","This workstation, iitpp-control-01, sits at 10.10.3.7 on the Sakurajima subnet."]},{title:"intranet-hub — The Backbone Router",category:"Intranet & IT",facility:"Core Network",author:"Network Operations",classification:"INTERNAL",keywords:["intranet-hub","router","backbone","10.10.0.1","gateway","routing","core network"],summary:"intranet-hub is the backbone router of the intranet at 10.10.0.1 — every facility's traffic terminates here.",facts:["intranet-hub is the backbone router of the Innovation Inc intranet at 10.10.0.1.","Every facility's subnet terminates at the hub.","The hub maintains the routing tables that segment traffic by facility.","Its status is reported ONLINE in the intranet directory.","Loss of the hub would isolate every facility — the reason it is on uninterruptible power."]},{title:"innovation-nameserver — DNS & DHCP",category:"Intranet & IT",facility:"Core Network",author:"Network Operations",classification:"INTERNAL",keywords:["nameserver","dns","dhcp","10.10.5.1","domain","resolution","ip","innovation-nameserver"],summary:"innovation-nameserver (10.10.5.1) provides DNS and DHCP for the intranet, resolving node names like pbcc-core into facility addresses.",facts:["innovation-nameserver at 10.10.5.1 provides DNS and DHCP for the intranet.","It resolves node names like pbcc-core and oil-platform into their facility addresses.","DHCP leases are distributed per subnet with static reservations for servers.","The nameserver is a core-network service on uninterruptible power.","nslookup in the Command Prompt queries this server directly."]},{title:"innovation-nfs — The Research Drive",category:"Intranet & IT",facility:"Core Network",author:"Network Operations",classification:"INTERNAL",keywords:["nfs","file server","research drive","10.10.5.2","mount","share","files","innovation-nfs"],summary:"innovation-nfs (10.10.5.2) is the network file server hosting the shared research drive mounted by every facility workstation.",facts:["innovation-nfs at 10.10.5.2 is the network file server for the intranet.","It hosts the shared research drive, mounted by workstations across the facilities.","The Control Room mounts it as /var/research at boot.","Research data, study archives and shared logs live on the drive.","Nightly backups of the drive are handled by the backup server."]},{title:"innovation-mail — The Mail Relay",category:"Intranet & IT",facility:"Core Network",author:"Network Operations",classification:"INTERNAL",keywords:["mail","email","relay","10.10.5.3","iMail","messages","smtp","innovation-mail"],summary:"innovation-mail (10.10.5.3) is the intranet mail relay that carries iMail messages between facility staff.",facts:["innovation-mail at 10.10.5.3 is the intranet mail relay.","It carries iMail messages between facility staff across the intranet.","Contacts use the @innovation-inc domain addressing.","The relay is a core-network service, monitored alongside the API.","iMail on this workstation sends and receives through the relay."]},{title:"The Nightly Backup Server",category:"Intranet & IT",facility:"Core Network",author:"Network Operations",classification:"INTERNAL",keywords:["backup","backups","nightly","server","10.10.5.11","archive","restore","data protection"],summary:"The backup server (10.10.5.11) runs nightly archive jobs across the intranet, protecting the research drive and facility logs.",facts:["The nightly backup server at 10.10.5.11 archives data across the intranet.","The research drive and facility logs are the primary backup targets.","Backup windows open nightly at 0930 intranet time.","Restores are tested quarterly to verify archive integrity.","Backup status is reported to the monitoring API."]},{title:"This Workstation — iitpp-control-01",category:"Intranet & IT",facility:"IITPP — Sakurajima",author:"IT Support",classification:"INTERNAL",keywords:["workstation","iitpp-control-01","10.10.3.7","control room","computer","console","hardware"],summary:"iitpp-control-01 is the Control Room workstation this archive runs on — an IRIX 5.3 node at 10.10.3.7 with MIPS R4000 hardware.",facts:["iitpp-control-01 is the Control Room workstation at 10.10.3.7 on the Sakurajima subnet.","It runs IRIX 5.3 on MIPS R4000 hardware with 96 MB of memory.","The workstation mounts the research drive, runs the monitoring tools and hosts the ASAS/AURA interface.","It is the node from which this 500-document intranet archive is searchable.","Its console design mirrors the 1993-era control room computers of the original facility films."]},{title:"Terminal & Shell Commands",category:"Intranet & IT",facility:"IITPP — Sakurajima",author:"IT Support",classification:"PUBLIC",keywords:["terminal","shell","commands","command prompt","cmd","unix","ls","cd","systeminfo","help"],summary:"The Control Room runs a full command environment — an IRIX Unix shell plus a Windows-style Command Prompt for the full intranet toolkit.",facts:["The Terminal provides a full Unix-style shell with ls, cd, cat, mkdir, rm and the developer suite.","The Command Prompt mode provides a Windows-style environment with dir, copy, type, ping, ipconfig and net.","systeminfo reports detailed system and intranet information, including live monitoring API data.","The intranet command lists every node on the network.","Both shells share the same virtual filesystem, mapping between / and C:\\ paths."]},{title:"Network Security & Firewalls",category:"Intranet & IT",facility:"Core Network",author:"Security Operations",classification:"RESTRICTED",keywords:["firewall","security","network security","access control","segmentation","blocked","encryption","vpn"],summary:"Intranet security relies on per-facility segmentation, access controls and encrypted board links — with the core network carrying the highest classification.",facts:["Intranet security relies on per-facility subnet segmentation.","Access to restricted systems requires senior clearance.","Board communications are encrypted end to end.","The core network carries the highest classification of any segment.","Security audits are run quarterly by the Network Operations Center."]},{title:"Dr. Yuki Tanaka — Senior Reactor Physicist",category:"Personnel & Staff",facility:"IITPP — Sakurajima",author:"Personnel Records",classification:"PUBLIC",keywords:["yuki tanaka","tanaka","physicist","reactor","senior","scientist","core","research"],summary:"Dr. Yuki Tanaka is the Senior Reactor Physicist at IITPP, the lead author of the core stability and fuel energy-density studies in the research archive.",facts:["Dr. Yuki Tanaka is the Senior Reactor Physicist at the Innovation Inc Thermal Power Plant.","She is the lead author of the core temperature stability analysis and the magma crystal energy density report.","Her research group maintains the predictive core models used by the Control Room.","She coordinates with the Arctic and Desert facilities on cross-site studies.","She is a known contact on the workstation's iMail contacts list."]},{title:"Dr. James Mitchell — Lead Cryogenics Engineer",category:"Personnel & Staff",facility:"Innovation Inc Arctic Facility",author:"Personnel Records",classification:"PUBLIC",keywords:["james mitchell","mitchell","cryogenics","arctic","engineer","cold","freeze","low-temperature"],summary:"Dr. James Mitchell leads the Arctic Facility's cryogenics research, specializing in low-temperature reactor dynamics and coolant efficiency.",facts:["Dr. James Mitchell is the Lead Cryogenics Engineer at the Innovation Inc Arctic Facility.","His research focuses on low-temperature reactor dynamics, referenced during every freezedown drill.","His facility's cooling loop achieves 96% efficiency in -40C ambient conditions.","He is the author of the coolant flow dynamics study in the research archive.","He is a known iMail contact and frequently collaborates with the Sakurajima team."]},{title:"Sarah Chen — Systems Integration Lead",category:"Personnel & Staff",facility:"Innovation Inc Desert Complex",author:"Personnel Records",classification:"PUBLIC",keywords:["sarah chen","chen","systems","integration","desert","noc","network","lead"],summary:"Sarah Chen leads the Desert Complex's systems integration — owner of the cross-facility intranet, the monitoring API and the desert logistics network.",facts:["Sarah Chen is the Systems Integration Lead at the Innovation Inc Desert Complex.","She owns the cross-facility intranet, the monitoring API and the desert logistics network.","Her NOC handles 3000+ cubes a day and keeps every facility's telemetry in sync.","She co-funded the Sakurajima annealing experiments with the Desert Complex's solar furnace.","She is a known iMail contact and the author of the intranet architecture report."]},{title:"Dr. Robert Kim — Chief Safety Officer",category:"Personnel & Staff",facility:"IITPP — Sakurajima",author:"Personnel Records",classification:"PUBLIC",keywords:["robert kim","kim","safety","officer","chief","radiation","safeguard","dosimetry"],summary:"Dr. Robert Kim is the Chief Safety Officer at IITPP, overseeing radiation containment, the safeguard system and the facility's drill program.",facts:["Dr. Robert Kim is the Chief Safety Officer at the Innovation Inc Thermal Power Plant.","He oversees radiation containment, dosimetry and the safeguard system's readiness program.","He authored the radiation containment effectiveness report and the safeguard response benchmark.","He runs the monthly drill schedule and the evacuation exercises.","He is a known iMail contact on the workstation."]},{title:"Officer Yu — Security Operations Lead",category:"Personnel & Staff",facility:"IITPP — Sakurajima",author:"Personnel Records",classification:"PUBLIC",keywords:["officer yu","yu","security","operations","lead","pbst","patrol","hub"],summary:"Officer Yu leads Security Operations at IITPP, coordinating patrols, camera monitoring and event response from the Security Hub.",facts:["Officer Yu is the Security Operations Lead at the Innovation Inc Thermal Power Plant.","He coordinates patrols, camera monitoring and event response from the Security Hub.","He commands the PBST officers on shift and enforces the escalation ladder.","His response protocols cover zombies, breaches and core-control tampering.","He is a known iMail contact on the workstation."]},{title:"Connor Moran — The Research Account",category:"Personnel & Staff",facility:"IITPP — Sakurajima",author:"Personnel Records",classification:"PUBLIC",keywords:["connor moran","moran","researcher","account","connor.moran7","login","research staff"],summary:"Connor Moran is the researcher whose account (connor.moran7) owns this Control Room workstation — a research staff member with full intranet archive access.",facts:["Connor Moran is the researcher whose account (connor.moran7) owns this Control Room workstation.","The account holds the facility's research clearance and full intranet archive access.","Moran's shift notes cover laser recalibration, coolant analysis and the safeguard drills.","The account is often confused with Connor Rogers, the Lead Software Engineer — a different person.","Multi-user registration now lets additional staff create their own accounts on this node."]},{title:"The Shift Engineer Role",category:"Personnel & Staff",facility:"IITPP — Sakurajima",author:"HR Records",classification:"PUBLIC",keywords:["shift engineer","engineer","role","job","maintenance","boilers","tasks","shift work"],summary:"Shift engineers are the workhorse staff of IITPP — completing maintenance tasks, watching the boilers and responding to equipment failures.",facts:["Shift engineers are the workhorse staff of the plant, completing the routine task loop.","Their jobs cover general maintenance, door fixes, boiler watch and equipment failure response.","Task payouts form their primary income, boosted by division multipliers.","Shift engineers report to the operations chain and answer to the Site Director during events.","Most new staff start in this role and train up into specialist divisions."]},{title:"The Security Officer Role",category:"Personnel & Staff",facility:"IITPP — Sakurajima",author:"PBST Records",classification:"PUBLIC",keywords:["security officer","officer","pbst","role","patrol","guard","escalation","duty"],summary:"PBST security officers patrol the facility, guard the core controls and enforce the escalation ladder — from verbal warnings to lethal force rules.",facts:["PBST security officers patrol the facility and guard the core controls.","They enforce the escalation ladder: verbal warning, warning strike, single taser, then lethal force if required.","Kill-on-sight rules apply to saboteurs, exploiters, zombies and rogue factions.","Officers report through the Security Hub chain of command.","Officer ranks progress from Trainee through Tier 1-3, Elite and Trainer."]},{title:"The Emergency Responder Role",category:"Personnel & Staff",facility:"Pinewood Builders",author:"PET Records",classification:"PUBLIC",keywords:["emergency responder","pet","medic","firefighter","role","rescue","response"],summary:"PET emergency responders are the firefighting and rescue specialists deployed when events go wrong — the first division on scene.",facts:["PET emergency responders are the firefighting and rescue specialists of the Pinewood universe.","They are the first division deployed when a core event goes wrong.","Their training covers fire suppression, evacuation coordination and rescue operations.","Responders work alongside PBST, which secures the scene while PET operates.","The role is among the most demanding in the division system."]},{title:"The Facility Technician Role",category:"Personnel & Staff",facility:"IITPP — Sakurajima",author:"TMS Records",classification:"PUBLIC",keywords:["technician","tms","role","maintenance","repair","systems","diagnostics","machinery"],summary:"TMS technicians maintain the facility's machinery and systems — diagnostics, coolant work and network administration under the engineering chain.",facts:["TMS technicians maintain the facility's machinery and systems.","Their work covers core diagnostics, coolant maintenance and network administration.","Technicians hold deep access to technical systems, which is closely monitored.","The role bridges shift engineering and the specialist engineering divisions.","Rogue TMS operators are treated as a serious threat precisely because of this access."]},{title:"Health Physics & Dosimetry Staff",category:"Personnel & Staff",facility:"IITPP — Sakurajima",author:"Safety Division",classification:"INTERNAL",keywords:["dosimetry","health physics","radiation","staff","dosimeters","monitoring","exposure"],summary:"Health physics staff manage the dosimetry program — issuing dosimeters, tracking exposure and auditing instrument calibration.",facts:["Health physics staff manage the facility's dosimetry program.","They issue dosimeters and track personnel exposure against administrative limits.","Instrument calibration is audited to prevent the temperature-fault errors seen in past surveys.","Wear compliance currently stands at 97%.","Their survey data feeds the quarterly radiation containment reports."]},{title:"Tram & Logistics Crew",category:"Personnel & Staff",facility:"IITPP — Sakurajima",author:"HR Records",classification:"PUBLIC",keywords:["tram","logistics","crew","driver","dispatch","delivery","cubes","staff"],summary:"The logistics crew runs deliveries between Storage Distribution and the sectors — dispatching cubes and barrels on the tram network.",facts:["The logistics crew manages deliveries between Storage Distribution and the sectors.","They dispatch cubes and barrels onto the tram network by destination sector.","Average dispatch time is three to four minutes per delivery.","The crew coordinates with the tram control system during events.","Logistics roles are a reliable credit-earning path for new staff."]},{title:"Radiation Containment & Dosimetry",category:"Safety & Security",facility:"IITPP — Sakurajima",author:"Safety Division",classification:"INTERNAL",keywords:["radiation","containment","dosimetry","shield","μSv","exposure","survey","sectors"],summary:"The eight-sector containment shield holds facility ambient radiation at 3.2 μSv/h — well inside the 50 μSv/h design rating.",facts:["The eight-sector containment shield is the primary barrier separating personnel from the reactor's radiation field.","Its design rating is 50 μSv/h sustained ambient exposure at the shield face.","Whole-facility ambient radiation averages 3.2 μSv/h, consistent across quarterly audits.","The highest mean sector reading is 4.5 μSv/h in Sector D; the lowest is 1.8 μSv/h in Sector B.","Dosimeter wear compliance stands at 97%, and instrument calibration is audited to prevent faults."]},{title:"Safeguard Response Benchmark",category:"Safety & Security",facility:"IITPP — Sakurajima",author:"Safety Division",classification:"INTERNAL",keywords:["safeguard","response","benchmark","4.2","drill","activation","timing","chain"],summary:"Twenty timed safeguard drills benchmarked the full activation chain at a median of 4.2 seconds from key turn to rod insertion.",facts:["Twenty timed drill activations benchmarked the complete safeguard chain.","Median full-chain engagement time was 4.2 seconds from key turn to rod insertion.","The 95th percentile was 5.8 seconds; the interlock and rod stroke account for 1.1 seconds.","Human authorization latency is the dominant variable, degrading under stress and shift handover.","Success probability falls from 95% below 2500K to 30% at 3500K."]},{title:"Access Control & Keycards",category:"Safety & Security",facility:"IITPP — Sakurajima",author:"Security Operations",classification:"INTERNAL",keywords:["access","keycards","badges","keypad","clearance","control","doors","permission"],summary:"Access control at IITPP combines keypads, keycards and manual keys, with clearance levels restricting the core and facility control rooms.",facts:["Access control combines keypads, keycards and manual keys across the facility.","Core Control uses keypad 7342-1; Facility Control uses 3129-8; the bunker uses manual keys.","Clearance levels restrict the core and facility control rooms to senior staff.","Badge scans are logged, and expired badges are refused at the door.","Security audits the access logs for unusual patterns."]},{title:"Kill-On-Sight Rules",category:"Safety & Security",facility:"IITPP — Sakurajima",author:"PBST Records",classification:"RESTRICTED",keywords:["kos","kill on sight","rules","saboteur","exploiter","zombie","rogue","hostile"],summary:"Kill-on-sight applies to explicit saboteurs, known exploiters, zombies and hostile opposing factions — everyone else gets the warning escalation ladder.",facts:["Immediate kill-on-sight applies to explicit saboteurs, known exploiters, zombies and hostile opposing factions such as rogue TMS members.","Everyone else — including non-aggressive tamperers — receives the warning escalation ladder first.","The rules exist to protect the core controls, the facility's most critical asset.","Officers are tested on the distinction during security drills.","Violations of the escalation rules are reviewed by the staff team."]},{title:"Warning Escalation Policy",category:"Safety & Security",facility:"IITPP — Sakurajima",author:"PBST Records",classification:"INTERNAL",keywords:["warning","escalation","policy","taser","verbal","strike","force","ladder"],summary:"The warning escalation policy governs the use of force: verbal warning, warning strike, a single taser, and only then lethal force.",facts:["The escalation policy governs force against non-aggressive players.","The ladder: verbal warning, then a warning strike, then a single taser.","Only after escalation fails may security use lethal force.","The policy exists to keep roleplay fair while protecting the core.","Officers who skip steps face review by the staff team."]},{title:"Perimeter Security",category:"Safety & Security",facility:"IITPP — Sakurajima",author:"Security Operations",classification:"INTERNAL",keywords:["perimeter","security","fence","gates","sensors","patrol","motion","breach"],summary:"The perimeter is protected by motion sensors, fence contact monitors and PTZ cameras, patrolled and cleared by the security division.",facts:["The perimeter is protected by motion sensors, fence contact monitors and PTZ cameras.","Perimeter events are logged and cleared by patrols.","Most alarms are false positives — wind, wildlife or loose panels.","The perimeter gates require keycard plus PIN to enter.","Patrols run on a schedule and report through the Security Hub."]},{title:"Hazardous Materials Handling",category:"Safety & Security",facility:"IITPP — Sakurajima",author:"Safety Division",classification:"INTERNAL",keywords:["hazmat","hazardous","materials","barrels","handling","storage","chemicals","containment"],summary:"Hazardous materials — including hazmat-class barrels and magma-crystal fuel — follow rated handling, storage and transport rules.",facts:["Hazardous materials follow rated handling, storage and transport rules.","Hazmat-class barrels are stored separately and moved in rated cages.","Magma-crystal fuel rods must stay below 470K and separated from oxidizers.","Handling logs record every hazmat movement through Storage Distribution.","Safety audits verify hazmat procedures quarterly."]},{title:"Incident Reporting Procedure",category:"Safety & Security",facility:"IITPP — Sakurajima",author:"Safety Division",classification:"INTERNAL",keywords:["incident","reporting","report","procedure","logs","after-action","review","documentation"],summary:"Every incident at IITPP is documented — from minor sensor faults to major events — with after-action reviews feeding the training program.",facts:["Every incident at IITPP is documented in the facility logs.","Minor events generate report entries; major events trigger after-action reviews.","Reviews feed the training program and update the protocol manuals.","Log files like system.log, security.log and reactor.log record the timeline.","Incident reports are searchable in the intranet archive."]},{title:"Earning Credits — The Task Loop",category:"Credits & Economy",facility:"IITPP — Sakurajima",author:"Finance Division",classification:"PUBLIC",keywords:["earning","credits","tasks","task loop","maintenance","doors","beams","payout"],summary:"Credits are earned through the facility task loop — maintenance, door fixes, beam handling and equipment failures all pay out per completion.",facts:["Credits are earned by completing routine facility tasks.","The task loop covers general maintenance, fixing doors, handling beams and responding to equipment failures.","Each task pays a fixed credit amount, tracked by the facility systems.","Task availability scales with staff activity — busier facilities generate more work.","Division multipliers increase every task payout."]},{title:"Salaries & Automated Pay",category:"Credits & Economy",facility:"IITPP — Sakurajima",author:"Finance Division",classification:"PUBLIC",keywords:["salary","salaries","automated pay","pay","wages","income","role","payout"],summary:"Higher-ranked staff receive automated salaries paid on a schedule, in addition to task-based credit income.",facts:["Automated salaries vary by role and are paid on a schedule.","Higher ranks receive larger base pay.","Salaries supplement task-based credit income.","Division multipliers apply to salaries as well as task payouts.","The finance division maintains the pay tables and audits the ledgers."]},{title:"Division Multipliers & Bonuses",category:"Credits & Economy",facility:"IITPP — Sakurajima",author:"Finance Division",classification:"PUBLIC",keywords:["multiplier","bonus","division","150","1.5","boost","earnings","perk"],summary:"Division membership multiplies earnings — the Innovation Thermal Power Plant Division grants +150 credits and a permanent 1.5x multiplier.",facts:["Division membership can boost earnings significantly.","The Innovation Thermal Power Plant Division grants +150 credits on sign-on.","Its permanent 1.5x multiplier applies to all facility tasks.","Multipliers compound with automated salaries.","HR guidance recommends joining before long shifts for maximum benefit."]},{title:"Spending Credits — Cosmetics & Upgrades",category:"Credits & Economy",facility:"IITPP — Sakurajima",author:"Finance Division",classification:"PUBLIC",keywords:["spending","cosmetics","upgrades","shop","purchase","buy","store","perks"],summary:"Credits fund cosmetics, upgrades and training perks, giving staff a reason to keep the task loop turning.",facts:["Credits are spent on cosmetics, upgrades and in some facilities on training or division perks.","The credit shop is the facility's reward layer for consistent work.","Cosmetics include uniform variations and accessories.","Upgrades improve tools and facility efficiency.","The economy is balanced so regular shift work funds steady progression."]},{title:"The 1.5x Permanent Multiplier",category:"Credits & Economy",facility:"IITPP — Sakurajima",author:"Finance Division",classification:"PUBLIC",keywords:["1.5","multiplier","permanent","division","credit multiplier","boost"],summary:"The permanent 1.5x multiplier is the flagship perk of Innovation Thermal Power Plant Division membership.",facts:["The permanent 1.5x credit multiplier is the flagship perk of the Innovation Thermal Power Plant Division.","It applies to all tasks completed at the facility.","Unlike temporary boosts, it never expires.","It makes division membership strongly worth it for regular shift workers.","The multiplier is tracked in the credit ledger and applied automatically."]},{title:"Credit Ledger & Audits",category:"Credits & Economy",facility:"IITPP — Sakurajima",author:"Finance Division",classification:"INTERNAL",keywords:["ledger","audit","accounting","balance","tracking","finance","records"],summary:"The finance division maintains the credit ledger, auditing balances and task payouts to keep the facility economy stable.",facts:["The finance division maintains the facility credit ledger.","Ledger audits verify task payouts and salary disbursements.","Audits run monthly and investigate any balance discrepancies.","The economy is balanced so that division multipliers remain meaningful.","Credit records are searchable in the finance category of the archive."]},{title:"The Founding of the Sakurajima Facility",category:"History & Lore",facility:"IITPP — Sakurajima",author:"Corporate Archives",classification:"PUBLIC",keywords:["founding","sakurajima","history","built","construction","volcano","original","established"],summary:"The Sakurajima facility was founded when Innovation Inc chose the active volcano as the site for its magma-fueled power experiment.",facts:["The Sakurajima facility was founded when Innovation Inc selected the active volcano as the site for its magma-fueled power experiment.","Construction was controversial — building a power plant inside an active volcano is exactly as risky as it sounds.","The volcano's heat supply solved the plant's core problem: a self-sustaining thermal source.","The first lava-crystal charge was inserted in the facility's founding year, and the plant has run continuously since.","The founding is commemorated in the facility archives every anniversary."]},{title:"The 2024 Silicate-Blend Incident",category:"History & Lore",facility:"IITPP — Sakurajima",author:"Research Wing",classification:"INTERNAL",keywords:["2024","silicate","blend","incident","fuel","excursion","historical","crystal"],summary:"The 2024 silicate-blend fuel charge produced the plant's worst core variance on record — ±47K per 72-hour window — and drove the switch back to lava crystals.",facts:["The 2024 silicate-blend fuel charge produced the plant's worst core variance on record: ±47K per 72-hour window.","The blend was an experiment in cheaper fuel, and it failed its stability target.","Core excursions in the period triggered repeated safeguard warnings.","The plant reverted to production lava crystals and never re-blended silicate at scale.","The incident shaped the research program's fuel-assay discipline."]},{title:"The Lava-Crystal Breakthrough",category:"History & Lore",facility:"IITPP — Sakurajima",author:"Research Wing",classification:"PUBLIC",keywords:["lava","crystal","breakthrough","fuel","discovery","energy density","research","innovation"],summary:"The discovery that charged magma crystals could sustain a reactor core at 3.4 GJ/kg was the breakthrough that made the Sakurajima plant viable.",facts:["The discovery that charged magma crystals could sustain a reactor core was the breakthrough that made Sakurajima viable.","Production crystals deliver 3.4 GJ/kg, far beyond conventional fuel.","The theoretical ceiling of 4.1 GJ/kg drives the ongoing annealing research.","The breakthrough is credited to the facility's founding research team.","It is the most-cited study in the research archive."]},{title:"The Merger of ASAS & AURA",category:"History & Lore",facility:"IITPP — Sakurajima",author:"IT Support",classification:"INTERNAL",keywords:["asas","aura","merger","merged","assistant","announcement","v3","upgrade","history"],summary:"This workstation generation fuses ASAS and AURA into a single announcement-and-research assistant, speaking in the facility PA voice.",facts:["This workstation generation fuses ASAS and AURA into a single merged intelligence.","The merge combines the facility announcement system with the research assistant's knowledge base.","It speaks in the formal PA voice: attention lines, priority levels and END OF ANNOUNCEMENT closings.","The merge was overseen by the software engineering team under Connor Rogers.","It is the defining feature of the IITPP-6 software generation."]},{title:"The Rivalry Debate — Community Lore",category:"History & Lore",facility:"Pinewood Builders",author:"Community Archives",classification:"PUBLIC",keywords:["rivalry","debate","lore","community","who controls","pinewood vs innovation","factions","theory"],summary:"The community has long debated whether Pinewood Builders or Innovation Inc truly controls the Sakurajima facility — a rivalry that lives on in the protocols.",facts:["The community has long debated which organization truly controls the Sakurajima facility.","Loyalists of either faction appear throughout the security and emergency protocols.","Corporate records describe the relationship as 'a partnership and, at times, a rivalry'.","The debate is a staple of community lore threads and wiki discussions.","Both sides claim the facility's successes in the archives."]},{title:"The Truth Ending Discovery",category:"History & Lore",facility:"IITPP — Sakurajima",author:"Community Archives",classification:"PUBLIC",keywords:["truth ending","discovery","secret","found","community","uncovered","sticky notes","unlocked"],summary:"The Truth Ending was uncovered by community explorers who mapped the sticky-note spawns and cracked the randomized code sequences.",facts:["The Truth Ending was discovered by community explorers who mapped the sticky-note spawns.","They cracked the pattern behind the randomized code sequences.","The discovery generated a wave of documentation and theory threads.","Every round re-randomizes the notes and codes, so the hunt never truly ends.","The discovery is one of the community's proudest collaborative achievements."]},{title:"The IITPP Software Generation Timeline",category:"History & Lore",facility:"IITPP — Sakurajima",author:"IT Support",classification:"PUBLIC",keywords:["iitpp","generation","timeline","versions","iitpp-4","iitpp-5","iitpp-6","updates","software"],summary:"The workstation software has evolved through numbered generations — from the original scientific suite through the developer tools and the intranet-connected IITPP-6.",facts:["The workstation software has evolved through numbered generations, each adding major capabilities.","IITPP-4 introduced the draggable developer-tool desktop.","IITPP-5 connected the workstation to the full Innovation Inc intranet with a Command Prompt shell.","IITPP-6 adds the 500-document intranet search archive and multi-user registration.","Each generation ships as a single offline HTML file named after its version."]},{title:"The Future of Innovation Inc",category:"History & Lore",facility:"Innovation Inc HQ",author:"Corporate Archives",classification:"INTERNAL",keywords:["future","expansion","roadmap","plans","next","new facilities","innovation","prospects"],summary:"Corporate records sketch a future of further expansion — deeper into nuclear computing, offshore energy and cross-facility automation.",facts:["Corporate records sketch a future of further expansion for Innovation Inc.","The Computer Core's nuclear computing program is the current focus of investment.","Offshore energy operations are slated for expansion after the Oil Platform's success.","Cross-facility automation — led by the Desert Complex — is the engineering priority.","The board's roadmap is updated quarterly and remains restricted corporate material."]}];function Pv(o,a,r){const l=r===0?o.title:`${o.title} — Archive Brief ${r}`;return[`IRIS ARCHIVE DOSSIER ${String(a).padStart(3,"0")} — ${l}. This ${o.classification.toLowerCase()} record is maintained for researchers connected to the Innovation Inc intranet. It covers ${o.facility} and is indexed under ${o.category}.`,o.summary,...o.facts,"Operational context: the record is cross-referenced with Control Room teleme
