/* Recursive fibonacci — tests calls, params and arithmetic */
int fib(int n) {
    if (n < 2) return n;
    return fib(n - 1) + fib(n - 2);
}

#include <math.h>

/* Reactor core temperature simulation */
float core_temp = 2180.0;

int main() {
    int t;
    float coolant = 420.0;
    for (t = 0; t < 10; t++) {
        core_temp = core_temp + (core_temp > 2500.0 ? -120.0 : 60.0);
        coolant = coolant - 8.0;
        printf("t=%d  core=%.0fK  coolant=%.0f L/s  sqrt=%f\\n",
               t, core_temp, coolant, sqrt(coolant));
    }
    printf("Final core temperature: %.1f K\\n", core_temp);
    return 0;
}

all: hello fib reactor

C     MIPSpro f77 7.3.1 - fixed form, columns 1-72
      PROGRAM THERMAL
      INTEGER I
      REAL TEMP, COOL, DELTA
      TEMP = 2180.0
      COOL = 420.0
      DELTA = 12.0
      PRINT *, 'Initial core temperature ', TEMP, ' K'
      DO 10 I = 1, 10
        TEMP = TEMP + DELTA
        COOL = COOL - 8.0
        PRINT *, 'cycle ', I, ': core ', TEMP, ' K  coolant ', COOL
   10 CONTINUE
      PRINT *, 'Final core temperature ', TEMP, ' K'

Designer`,icon:"🧊",app:"cad3d"}],b0=[{id:1,title:"Core Temperature Stability Analysis",author:"Dr. Y. Tanaka",date:"2026-07-30",status:"Published",citations:24,abstract:`BACKGROUND — The Innovation Inc Thermal Power Plant (IITPP), Sakurajima Facility, derives its baseload output from a magma-fed lava-crystal core held in sustained thermal reaction inside Reactor Sector C. Reliable grid dispatch at a nominal 850 MW requires the core to remain within a narrow operating band: excursions toward the 3000K safety ceiling trigger safeguard intervention, while deep thermal sag reduces steam quality and forces turbine throttling in the Turbine Hall. This study reports a longitudinal stability analysis of core temperature under sustained baseload, using the IITPP research workstations (MIPS R4000, IRIX 5.3) to collect and model forty-two consecutive days of reactor telemetry from the core_temp.mon and coolant.mon archives. Data acquisition ran unattended across both day and night load profiles, capturing two full maintenance cycles and one brief turbine trip that provide rare natural experiments in core response to abrupt thermal demand changes.
METHODOLOGY — Core temperature, coolant flow, turbine RPM and laser-alignment telemetry were sampled at ten-second resolution and reduced to hourly means. Variance was decomposed into diurnal, tidal and load-following components using a moving-window Fourier analysis implemented in Fortran 77 on the Control Room node. The 72-hour rolling variance statistic was computed for every window in the record, and coolant-flow lag correlations were tested at offsets of 5, 10, 20 and 40 minutes.
FINDINGS — The lava-crystal configuration maintained a peak-to-peak variance of only ±12K over every 72-hour window, versus ±31K for the previous silicate-blend charge and ±47K for the 2024 reference period. Coolant flow was confirmed as a leading indicator of thermal excursion risk: flow dips exceeding 8% of the 420 L/s setpoint preceded 91% of all upward core excursions by 18–24 minutes. The predictive model built on this lag correctly forecast the two soft-excursion events observed in the study window, with mean lead time of 21 minutes.
DISCUSSION — The stability improvement is attributed to three factors: the higher thermal mass of the lava-crystal charge, the re-tuned laser alignment array (see entry #2), and the revised pump-cycling protocol (see entry #3). The 18–24 minute predictive window is operationally significant because it exceeds the 4.2 second safeguard engagement time by three orders of magnitude, giving operators a genuine decision horizon rather than a reaction mandate. It also supports a load-following strategy: the model suggests the plant can safely accept up to 40 MW of short-duration demand ramps without exceeding ±15K excursion, information that directly informs the grid dispatch agreement negotiated quarterly with the regional utility.
CONCLUSION — Current fuel configuration is fit for sustained baseload service. Recommended actions: (a) deploy the coolant-lag predictor on the Systems Dashboard readout, (b) extend monitoring through the winter load peak, and (c) trigger formal review if any 72-hour window exceeds ±20K. The study team further recommends publishing the 72-hour variance statistic on the shared cross-facility dashboard so the Arctic and Desert facilities can benchmark their own thermal stability against Sakurajima.
KEYWORDS — core temperature, lava-crystal fuel, thermal stability, coolant flow, predictive telemetry, Sakurajima.`},{id:2,title:"Laser Alignment Optimization Study",author:"Researcher Team",date:"2026-07-29",status:"In Review",citations:7,abstract:`BACKGROUND — The IITPP power generation loop relies on an array of four secondary power lasers to focus and sustain thermal input on the lava-crystal core. Misalignment manifests as asymmetric heating, hot-spot formation on the crystal lattice, and reduced energy coupling efficiency. The 2025 baseline campaign measured an RMS beam-centre drift of 0.42 mm over eight-hour burns, which contributed directly to the ±31K core variance recorded in that reference period (see entry #1). This paper evaluates a new closed-loop feedback-alignment algorithm deployed on the laser gimbal controllers in Sector C.
METHODOLOGY — Forty test burns were executed across four configurations: (1) the 2025 open-loop baseline, (2) feedback alignment with the legacy proportional controller, (3) the new predictive feedback algorithm with feed-forward temperature compensation, and (4) configuration (3) combined with a prototype damped-gimbal hardware revision. Beam-centre position was captured at 5 Hz by the alignment cameras and logged to the research filesystem under /var/research/laser/. Drift statistics were computed over one-hour, four-hour and eight-hour windows. Thermal imaging of the crystal face was taken before and after each burn to quantify hot-spot formation, and the alignment cameras were re-referenced against the mechanical datum before every run to remove day-to-day mounting error. Ambient temperature was logged continuously, since earlier campaigns had shown a strong correlation between afternoon thermal gradient and drift.
RESULTS — The new predictive algorithm reduced RMS drift by 15.3% versus the 2025 baseline (0.42 mm to 0.36 mm), with a 42% reduction in peak instantaneous deviation. Adding the damped-gimbal hardware revision yielded a further reduction to 0.31 mm, a cumulative 26.2% improvement, and eliminated the low-frequency oscillation mode previously observed at 0.03 Hz during long burns. Energy coupling efficiency improved by 2.1 percentage points, correlating with the improved core variance measured concurrently. Beam power stability over the eight-hour windows improved from ±1.8% to ±1.1%, further evidence that closed-loop control is suppressing the thermal oscillation that degraded earlier burns.
DISCUSSION — The residual drift is dominated by thermal expansion of the gimbal support structure, which the feed-forward compensation addresses only partially. The damped mounts show promise but increase maintenance burden; a field trial of at least 90 days is recommended before fleet-wide adoption. Drift is strongly seasonal, peaking during the summer afternoon thermal gradient, which should be modelled separately. A significant finding is that the feed-forward compensation must be tuned per laser: laser 2, mounted closest to the coolant risers, exhibits roughly 40% less thermal drift than laser 4, and a single set of coefficients applied to all four units measurably degrades the best performers. Per-laser tuning tables have been added to the alignment controller firmware for validation in the 90-day field trial.
CONCLUSION — The new feedback algorithm is approved for operational deployment. The hardware revision remains under evaluation pending the long-duration field trial. The seasonal drift data will also feed the core variance model maintained by Dr. Tanaka's group (entry #1).
KEYWORDS — laser alignment, gimbal drift, feedback control, beam stability, energy coupling, IITPP.`},{id:3,title:"Coolant Flow Dynamics at High RPM",author:"Dr. J. Mitchell",date:"2026-07-28",status:"Published",citations:31,abstract:`BACKGROUND — The closed-loop coolant system that keeps the IITPP core and Turbine Hall within safe operating temperature moves 420 L/s of treated coolant through four parallel pump trains at up to 3,600 RPM turbine coupling. Cavitation in the pump impellers has been the dominant source of efficiency loss, eroding vanes, generating vibration alarms on the Reactor Monitor, and dragging sustained cooling efficiency down to 91% in warm-weather operation at Sakurajima. This cross-facility study compares cavitation behaviour at the Sakurajima plant with the Arctic Facility's cryogenic cooling loop, where ambient temperatures below freezing fundamentally alter vapour-pressure margins.
METHODOLOGY — Acoustic cavitation signatures were captured with hydrophone arrays on pump trains 1–4 at both facilities over a 60-day window. Impeller erosion was quantified by periodic laser-scanned vane profiles, and cooling efficiency was derived from the flow/energy balance maintained in the Storage.Dist and reactor logs. A pump-cycling protocol — alternating pumps onto a 72-hour duty cycle — was designed to limit continuous residence time at the highest differential pressure.
FINDINGS — At Sakurajima, cavitation onset occurred at 82% of rated flow in continuous operation, with acoustic signature peaking during shift-change demand spikes. The 72-hour cycling protocol reduced cavitation events by 89% and lifted sustained cooling efficiency from 91% to 96% in sub-zero Arctic ambient conditions; at Sakurajima the improvement was 91% to 94.2%, limited by the warmer suction temperature. Impeller erosion rate fell by two-thirds under cycling, projecting a threefold extension of vane service life. Pump train 3, the oldest unit, showed the largest absolute improvement: measured efficiency rose from 89.7% to 93.1% after two weeks of cycling, consistent with the model prediction that trains with the most accumulated erosion benefit most from interrupted duty. Vibration alarm frequency on the Reactor Monitor fell from an average of eleven per shift to two.
DISCUSSION — The vapour-pressure margin is the governing variable: every 10K of suction-temperature reduction doubles the safe flow envelope. Arctic performance therefore cannot be replicated at Sakurajima without suction cooling, but the cycling protocol transfers cleanly and delivers a measurable, maintenance-reducing gain. The 0.5 Hz cavitation pulsation observed at 96% of rated flow suggests a resonance with the turbine RPM harmonic that merits a follow-up study. The pulsation phase-locks with the turbine harmonic during grid frequency excursions, implying a mechanical coupling path through the shared foundation plinth; a vibration-isolation assessment is recommended before the winter load peak, when grid excursions are most frequent.
CONCLUSION — Adopt the 72-hour cycling protocol at both facilities. Pump train 3 at Sakurajima, with the highest cumulative vane erosion, is due for proactive replacement in the next maintenance window. A cost-benefit annex prepared with the Distribution division estimates the cycling protocol saves the equivalent of 2.1% of annual coolant energy losses at Sakurajima, comfortably offsetting the additional valve wear from more frequent duty transitions.
KEYWORDS — coolant flow, cavitation, pump cycling, impeller erosion, cooling efficiency, cross-facility.`},{id:4,title:"Radiation Containment Effectiveness",author:"Dr. R. Kim",date:"2026-07-27",status:"Published",citations:18,abstract:`BACKGROUND — The eight-sector containment shield surrounding the IITPP core is the primary barrier separating personnel from the reactor's radiation field. Its design rating is 50 μSv/h sustained ambient exposure at the shield face, with administrative action limits set far lower for inhabited areas. This report presents the quarterly integrity audit covering all eight sectors, performed with the dosimetry network, the manual survey instruments held in the Safety Division, and the camera/access logs maintained by Security Operations. Personnel doses remain well below the administrative quarterly limit, and the dosimetry network provides continuous belt-and-suspenders coverage alongside the manual survey instruments.
METHODOLOGY — Each sector was surveyed on a 5-metre grid at shield-face distance using calibrated ion-chamber instruments. Instrument drift was controlled by pre- and post-survey checks against the facility transfer standard. Historical ambient readings, dosimeter wear records, and the containment shield maintenance ledger were correlated with the survey data to distinguish genuine shield degradation from measurement artefacts.
FINDINGS — Whole-facility ambient radiation averaged 3.2 μSv/h, comfortably inside the 50 μSv/h sustained rating and consistent with the previous two quarterly audits (3.0 and 3.1 μSv/h). All eight sectors confirmed shield integrity with no grid point exceeding 6.8 μSv/h. A single anomalous reading of 41 μSv/h recorded in Sector C, near the personnel airlock, was traced to a dosimeter calibration error; the instrument was re-certified and the corrected reading falls within 4.5 μSv/h of the survey mean. The containment pressure log showed no excursions beyond normal 0.2 kPa cycling. Sector-by-sector, the highest mean reading (4.5 μSv/h) was recorded in Sector D adjacent to the Facility Control wing and the lowest (1.8 μSv/h) in Sector B near the Research Wing, consistent with inverse-square distance from the core and the shielding contribution of the coolant loop volume.
DISCUSSION — The Sector C anomaly illustrates the audit's chief weakness: manual dosimetry depends on instrument discipline. The erroneous instrument had passed its scheduled calibration but was found to have a temperature-compensation fault, likely induced by prolonged storage near the Turbine Hall. A firmware check procedure has been added to the calibration protocol. Radiation levels scale with core temperature; the audit window coincided with stable 850 MW baseload, so the safety margin should be re-verified after the next winter load peak. Dosimeter wear compliance stood at 97% this quarter, up from 94% last quarter; the two outstanding dosimeters belong to personnel on extended leave and will be closed out before the next audit.
CONCLUSION — Shield integrity is confirmed across all eight sectors. No corrective engineering action is required. Recommendation: re-survey Sector C after the firmware change and re-run the full audit following any future extended operation above 900 MW. The corrected Sector C reading has been written to the shield maintenance ledger, and the faulty instrument has been retired from service rather than returned to the calibration pool.
KEYWORDS — radiation containment, dosimetry, shield audit, sector survey, instrument calibration, IITPP.`},{id:5,title:"Emergency Safeguard Response Times",author:"Safety Division",date:"2026-07-26",status:"Draft",citations:0,abstract:`BACKGROUND — The IITPP safeguard system is the final line of defence against core excursion: on activation, boron-carbide cooling rods are driven into the lava-crystal charge to quench the reaction. Engagement requires the simultaneous turn of two physical keys — one in Core Control, one in Facility Control — a deliberate design that prevents single-operator error but introduces a human latency component. This draft report benchmarks the complete activation chain from key turn to rod insertion and models success probability as a function of core temperature.
METHODOLOGY — Twenty timed drill activations were performed across three shift teams under controlled, non-emergency conditions. Each drill measured: (1) key-turn to authorisation time in Core Control, (2) Facility Control key confirmation, (3) interlock release, (4) rod insertion stroke completion, and (5) full-system confirmation on the Safeguard.sys status archive. A probability-of-success model was fitted to historical excursion data using the observed temperature dependence of system readiness. Each drill was conducted at shift change and mid-shift to capture fatigue effects, and authorisation timings were split between the Core Control and Facility Control operators to isolate the slower station. A video-logged subset of five drills was reviewed frame-by-frame to validate manual timing to ±0.1 second.
FINDINGS — Median full-chain engagement time was 4.2 seconds from key turn to rod insertion, with a 95th percentile of 5.8 seconds. The interlock release and rod stroke account for 1.1 seconds of the chain; the remainder is human authorisation latency, which degrades markedly under stress and shift handover. Model fit: success probability is 95% below 2500K, falling to 60% at 3200K, and 30% at 3500K, driven primarily by the rising likelihood of rod-seat binding as core temperature increases crystal lattice distortion. Team-level results were consistent: the fastest team achieved a median of 3.6 seconds while the slowest team, tested during a night-shift handover, posted 5.1 seconds, confirming handover context as the dominant human variable. Above 3200K the success curve falls more steeply than the linear interpolation previously used, so the operations manual has been updated with the new table. The temperature-dependence curve was refit with a logistic model that reproduces the observed plateau below 2200K and the sharp roll-off above 3300K with a correlation coefficient of 0.97.
DISCUSSION — The human-in-the-loop design is the chain's weakest link, yet the dual-key requirement is non-negotiable from an operational-safety standpoint. A parallel electronic authorisation path — readable by both Control Rooms, still requiring two independent confirmations — could cut median latency to under 2 seconds without violating the two-person rule. Rod-seat binding at elevated temperature suggests a maintenance programme of periodic test strokes at temperature.
CONCLUSION — The safeguard chain meets its 6-second design requirement. Recommended: pursue the electronic parallel-authorisation study, extend the test-stroke programme, and repeat the benchmark after the Control Room console upgrade. A monthly drill schedule has been proposed so that every shift team exercises the chain at least once per quarter.
KEYWORDS — safeguard system, dual-key interlock, response time, rod insertion, excursion model, Safety Division.`},{id:6,title:"Magma Crystal Energy Density Report",author:"Dr. Y. Tanaka",date:"2026-07-25",status:"Published",citations:42,abstract:`BACKGROUND — The IITPP core burns charged lava-crystal fuel rods drawn from the Sakurajima magma field. The energy density of this fuel is the single largest driver of plant economics: higher density means longer charge intervals, smaller storage footprints, and reduced tram-based logistics load between the Storage Distribution facility and Reactor Sector C. This report characterises the specific energy of production-grade magma crystals and projects the theoretical ceiling for the crystal chemistry currently being refined by the Research Wing.
METHODOLOGY — Twenty-one production rods from three harvest batches were assayed in the research calorimeter. Specific energy was measured by controlled full-combustion runs at the 2200K standard operating temperature, with parallel differential thermal analysis to separate lattice-energy, phase-transition and impurity contributions. Crystal composition was confirmed by X-ray fluorescence on the Research Wing's analytical bench; results were logged to the research filesystem for cross-checking by the Arctic and Desert facilities. Measurement uncertainty was estimated at ±0.05 GJ/kg from the calorimeter calibration standard, and duplicate assays of three randomly selected rods agreed within ±0.03 GJ/kg, confirming laboratory repeatability. Rod mass loss during combustion was corrected for oxidation carry-over using the differential thermal analysis traces.
FINDINGS — Production-grade Sakurajima magma crystals delivered a measured specific energy of 3.4 GJ/kg at 2200K, with batch-to-batch variation of ±2.1%. Batch 2, harvested after the spring eruption cycle, delivered the highest density at 3.48 GJ/kg, suggesting that post-eruption crystals carry fewer trapped inclusions. The theoretical ceiling for the current crystal chemistry was computed at 4.1 GJ/kg, implying a 20.6% headroom that could be captured by reducing silicate inclusion content below 1.5% and extending the controlled annealing time during rod formation. At the theoretical ceiling, charge intervals would extend by roughly one-fifth, with corresponding reductions in handling, transport and requalification effort.
DISCUSSION — The gap between measured and theoretical density is dominated by inclusions and lattice strain rather than fundamental chemistry, which is encouraging: it suggests the ceiling is approachable with process improvements already within reach of the plant. Storage and handling recommendations for the Distribution division are included: rods must be kept below 470K in storage, separated from oxidisers, and moved only in the rated handling cages. The 42 citations accrued by this report reflect its direct bearing on both generation economics and the quarterly fuel-procurement negotiation. Preliminary economics indicate that each 0.1 GJ/kg of captured headroom reduces annual fuel-handling cost by roughly 2.4%, driven mostly by fewer tram trips and reduced storage requalification. The Desert facility has expressed interest in co-funding the annealing experiments, since its solar furnace can sustain the extended soak cycle at lower marginal cost.
CONCLUSION — Production fuel is performing at specification. Fund the inclusion-reduction programme; re-assay at 4-month intervals and re-baseline the density ceiling after each process change. Storage-yard rod-temperature monitoring operated within specification for the full study window, with no storage-side excursions recorded.
KEYWORDS — magma crystal, specific energy, energy density, fuel assay, annealing, Storage Distribution, Sakurajima.`},{id:7,title:"Innovation Inc Intranet Architecture Report",author:"Sarah Chen",date:"2026-07-24",status:"Published",citations:12,abstract:`BACKGROUND — Innovation Inc operates a private wide-area intranet spanning every facility the company runs: the Thermal Power Plant inside Sakurajima, the Arctic Facility, the Desert Complex, the Computer Core (PBCC), the legacy Nuclear Power Plant, and the Oil Platform (PBOP). The Desert Complex Network Operations Center (NOC) is responsible for this fabric, and this report documents its architecture, addressing plan and operational posture as of the current quarter. All sites terminate at a single backbone router, intranet-hub (10.10.0.1), which carries inter-site traffic, the shared monitoring API stream, and the corporate link to Innovation Inc HQ.
METHODOLOGY — The network was surveyed from the Sakurajima Control Room node (iitpp-control-01, 10.10.3.7) using the offline diagnostics console and the node directory maintained by the NOC. Route tables, DNS records on innovation-nameserver, and the monitoring-api heartbeat logs were cross-checked against the physical floor records at each site. Latency probes were run to every registered node across all five subnets, and the DNS suffix conventions (iitpp, arctic, desert and innovation-inc) were verified against the nameserver's zone file.
FINDINGS — The intranet is segmented by facility: 10.10.x carries the core network and Sakurajima, 10.20.x the Arctic Facility, 10.30.x the Desert Complex, 10.40.x the Computer Core and Nuclear Power Plant, and 10.50.x the Oil Platform. Eighteen nodes are registered on the directory, with seventeen reporting ONLINE and the Nuclear Power Plant reactor controller on STANDBY for scheduled maintenance. Shared services run from the core network: DNS/DHCP on innovation-nameserver, the NFS research drive on innovation-nfs, the mail relay on innovation-mail, the cross-facility monitoring API on port 8080 of monitoring-api, and the nightly backup service on backup-server. The monitoring API currently reports all six sites and streams live core telemetry from Sakurajima, the Arctic and the Computer Core.
DISCUSSION — The flat 10.10.0.0/8 internal scheme is simple and robust for a company of this size, but it means a compromise at any single site router gives lateral access to every facility. The NOC recommends incrementing firewall rules between subnets, starting with the 10.40.x block that hosts the Computer Core's access-code vault, and moving the backup stream to a dedicated VLAN. The STANDBY status of the Nuclear Power Plant node is expected: its reactor has been offline since the coolant-valve refit, and its link is intentionally quiesced.
CONCLUSION — The Innovation Inc intranet is healthy, fully reachable from this workstation, and correctly reflects the company's cross-facility operations. The shared monitoring API remains the single source of truth for site status, and the node directory maintained in this report should be kept in sync with the NOC's authoritative list.
KEYWORDS — intranet, network architecture, subnets, monitoring API, DNS, Desert Complex NOC, Innovation Inc.`},{id:8,title:"Arctic Facility Cryogenic Stability Study",author:"Dr. J. Mitchell",date:"2026-07-23",status:"In Review",citations:9,abstract:`BACKGROUND — The Innovation Inc Arctic Facility operates a cryogenically cooled reactor core at 1900K in an environment that routinely falls below -40°C. The extreme ambient temperature gives the facility a unique advantage: the cooling loop can shed heat far more aggressively than at Sakurajima, and sustained cooling efficiency reaches 96%. But the same conditions create unusual failure modes — brittle seals, flash-vaporisation of coolant, and a freezedown risk that is every bit as dangerous as a meltdown. This study characterises the stability envelope of the cryo core across a full seasonal cycle and compares it with the thermal plant's behaviour.
METHODOLOGY — Core temperature, coolant pressure and ambient weather were logged continuously from the cryo reactor's telemetry archive over a 90-day window spanning the winter minimum. Thermal stress was modelled with the same Fortran 77 heat-transfer codes used at Sakurajima, re-parameterised for liquid-sodium coolant and sub-zero ambient conditions. The vapour-pressure margin of the coolant was computed across the ambient range, and the 72-hour pump-cycling protocol developed for Sakurajima was validated against the Arctic's continuous-duty schedule. Emergency freezedown drills were recorded and timed using the same instrumentation as the Sakurajima safeguard benchmarks.
FINDINGS — The cryo core maintained a peak-to-peak variance of ±9K over the study window, tighter than Sakurajima's ±12K, confirming that ambient cooling dominates stability. Every 10K of ambient-temperature reduction doubles the safe coolant-flow envelope, which is why the Arctic loop can safely push coolant flow far past the 420 L/s Sakurajima setpoint. The vapour-pressure margin exceeded the plant's design requirement at all observed temperatures, with the narrowest margin — still a comfortable 2.3x — recorded during a spring thaw when ambient briefly climbed above freezing. One seal failure was observed on the primary coolant header at -38°C, traced to a brittle-seal batch from the same supplier as the Turbine Hall's failed impellers; the seal has been replaced and the supplier notified.
DISCUSSION — The Arctic facility's low-temperature operation is directly relevant to IITPP's freezedown protocol: the cryo team's experience shows that overcooling past 100K risks crystalline restructuring of the fuel rods, a hazard Dr. Tanaka's group has flagged for the Sakurajima charge. The two facilities now share a unified coolant model through the cross-facility monitoring API, and this study's vapour-pressure data has been folded into it. A joint drill is proposed for next quarter to exercise a cross-site freezedown scenario.
CONCLUSION — The Arctic Facility's cryogenic reactor is operating within specification and is arguably the most thermally stable site in the Innovation Inc portfolio. Recommended actions: adopt the winter maintenance schedule year-round, complete the supplier audit for brittle components, and proceed with the joint freezedown drill.
KEYWORDS — Arctic Facility, cryogenics, coolant, freezedown, low-temperature reactor dynamics, James Mitchell, cross-facility.`}],v0=[{name:"Sector A — Main Entrance",nextArrival:132,pax:12,status:"ACTIVE"},{name:"Sector B — Research Wing",nextArrival:310,pax:8,status:"ACTIVE"},{name:"Sector C — Core Control",nextArrival:64,pax:3,status:"ACTIVE"},{name:"Sector D — Facility Control",nextArrival:186,pax:15,status:"ACTIVE"},{name:"Evacuation Hub",nextArrival:9999,pax:0,status:"STANDBY"}];function w0(){const o=["Sector A","Sector B","Sector C","Sector D","Evac Hub"],a=[];for(let r=2841;r<2849;r++)a.push({id:r,type:r%2?"cube":"barrel",dest:o[r%5],eta:60+r*37%180,status:"queued"});return a}const S0=[{text:"Core temperature nominal. All systems operational.",priority:"Normal"},{text:"Attention: Coolant flow at 94% efficiency. No action required.",priority:"Low"},{text:"Shift change in 30 minutes. Please prepare handover reports.",priority:"Normal"},{text:"Fire suppression test complete. All sectors clear.",priority:"Normal"},{text:"Tram arriving at Sector C in 1 minute.",priority:"Low"},{text:"Code Yellow standby: Safeguard system ready.",priority:"Code Yellow"},{text:"Unauthorized activity detected in Sector C. Security has been notified.",priority:"Code Yellow"},{text:"CODE RED — Core temperature exceeds 3000K. Evacuate Sector C immediately.",priority:"Code Red"}];function N0(){return[{pid:1,name:"sched",cpu:2,mem:1,user:"root"},{pid:2,name:"init",cpu:0,mem:2,user:"root"},{pid:14,name:"cron",cpu:1,mem:3,user:"root"},{pid:23,name:"inetd",cpu:0,mem:2,user:"root"},{pid:41,name:"syslogd",cpu:1,mem:4,user:"root"},{pid:56,name:"named",cpu:3,mem:9,user:"root"},{pid:88,name:"x11server",cpu:8,mem:22,user:"root"},{pid:102,name:"4Dwm",cpu:5,mem:11,user:"researcher"},{pid:115,name:"reactor_mon",cpu:14,mem:18,user:"root"},{pid:129,name:"asas_d",cpu:4,mem:8,user:"root"},{pid:143,name:"tram_ctl",cpu:6,mem:7,user:"root"},{pid:158,name:"storage_svc",cpu:5,mem:9,user:"root"},{pid:171,name ert Complex and the Computer Core in real time.","The company is famous for its facility announcement system, ASAS, which keeps staff informed with periodic status broadcasts in a calm, slightly unsettling voice.","Innovation Inc employs engineers, researchers, security and site leadership through a structured ranking system, and its divisions are known for near-military discipline during core events."]},{title:"Innovation Inc — History & Founding",category:"Innovation Inc — Corporate",facility:"Innovation Inc HQ",author:"Corporate Archives",classification:"PUBLIC",keywords:["innovation inc","history","founding","founded","origin","started","began","established","timeline"],summary:"Innovation Inc grew from a single experimental power facility into the industrial backbone of the Pinewood Builders universe, expanding site by site as its generation technology matured.",facts:["Innovation Inc began as an experimental power company, building its first thermal generation site before the famous Sakurajima plant existed.","The company's breakthrough came with the discovery that charged lava crystals harvested from volcanic fields could sustain a reactor core at extreme temperature with far higher energy density than coal or conventional fuel.","Following the success of the Sakurajima facility, the board expanded into cryogenics research (Arctic Facility), systems integration (Desert Complex) and eventually nuclear computing (the Computer Core).","Corporate records note a formal partnership with the Pinewood Builders group — a relationship the archives describe as 'a partnership and, at times, a rivalry'.","The company adopted a strict site-designation system, so every facility answers to a central board while retaining its own Site Director as final local authority."]},{title:"Innovation Inc — Corporate Structure",category:"Innovation Inc — Corporate",facility:"Innovation Inc HQ",author:"Corporate Archives",classification:"INTERNAL",keywords:["structure","board","directors","divisions","leadership","management","hierarchy","executive","corporate"],summary:"Innovation Inc is organized as a central board of directors overseeing semi-autonomous facility divisions, each run by a Site Director with its own engineering, research, safety and security chains.",facts:["At the top of Innovation Inc sits a central board of directors, which sets company-wide policy, budgets and the expansion roadmap.","Each facility is led by a Site Director, who holds final authority during major events and answers directly to the board.","Below the Site Director, facilities are split into functional divisions: engineering, research, safety, security (PBST), emergency response (PET) and technical systems (TMS).","Division membership is a real in-game mechanic: joining the Innovation Thermal Power Plant Division grants a one-time 150-credit sign-on bonus and a permanent 1.5x credit multiplier.","Corporate oversight is exercised through the Innovation Inc intranet, where the HQ node maintains the central network and every site streams status to the shared monitoring API."]},{title:"Innovation Inc & Pinewood Builders — The Relationship",category:"Innovation Inc — Corporate",facility:"Innovation Inc HQ",author:"Corporate Archives",classification:"INTERNAL",keywords:["relationship","partnership","rivalry","pinewood builders","alliance","affiliated","connected","who owns","parent"],summary:"The archives describe the bond between Innovation Inc and Pinewood Builders as a partnership that periodically drifts into rivalry — two organizations that cooperate on facility operations but disagree about who truly controls the Sakurajima plant.",facts:["Pinewood Builders supplies the group culture, divisions and staffing pipeline; Innovation Inc supplies the industrial plant, the technology and the corporate structure.","In practice the two are intertwined: the same players fill Pinewood ranks and Innovation Inc jobs, and both organizations' protocols appear in the facility manuals.","Community lore has long debated which side truly controls the Sakurajima facility, and loyalists of either faction can be found in the security and emergency divisions.","During crises the partnership is at its strongest — PBST and PET deploy to Innovation Inc sites and Innovation Inc research feeds Pinewood's game design.","Corporate policy documents instruct staff to treat members of both organizations as colleagues, while acknowledging that the rivalry is 'a matter of ongoing negotiation at board level'."]},{title:"ASAS — The Automatic Smart Announcement System",category:"Innovation Inc — Corporate",facility:"IITPP — Sakurajima",author:"Connor Rogers",classification:"INTERNAL",keywords:["asas","announcement","ai","system","speaker","pa","public address","voice","announce","smart"],summary:"ASAS — the Automatic Smart Announcement System — is the artificial intelligence that watches over the Innovation Inc facilities and relays facility-wide alerts, warnings and instructions over the PA system.",facts:["ASAS stands for Automatic Smart Announcement System, the facility-wide AI that monitors Innovation Inc sites and broadcasts status updates over the public address network.","It was created and is overseen by Lead Software Engineer Connor Rogers, who is responsible for its behavior, updates and the periodic alerts it releases.","ASAS announcements follow a strict format: an attention line, the announcement body, and a closing 'END OF ANNOUNCEMENT', delivered in a calm, formal voice.","Facility staff are expected to treat ASAS broadcasts as authoritative; emergency announcements take priority over all routine broadcasts.","In this workstation generation, ASAS has been fused with the Advanced Unified Research Assistant (AURA) to form a single merged intelligence that both announces and answers."]},{title:"Connor Rogers — Lead Software Engineer",category:"Innovation Inc — Corporate",facility:"IITPP — Sakurajima",author:"Personnel Records",classification:"PUBLIC",keywords:["connor rogers","lead software engineer","software","engineer","asas creator","created asas","developer","programmer"],summary:"Connor Rogers is the Lead Software Engineer at the Innovation Inc Thermal Power Plant and the creator and overseer of the ASAS announcement system.",facts:["Connor Rogers holds the title of Lead Software Engineer at the Innovation Inc Thermal Power Plant, one of the senior technical roles below the Site Director.","He is the creator and ongoing overseer of the ASAS announcement system, responsible for its behavior, updates and the periodic facility alerts it broadcasts.","His work spans the facility's software infrastructure: the announcement system, monitoring integration and the workstation tooling used across the plant.","Staff records describe him as the technical authority on the facility's automated systems, frequently consulted during system events.","The researcher account on this workstation (connor.moran7) is a separate personnel record — the two are often confused in archive searches."]},{title:"The Site Director — Role & Authority",category:"Innovation Inc — Corporate",facility:"Innovation Inc HQ",author:"Corporate Archives",classification:"INTERNAL",keywords:["site director","director","boss","manager","leader","executive","authority","oversees","role"],summary:"The Site Director is the senior leadership role at an Innovation Inc facility, overseeing overall operations and holding final authority during major events.",facts:["The Site Director is the senior leadership role at an Innovation Inc facility — the person who oversees overall operations, facility designations, and final authority during major events.","Below the Site Director sit the Lead Software Engineers, operations engineers, researchers, and the security chain of command (PBST), plus the emergency division (PET).","During a meltdown or other crisis, the Site Director's decisions take precedence over routine protocol.","The Site Director also represents the facility to the central board and negotiates cross-facility matters such as shared research funding and grid dispatch agreements.","Facility designation changes, major expansions and division-wide policy shifts all require Site Director approval."]},{title:"Innovation Thermal Power Plant Division — Sign-On Bonus",category:"Innovation Inc — Corporate",facility:"IITPP — Sakurajima",author:"HR Records",classification:"PUBLIC",keywords:["division","thermal power plant division","bonus","150 credits","multiplier","1.5","permanent","join","sign-on","credits"],summary:"Joining the Innovation Thermal Power Plant Division pays a one-time 150-credit sign-on bonus plus a permanent 1.5x credit multiplier on all tasks completed at the facility.",facts:["Players who join the Innovation Thermal Power Plant Division receive a one-time sign-on bonus of 150 credits.","Division membership also grants a permanent 1.5x credit multiplier on all tasks completed at the facility.","The multiplier applies to task payouts, making regular shift work at IITPP substantially more profitable for division members.","Division membership is managed through the group system, and switching divisions is possible but resets certain accumulated perks.","HR guidance recommends joining the division before starting long shifts, since the multiplier compounds with automated salaries."]},{title:"Credits — The Facility Currency",category:"Innovation Inc — Corporate",facility:"Innovation Inc HQ",author:"Finance Division",classification:"PUBLIC",keywords:["credits","currency","money","cash","salary","pay","earn","economy","coins","income"],summary:"Credits are the currency of the Innovation Inc facility universe — earned through tasks and salaries, spent on cosmetics, upgrades and perks, and boosted by division membership.",facts:["Credits are the in-game currency of the Innovation Inc facility games, earned by completing routine facility tasks and fulfilling job duties.","Task payouts cover general maintenance, fixing doors, handling beams, responding to equipment failures and completing job-specific work.","Automated salaries vary by role and are paid on a schedule, with higher ranks receiving larger base pay.","Credits are spent on cosmetics, upgrades and in some facilities on training or division perks.","Division membership can boost earnings significantly — the Innovation Thermal Power Plant Division grants +150 credits and a permanent 1.5x multiplier."]},{title:"Innovation Inc — Uniforms & Staff Conduct",category:"Innovation Inc — Corporate",facility:"IITPP — Sakurajima",author:"HR Records",classification:"PUBLIC",keywords:["uniform","conduct","code of conduct","dress","staff","behavior","rules","on duty","appearance"],summary:"Innovation Inc staff must wear the official company uniform while on duty, display the correct division rank tag, and follow the code of conduct that keeps facility roleplay professional.",facts:["All on-duty staff at Innovation Inc facilities must wear the official company uniform — no layered or oversized clothing that hides it.","The group rank tag must be enabled and set to the correct division while on duty, using the standard group commands.","Conduct rules cover radio discipline, chain of command, and the treatment of lower ranks; violations are handled by moderators and security.","Impersonation — wearing a uniform or rank tag you have not earned — is treated as a serious offense.","The conduct code is enforced by the security division, with warning escalation before force against non-aggressive violators."]},{title:"Innovation Inc — Board of Directors & Oversight",category:"Innovation Inc — Corporate",facility:"Innovation Inc HQ",author:"Corporate Archives",classification:"RESTRICTED",keywords:["board","directors","oversight","governance","corporate","shareholders","executive","restricted","policy"],summary:"Innovation Inc's board of directors governs the company from the HQ node, setting policy, approving budgets and exercising oversight through the intranet's corporate subnet.",facts:["The board of directors governs Innovation Inc from the corporate HQ node, which hosts the central network services on the 10.10.1.x subnet.","Board policy is distributed as restricted corporate documents that facility staff can access through the intranet archive.","Oversight is exercised through quarterly cross-facility reports, budget approvals and the designation of new facility projects.","The board maintains the company's expansion roadmap, which currently includes the Computer Core's nuclear computing program and the Pacific oil operations.","Records note that board communications are encrypted and that only Site Directors and senior leads hold direct board access."]},{title:"The Thermal Power Plant at Sakurajima — Overview",category:"Innovation Inc — Facilities",facility:"IITPP — Sakurajima",author:"Facility Archives",classification:"PUBLIC",keywords:["iitpp","thermal power plant","sakurajima","volcano","japan","kagoshima","plant","overview","facility"],summary:"The Innovation Inc Thermal Power Plant (IITPP) is the company's flagship facility — a magma-fueled generation plant built inside the active Sakurajima volcano in Kagoshima Prefecture, Japan.",facts:["Innovation Inc.: Thermal Power Plant (IITPP) is the flagship facility game of the Innovation Inc / Pinewood Builders universe, set inside the active Sakurajima volcano.","The plant harnesses volcanic heat and charged magma-crystal fuel to generate around 850 MW of baseload power for the regional grid.","The facility is divided into lettered sectors — from the Main Entrance in Sector A to the Emergency Bunker in Sector G — linked by an automated tram system.","Staff complete task-based shifts for credits while ASAS announces status updates across the facility.","The plant is famous for its disaster events: meltdowns, freezedowns, zombie outbreaks and warhead alerts all test the staff's coordination."]},{title:"The Arctic Facility — Cryogenics Research Site",category:"Innovation Inc — Facilities",facility:"Innovation Inc Arctic Facility",author:"Dr. J. Mitchell",classification:"PUBLIC",keywords:["arctic","arctic facility","cryo","cryogenics","frozen","ice","cold","research","snow","mitchell"],summary:"The Arctic Facility is Innovation Inc's cryogenics research site in a frozen region, where sub-zero ambient temperatures push coolant efficiency to 96% and Dr. James Mitchell studies low-temperature reactor dynamics.",facts:["The Arctic Facility is Innovation Inc's cryogenics research site, located in a frozen region where temperatures routinely fall below -40C.","Its reactor core runs cooler than Sakurajima's at roughly 1900K, and the extreme ambient temperature lets the cooling loop hit 96% sustained efficiency.","The facility is led by Dr. James Mitchell, Lead Cryogenics Engineer, whose research on low-temperature reactor dynamics is referenced during freezedown drills.","Overcooling past roughly 100K risks crystalline restructuring of the fuel rods — the core caution in all cryo experiments.","The Arctic network node is arctic-core at 10.20.3.10, with the cryogenics lab at arctic-lab and CRYO$/PUBLIC network shares."]},{title:"The Desert Complex — Systems Integration Site",category:"Innovation Inc — Facilities",facility:"Innovation Inc Desert Complex",author:"Sarah Chen",classification:"PUBLIC",keywords:["desert","desert complex","sarah chen","noc","integration","logistics","solar","network operations","storage"],summary:"The Desert Complex is Innovation Inc's systems-integration and logistics site, home to the Network Operations Center that owns the cross-facility intranet and storage logistics.",facts:["The Desert Complex is Innovation Inc's systems-integration and logistics site, run by Systems Integration Lead Sarah Chen.","Its Network Operations Center (NOC) owns the cross-facility intranet, storage logistics — handling 3000+ cubes a day — and the shared monitoring API.","The complex's solar furnace can sustain long annealing soaks for magma-crystal fuel at lower cost, and it has co-funded the Sakurajima annealing experiments.","The Desert nodes are desert-noc at 10.30.3.10 and desert-core at 10.30.3.11.","Sarah Chen is a known contact on the Control Room workstation's iMail contacts list and coordinates cross-facility telemetry syncs."]},{title:"Innovation Inc HQ — The Corporate Network",category:"Innovation Inc — Facilities",facility:"Innovation Inc HQ",author:"Network Operations",classification:"INTERNAL",keywords:["hq","headquarters","corporate","network","10.10.1.5","hq-node","central","office","board"],summary:"Innovation Inc HQ is the corporate nerve center of the intranet, hosting the board's encrypted links and the central network services that all facilities depend on.",facts:["Innovation Inc HQ is the corporate nerve center of the intranet, represented on the network as hq-node at 10.10.1.5.","The HQ subnet hosts the central corporate services, including the board's encrypted communications link.","All facility designations and major corporate decisions are processed through HQ systems.","The HQ node reports to the intranet hub as ONLINE and carries the highest security classification of any network segment.","Access to HQ systems is restricted to senior staff; regular facility personnel reach it only through the intranet archive's corporate category."]},{title:"The Nuclear Power Plant — Legacy Facility",category:"Innovation Inc — Facilities",facility:"Nuclear Power Plant",author:"Facility Archives",classification:"PUBLIC",keywords:["nuclear","npp","legacy","reactor","uranium","plant","older","standby","containment"],summary:"The Nuclear Power Plant is Innovation Inc's legacy reactor facility, currently in standby for scheduled maintenance while the Computer Core carries the nuclear workload.",facts:["The Nuclear Power Plant (NPP) is the older, reactor-focused facility in the Pinewood Builders universe, predating the Computer Core.","It operates on traditional reactor physics: uranium fuel, steam turbines, coolant valve routing and containment building integrity.","On the intranet the NPP node (npp-core at 10.40.3.13) reports STANDBY, with the reactor offline for scheduled maintenance and containment sealed.","The NPP is the direct predecessor of the Computer Core and shares its meltdown obsession.","Legacy staff records note that nuclear failures were always treated as the most dangerous class of facility event."]},{title:"The Computer Core (PBCC) — Nuclear Computing Facility",category:"Innovation Inc — Facilities",facility:"Computer Core (PBCC)",author:"Facility Archives",classification:"RESTRICTED",keywords:["computer core","pbcc","nuclear","computing","5-33-41-18","sector g","coolant rods","high-tech","facility"],summary:"The Pinewood Builders Computer Core (PBCC) is the high-tech nuclear computing facility where a computer core vulnerable to both meltdown and freezedown must be kept running.",facts:["Pinewood Builders Computer Core (PBCC) is the high-tech sequel to the Nuclear Power Plant, centered on a nuclear computer core.","The core is vulnerable to both Meltdowns and Freezedowns, and its crisis response requires manual emergency coolant work.","High-security zones like Sector G (Emergency Coolant) are protected by an access code system: the primary code is 5-33-41-18, with secondary codes derived from formulas modifying the primary digits.","During a meltdown, players must manually fill emergency coolant rods in Sector G to the optimal threshold between 69% and 81%, or evacuate via the launch-silo rockets.","Hazardous 'Nuke Trains' must be managed or deleted from the tracks before they explode.","The PBCC node (pbcc-core at 10.40.3.12) is ONLINE on the intranet and streams core status to the monitoring API."]},{title:"The Oil Platform (PBOP) — Pacific Drilling Rig",category:"Innovation Inc — Facilities",facility:"Oil Platform (PBOP)",author:"Facility Archives",classification:"PUBLIC",keywords:["oil","platform","pbop","drilling","rig","pacific","refined","gas","blowout","pressure"],summary:"The Oil Platform (PBOP) is Innovation Inc's Pacific drilling facility, where fluid pressure systems and extraction drills create a constant risk of catastrophic oil blowouts.",facts:["Refined Oil and Gas — also known as the Oil Platform or PBOP — is set on a massive drilling platform in the middle of the Pacific Ocean.","It introduces fluid pressure systems, extraction drills and the risk of catastrophic oil blowouts.","Operators must watch pressure gauges and valve systems constantly; a pipeline overpressure triggers security warnings and can escalate into a server-wide blowout event.","The PET emergency team is deployed to contain blowouts, and the platform's network node (oil-platform at 10.50.3.10) reports to the intranet hub.","The platform currently reports pressure at 640 PSI with a low blowout risk assessment."]},{title:"The Cross-Facility Monitoring API",category:"Innovation Inc — Facilities",facility:"Core Network",author:"Network Operations",classification:"INTERNAL",keywords:["monitoring","api","telemetry","status","heartbeat","8080","dashboard","sync","real-time","site status"],summary:"The cross-facility monitoring API at monitoring-api:8080 is the single source of truth for site status across the Innovation Inc intranet, streaming live core telemetry from every facility.",facts:["The cross-facility monitoring API, hosted at monitoring-api:8080 (10.10.5.10), is the single source of truth for site status across the intranet.","It streams live core telemetry from Sakurajima, the Arctic Facility and the Computer Core, and aggregates site health from all six facilities.","Heartbeat checks run every 15 minutes; the API currently reports all sites with the Nuclear Power Plant node in STANDBY for scheduled maintenance.","The API powers the shared dashboards used by every site's Control Room.","Typing 'systeminfo' in the Command Prompt or asking AURA for site status surfaces the live API data."]},{title:"Facility Designation System — IITPP Codes",category:"Innovation Inc — Facilities",facility:"Innovation Inc HQ",author:"Corporate Archives",classification:"INTERNAL",keywords:["designation","codes","iitpp-6","facility codes","naming","system","identifier","node","prefix"],summary:"Every Innovation Inc site carries a formal designation code, and the intranet archive itself is versioned — this workstation's software generation is designated IITPP-6.",facts:["Innovation Inc sites carry formal designation codes that identify the facility, its generation and its role on the intranet.","The Thermal Power Plant's own designation follows the IITPP prefix, with software and workstation generations numbered sequentially.","This Control Room workstation runs the IITPP-6 software generation, which introduced the intranet search archive and multi-user registration.","Network nodes carry their own identifiers — reactor-core, tram-ctl, pbcc-core, npp-core — used across the intranet directory.","Designation changes require Site Director approval and are recorded in the corporate archives."]},{title:"The Evacuation Hub & Bunker Network",category:"Innovation Inc — Facilities",facility:"IITPP — Sakurajima",author:"Safety Division",classification:"INTERNAL",keywords:["evacuation","hub","bunker","sector g","shelter","evac","safe room","blast","retreat"],summary:"The evacuation network at IITPP funnels staff from every sector toward the Evacuation Hub and the Emergency Bunker in Sector G during catastrophic events.",facts:["During evacuation, the trams are re-routed to the Evacuation Hub and staff funnel toward the Emergency Bunker until ASAS gives the all-clear.","The Emergency Bunker is located in Sector G and doubles as the blast shelter and the staging area for post-event response.","Sector G also houses emergency coolant systems referenced in the Computer Core's crisis protocols.","Evacuation routes are drilled monthly, and every sector has a designated assembly point en route to the hub.","The bunker can be sealed from inside, and its blast doors are manually keyed rather than electronically controlled."]},{title:"Reactor Core System — Technical Overview",category:"IITPP — Systems & Operations",facility:"IITPP — Sakurajima",author:"Dr. Y. Tanaka",classification:"RESTRICTED",keywords:["reactor","core","lava","crystal","2180","temperature","reaction","heat","generation"],summary:"The IITPP reactor core is a magma-fed lava-crystal thermal reaction held at about 2180K, generating 850 MW through laser-coupled heating and a closed coolant loop.",facts:["The IITPP core holds a sustained thermal reaction inside Reactor Sector C, using charged lava-crystal fuel harvested from the Sakurajima magma field.","Nominal core temperature is 2180K with a safe operating band between roughly 2100K and 2500K; 3000K is the danger line and the safeguard engages at 3200K.","Secondary power lasers focus and sustain thermal input on the crystal charge, with alignment maintained above 95%.","The closed coolant loop moves about 420 L/s of treated coolant through four parallel pump trains.","Sustained baseload output is around 850 MW, dispatched to the regional grid through the Turbine Hall generators."]},{title:"Magma-Crystal Fuel Rods — Composition & Handling",category:"IITPP — Systems & Operations",facility:"IITPP — Sakurajima",author:"Dr. Y. Tanaka",classification:"RESTRICTED",keywords:["magma","crystal","fuel","rods","energy density","harvest","charge","3.4 gj","annealing"],summary:"Magma-crystal fuel rods are the plant's signature fuel — production-grade crystals deliver 3.4 GJ/kg, with a theoretical ceiling of 4.1 GJ/kg within reach of the current refining process.",facts:["Production-grade Sakurajima magma crystals deliver a measured specific energy of 3.4 GJ/kg at the 2200K standard operating temperature.","Batch variation is about 2.1%, with post-eruption crystals generally denser because they carry fewer trapped inclusions.","The theoretical ceiling for the current crystal chemistry is 4.1 GJ/kg, implying about 20% headroom from reducing silicate inclusions below 1.5%.","Storage rules: rods must be kept below 470K, separated from oxidizers, and moved only in rated handling cages.","Fuel is moved from Storage Distribution to the core by the tram system, and charge intervals are a major cost driver for the plant."]},{title:"Secondary Power Laser Array — Alignment & Drift",category:"IITPP — Systems & Operations",facility:"IITPP — Sakurajima",author:"Research Wing",classification:"INTERNAL",keywords:["laser","lasers","alignment","array","drift","gimbal","beam","focus","recalibration"],summary:"Four secondary power lasers focus thermal input on the core; a predictive feedback algorithm has cut alignment drift by 26% and stabilized beam power to within 1.1%.",facts:["The power generation loop relies on an array of four secondary power lasers that focus and sustain thermal input on the lava-crystal core.","Misalignment causes asymmetric heating and hot-spot formation, and historically contributed to core temperature variance.","A new closed-loop feedback-alignment algorithm reduced RMS beam-centre drift by about 26% and eliminated a low-frequency oscillation mode.","Energy coupling efficiency improved by about 2 percentage points, correlating with improved core temperature stability.","Lasers are recalibrated on a schedule; laser drift is strongly seasonal, peaking during summer afternoon thermal gradients."]},{title:"Coolant Loop & Pump Trains",category:"IITPP — Systems & Operations",facility:"IITPP — Sakurajima",author:"Dr. J. Mitchell",classification:"INTERNAL",keywords:["coolant","cooling","pump","pumps","flow","420","cavitation","efficiency","loop","water"],summary:"The closed coolant loop moves 420 L/s through four pump trains; a 72-hour pump-cycling protocol cut cavitation events by 89% and lifted cooling efficiency to 94%.",facts:["The closed-loop coolant system moves 420 L/s of treated coolant through four parallel pump trains at up to 3600 RPM turbine coupling.","Cavitation in pump impellers was the dominant efficiency loss, eroding vanes and triggering vibration alarms.","A pump-cycling protocol — alternating pumps onto a 72-hour duty cycle — reduced cavitation events by 89%.","Sustained cooling efficiency rose from 91% to 94% at Sakurajima, and to 96% at the Arctic Facility's sub-zero ambient conditions.","Impeller erosion rates fell by two-thirds under cycling, projecting a threefold extension of vane service life."]},{title:"Turbine Hall & Generators",category:"IITPP — Systems & Operations",facility:"IITPP — Sakurajima",author:"Operations",classification:"INTERNAL",keywords:["turbine","turbines","generator","generators","rpm","3600","steam","power output","grid","hall"],summary:"The Turbine Hall converts the core's heat into 850 MW of grid power, with twin turbine-generator sets running near 3600 RPM and synchronized to the regional 60 Hz grid.",facts:["The Turbine Hall houses the turbine-generator sets that convert core heat into electrical output for the regional grid.","Turbines run near 3600 RPM with generators producing the plant's nominal 850 MW baseload.","Generator output is synchronized to the regional 60 Hz grid frequency before dispatch.","Turbine vibration is monitored continuously; the shift team logs RPM, load and vibration at each station.","During core events, turbines are throttled or tripped to protect the generator sets, with the grid tie re-established after stability returns."]},{title:"The Safeguard System — Dual-Key Emergency Shutdown",category:"IITPP — Systems & Operations",facility:"IITPP — Sakurajima",author:"Safety Division",classification:"RESTRICTED",keywords:["safeguard","shutdown","dual key","two keys","rods","boron","interlock","3200","emergency stop"],summary:"The safeguard system is the final line of defense — boron-carbide rods driven into the core by a dual-key interlock, engaging in a benchmarked 4.2 seconds.",facts:["The safeguard system is the final line of defense against core excursion: on activation, boron-carbide cooling rods are driven into the lava-crystal charge to quench the reaction.","Engagement requires the simultaneous turn of two physical keys — one in Core Control and one in Facility Control — preventing single-operator error.","The benchmarked median full-chain engagement time is 4.2 seconds from key turn to rod insertion.","Success probability scales with temperature: 95% below 2500K, falling to 60% at 3200K and 30% at 3500K.","The dual-key requirement is non-negotiable, though a parallel electronic authorization path is under study."]},{title:"Core Temperature Monitoring & Telemetry",category:"IITPP — Systems & Operations",facility:"IITPP — Sakurajima",author:"Dr. Y. Tanaka",classification:"INTERNAL",keywords:["temperature","monitoring","telemetry","core temp","sensors","2180","data","logs","readings"],summary:"Core temperature telemetry is sampled continuously by the reactor monitoring system and archived to the research filesystem for analysis and prediction.",facts:["Core temperature, coolant flow, turbine RPM and laser-alignment telemetry are sampled at high resolution and archived for analysis.","The 72-hour rolling variance statistic is the standard stability metric — the lava-crystal configuration holds within about ±12K per window.","Coolant flow dips are a leading indicator of thermal excursion risk, preceding excursions by 18 to 24 minutes in 91% of cases.","Telemetry is stored in files like core_temp.mon and coolant.mon on the workstation filesystem and streamed to the monitoring API.","The predictive model built on the coolant lag gives operators a real decision horizon before safeguard intervention becomes necessary."]},{title:"Reactor Startup Sequence",category:"IITPP — Systems & Operations",facility:"IITPP — Sakurajima",author:"Operations",classification:"RESTRICTED",keywords:["startup","sequence","ignition","ramp","laser","fuel rods","procedure","cold start","start"],summary:"Starting the reactor follows a strict seven-step sequence — coolant integrity, laser alignment, fuel insertion, then a monitored ramp to operational output.",facts:["Reactor startup follows a seven-step sequence: verify coolant loop integrity, align the laser array, insert fuel rods, ramp laser power, monitor core temperature, confirm turbine engagement, then ramp to operational output.","The full cold-start procedure takes about four hours and twenty minutes when run to plan.","Laser alignment must be at least 90% before fuel insertion is permitted.","Core temperature is monitored for 30 minutes after first laser power before turbine engagement is approved.","Startup requires the presence of both a reactor engineer and a safety officer, per the dual-control rule."]},{title:"Grid Tie & Power Dispatch",category:"IITPP — Systems & Operations",facility:"IITPP — Sakurajima",author:"Operations",classification:"INTERNAL",keywords:["grid","dispatch","power","output","850 mw","utility","frequency","load","electricity"],summary:"IITPP dispatches 850 MW of baseload power under a quarterly grid agreement, with load-following headroom validated by the core stability model.",facts:["The plant dispatches its nominal 850 MW under a quarterly grid dispatch agreement negotiated with the regional utility.","Core stability modeling suggests the plant can safely accept up to 40 MW of short-duration demand ramps without exceeding ±15K core excursion.","Generator output is synchronized to 60 Hz grid frequency before dispatch, with phase sync verified at the Turbine Hall.","During load-following, the coolant-lag predictor gives operators advance warning of thermal response.","Grid excursions are most frequent in winter, which is why vibration-isolation reviews are scheduled before the winter peak."]},{title:"The Tram System — Automated Transit",category:"IITPP — Systems & Operations",facility:"IITPP — Sakurajima",author:"Operations",classification:"INTERNAL",keywords:["tram","trams","transit","stations","schedule","transport","headway","evac hub","rail"],summary:"The automated tram network links the five main sectors of IITPP with six-minute headways, shifting to three-minute peaks and full evacuation re-routing during events.",facts:["The tram system links the five main sectors: Main Entrance, Research Wing, Core Control, Facility Control and the Evacuation Hub on demand.","Nominal headway is six minutes, tightening to three minutes during peak shift windows at 0600, 1400 and 2200.","In evacuation mode, all trams are re-routed to the Evacuation Hub.","Track lubrication and bogie maintenance follow a scheduled cycle between the sectors.","The tram control node (tram-ctl at 10.10.3.20) manages the network on the intranet."]},{title:"Storage Distribution — Logistics & Inventory",category:"IITPP — Systems & Operations",facility:"IITPP — Sakurajima",author:"Logistics",classification:"INTERNAL",keywords:["storage","distribution","cubes","barrels","inventory","logistics","deliveries","warehouse","supply"],summary:"Storage Distribution manages the plant's physical supply chain — cube and barrel inventories, per-sector dispatch queues, and delivery logging with average dispatch times under four minutes.",facts:["Storage Distribution handles the plant's physical supply chain: cube and barrel inventories, dispatch queues and delivery logging.","Average dispatch time per delivery is about three to four minutes, with queues tracked per sector.","Inventory files (cubes.inv, barrels.inv) and the delivery log are maintained on the workstation filesystem.","Barrels include hazmat classes and require rated handling; cubes are the standard logistics unit.","The Desert Complex handles 3000+ cubes a day in its own logistics operation, a benchmark the Sakurajima team studies."]},{title:"Door & Lock Control Systems",category:"IITPP — Systems & Operations",facility:"IITPP — Sakurajima",author:"Facilities",classification:"INTERNAL",keywords:["doors","locks","keypad","keycards","access","control","locks.ctl","doors.sys","jammed","fix"],summary:"The door and lock control system manages keypads, keycards and manual locks across the facility, with jams and motion trips being the most common staff task.",facts:["The door control system manages keypad, keycard and manual locks across the facility's sectors.","Core Control Room access uses keypad 7342-1; Facility Control uses 3129-8; the Emergency Bunker uses manual keys.","Jammed doors and sensor trips are the most common routine task — fixing them is a standard credit-earning job.","The locks.ctl and doors.sys files on the filesystem record the control matrix and recent events.","Door control is fail-secure: on power loss, doors default to locked except fire-exit paths."]},{title:"Camera & Surveillance Network",category:"IITPP — Systems & Operations",facility:"IITPP — Sakurajima",author:"Security Operations",classification:"RESTRICTED",keywords:["cameras","surveillance","cctv","security cameras","channels","ptz","monitor","feeds","watch"],summary:"A 32-channel camera array covers the perimeter, Visitor Center, core sectors, Turbine Hall and storage areas, with PTZ units monitored from the Security Hub.",facts:["The facility runs a 32-channel camera array covering the perimeter, Visitor Center, core sectors, Turbine Hall and storage areas.","Channels 01-08 cover the perimeter with PTZ units; 09-16 cover the Visitor Center; 17-24 cover the core and reactor; 25-28 cover the Turbine Hall; 29-32 cover storage and trams.","Camera feeds are monitored from the Security Hub and recorded with motion-triggered events.","A loose panel in the Turbine Hall famously triggered a motion alarm at 0330 — maintenance replaced it and the event became a training anecdote.","Camera configuration lives in cameras.cfg on the workstation filesystem."]},{title:"Fire Suppression System",category:"IITPP — Systems & Operations",facility:"IITPP — Sakurajima",author:"Safety Division",classification:"INTERNAL",keywords:["fire","suppression","fire suppression","sprinkler","foam","extinguisher","sector b","response","system"],summary:"Fire suppression at IITPP combines sprinkler zones, foam systems and portable extinguishers, with a benchmarked facility response time under 12 seconds.",facts:["Fire suppression at IITPP combines sprinkler zones, foam systems and portable extinguishers staged at every sector.","The fire suppression test in Sector B recorded a facility response time under 12 seconds.","Electrical and laser bays use non-conductive suppression agents rather than water.","PET coordinates firefighting, with the emergency team training on every system type at least quarterly.","Fire drills are logged in the safety division records and reviewed for response-time trends."]},{title:"Backup Power & Emergency Lighting",category:"IITPP — Systems & Operations",facility:"IITPP — Sakurajima",author:"Facilities",classification:"INTERNAL",keywords:["backup","power","emergency lighting","generator","battery","uninterruptible","blackout","auxiliary"],summary:"Emergency power at IITPP is provided by auxiliary generators and battery banks that keep doors fail-secure, lighting live and the core monitoring running through blackouts.",facts:["Auxiliary generators and battery banks cover emergency power across the facility.","Door control is fail-secure on power loss: doors default to locked except fire-exit paths.","Emergency lighting activates automatically in every sector, including the tram tunnels.","Core monitoring and the safeguard interlocks are on uninterruptible power, so telemetry never drops during a blackout.","Backup power capacity is tested monthly with a simulated mains outage."]},{title:"The Pizzatron — Cafeteria Food Machine",category:"IITPP — Systems & Operations",facility:"IITPP — Sakurajima",author:"Facility Archives",classification:"PUBLIC",keywords:["pizzatron","pizza","cafeteria","food","machine","vending","snack","lunch","break room"],summary:"The Pizzatron is the cafeteria's famously mundane automated food machine — a vending unit that dispenses 'pizza' and snacks to hungry shift workers.",facts:["The Pizzatron is the cafeteria's automated food machine, part of the break-room furniture every staff member knows.","It dispenses 'pizza' and assorted snacks, and is a running joke in the community for the quality of its output.","The machine is one of the facility's few pieces of non-industrial equipment, sitting opposite the regular vending units.","Shift workers use the cafeteria between events, and the Pizzatron is a popular roleplay landmark.","Maintenance records show the Pizzatron receives more service calls than the average door lock."]},{title:"Core Control Room — Sector C",category:"IITPP — Areas & Rooms",facility:"IITPP — Sakurajima",author:"Facility Archives",classification:"RESTRICTED",keywords:["core control","control room","sector c","mainframe","key","console","operators","reactor control"],summary:"The Core Control Room in Sector C is where the reactor is operated — home to the core mainframe, the safeguard key station and the Control Room workstation this archive runs on.",facts:["The Core Control Room in Sector C is the operational heart of the plant, housing the core mainframe and the reactor operator consoles.","One of the two safeguard keys lives here; the second lives in Facility Control in Sector D.","The room is protected by keypad access (7342-1) and is the most security-sensitive workspace in the facility.","This Control Room workstation (iitpp-control-01) is part of Sector C's console furniture.","Tampering with core controls from this room is the most serious offense in facility law."]},{title:"Facility Control Room — Sector D",category:"IITPP — Areas & Rooms",facility:"IITPP — Sakurajima",author:"Facility Archives",classification:"RESTRICTED",keywords:["facility control","sector d","second key","control room","facility","supervision","operations"],summary:"Facility Control in Sector D is the plant's second command room — the twin of Core Control, holding the second safeguard key and overseeing facility-wide operations.",facts:["Facility Control in Sector D is the twin command room to Core Control, overseeing facility-wide operations.","It holds the second safeguard key, making dual-key engagement a cross-room coordination exercise.","Access uses keypad 3129-8, and the room monitors the sectors outside the core envelope.","During events, Facility Control coordinates evacuation while Core Control manages the reactor.","The two rooms communicate over a dedicated intercom line that bypasses the general PA system."]},{title:"The Research Wing — Sector B",category:"IITPP — Areas & Rooms",facility:"IITPP — Sakurajima",author:"Research Wing",classification:"INTERNAL",keywords:["research","wing","sector b","lab","scientists","experiments","dosimetry","analytical"],summary:"The Research Wing in Sector B houses the plant's laboratories — fuel assay benches, calorimetry and the dosimetry program — and records the lowest radiation readings on site.",facts:["The Research Wing in Sector B houses the plant's laboratories: fuel assay, calorimetry, analytical chemistry and the dosimetry program.","It records the lowest mean radiation readings on site at about 1.8 μSv/h, thanks to distance from the core.","Research findings feed directly into reactor operations — the stability model, the laser algorithm and the annealing program all originated here.","The wing maintains the research filesystem and the published study archive.","Researchers coordinate with the Arctic and Desert facilities on cross-site studies."]},{title:"Main Facility Entrance — Sector A",category:"IITPP — Areas & Rooms",facility:"IITPP — Sakurajima",author:"Facility Archives",classification:"PUBLIC",keywords:["main entrance","sector a","visitor center","lobby","reception","arrival","check-in","gates"],summary:"Sector A is the main entrance and Visitor Center of the plant — the arrival point, security checkpoint and first tram station for every shift.",facts:["Sector A is the main entrance and Visitor Center, the arrival point for every shift worker and visitor.","It hosts the reception desk, the badge check-in point and the perimeter gate control.","The first tram station is here, and doors A3 and A7 are the primary pedestrian exits.","Visitor access is strictly escorted; staff badges are required beyond the lobby.","The perimeter log records the sector's motion-sensor events, most of which are cleared by patrol."]},{title:"The Boiler Rooms",category:"IITPP — Areas & Rooms",facility:"IITPP — Sakurajima",author:"Facility Archives",classification:"INTERNAL",keywords:["boiler","boilers","room","steam","pressure","furnace","heat exchange","water"],summary:"The boiler rooms convert core heat into steam for the turbines, with pressure monitoring and fuel feed management as the primary operator duties.",facts:["The boiler rooms convert core heat into steam for the Turbine Hall, feeding the generator sets.","Boiler pressure and water level are the primary monitored parameters; feed management is a core operator duty.","Boiler-related tasks are a standard credit-earning job for shift engineers.","The facility's fuel system spans coal/carbon and the signature magma crystals, both feeding the boiler circuit.","During core events, boiler load is reduced in step with turbine throttling."]},{title:"The Cafeteria & Break Areas",category:"IITPP — Areas & Rooms",facility:"IITPP — Sakurajima",author:"Facility Archives",classification:"PUBLIC",keywords:["cafeteria","break","lunch","food","pizzatron","rest","staff","mess hall","social"],summary:"The cafeteria is the staff break area between shifts — a social hub famous for the Pizzatron food machine and the briefings held between events.",facts:["The cafeteria is the staff break area, used between shifts and during lulls between events.","It is home to the famously mundane Pizzatron food machine and the standard vending units.","Briefings and informal shift handovers are often held here before staff move to their sectors.","During major events the cafeteria empties quickly as staff move to stations.","The community treats the cafeteria as a roleplay landmark and a running joke about facility food."]},{title:"The Storage Rooms",category:"IITPP — Areas & Rooms",facility:"IITPP — Sakurajima",author:"Logistics",classification:"INTERNAL",keywords:["storage","rooms","warehouse","inventory","cubes","barrels","racks","supplies"],summary:"The storage rooms hold the plant's cube and barrel inventories, organized by sector with hazmat-classed barrels handled under rated procedures.",facts:["The storage rooms hold the plant's cube and barrel inventories, organized by destination sector.","Barrels include hazmat classes and are stored under rated handling rules.","Inventory counts are maintained in cubes.inv and barrels.inv on the workstation filesystem.","Racks are inspected for structural integrity quarterly.","The rooms are the origin point for most tram deliveries."]},{title:"The Emergency Bunker — Sector G",category:"IITPP — Areas & Rooms",facility:"IITPP — Sakurajima",author:"Safety Division",classification:"RESTRICTED",keywords:["bunker","sector g","emergency bunker","blast shelter","safe room","shelter","evac","sealed"],summary:"The Emergency Bunker in Sector G is the blast shelter for catastrophic events — manually keyed, sealable from inside, and the final staging area for evacuation.",facts:["The Emergency Bunker in Sector G is the blast shelter where staff retreat during a meltdown or other catastrophic event.","Sector G also houses emergency coolant systems referenced in the Computer Core's crisis protocols.","The bunker doors are manually keyed and can be sealed from inside.","Reaching Sector G during an event and surviving inside is part of the emergency drill experience.","The bunker stocks emergency supplies and a backup radio link to the intranet."]},{title:"T
