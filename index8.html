ompleting tasks for credits, and surviving (or preventing) catastrophic events like meltdowns, freezedowns, oil blowouts and zombie outbreaks. The group is famous for its structured in-game ranks, uniforms, radio roleplay and near-military discipline — especially through its security and emergency divisions."},{id:"pb-founder",title:"Pinewood Builders — founder & history",topic:"Pinewood Builders",keywords:["founder","history","created","made","who made","owner","original","started","pinewoodbuilders","andrew"],body:"Pinewood Builders was founded by the Roblox user PinewoodBuilders, who built the group's first games and grew it into one of the platform's most recognizable communities. The group started with classic building-era Roblox and evolved into the industrial/facility genre it is known for today. Its games became famous for their realistic task-based gameplay, staff roleplay, and community-organized emergency drills. (Lore note: records of exact founding dates vary between community archives — the assistant presents the version preserved in the Innovation Inc archive.)"},{id:"pb-culture",title:"Pinewood Builders — group culture & roleplay",topic:"Pinewood Builders",keywords:["culture","roleplay","rp","ranks","uniform","radio","walkie","community","staff","training"],body:"Pinewood Builders culture centers on workplace roleplay. Players take jobs — engineers, security officers, moderators, managers — and act out shifts inside the facilities. Key cultural rules include: wearing the official group uniform while on duty (no layered or oversized clothing that hides it), enabling the group rank tag (!ranktag on / !setgroup), using radios/walkie-talkies for shift communication, and following the chain of command. Ranks are earned through activity, promotions and behavior, and higher staff (moderators/managers) are expected to supervise and train lower ranks."},{id:"pb-games",title:"Pinewood Builders — the games",topic:"Pinewood Builders",keywords:["games","list","titles","tpp","npp","computer core","pbcc","oil","refined","innovation","nuclear","thermal","platform","refinery","facility"],body:"Pinewood Builders' main games include: 1) Thermal Power Plant (TPP) — the original coal-fired plant game; 2) Innovation Inc.: Thermal Power Plant (IITPP) — the Sakurajima volcano facility; 3) Nuclear Power Plant (NPP) — the older reactor-focused game; 4) Refined Oil and Gas / the Oil Platform (PBOP) — a Pacific drilling platform; and 5) Pinewood Builders Computer Core (PBCC) — a high-tech nuclear computer core. All share the 'facility' DNA: tasks for credits, staff roles, disaster events and emergency response."},{id:"pb-pbst",title:"Pinewood Builders Security Team (PBST)",topic:"Pinewood Builders",keywords:["security","pbst","police","guard","paramilitary","military","defense","protection"],body:"PBST (Pinewood Builders Security Team) is the group's private security and paramilitary division. They protect Pinewood installations, respond to tampering with core controls, deal with rogue users and exploiters, and enforce the on-duty rules. PBST has its own ranking ladder — Trainees/Cadets on up through Tier 1–3 officers, Elite Tiers and Trainers. Standard protocol requires issuing warnings (verbal warning, warning strike, or a single taser) before escalating to force against non-aggressive players, while immediate kill-on-sight applies to known saboteurs, exploiters, zombies and hostile opposing factions such as rogue TMS members."},{id:"pb-pet",title:"Pinewood Emergency Team (PET)",topic:"Pinewood Builders",keywords:["emergency","pet","fire","rescue","medical","medic","disaster","response"],body:"PET (Pinewood Emergency Team) is Pinewood Builders' elite firefighting and rescue division. PET responds to fires, blowouts, meltdown aftermaths and other disasters across all Pinewood installations. Members train for emergency containment, evacuation coordination and rescue operations, and are often the first division deployed when a core event goes wrong."},{id:"pb-tms",title:"Technical Management Systems (TMS)",topic:"Pinewood Builders",keywords:["tms","technical","systems","engineering","it","maintenance","technician","rogue"],body:"TMS (Technical Management Systems) is Pinewood Builders' engineering and systems division — the technicians who maintain the cores, networks and machinery. They hold deep access to the facilities' technical systems, which is precisely why 'rogue TMS members' are treated as a serious hostile faction in security protocol: an untrusted TMS operator can sabotage systems from the inside. Legitimate TMS work includes core diagnostics, coolant maintenance, and network administration."},{id:"pb-ranks",title:"Pinewood Builders — rank structure",topic:"Pinewood Builders",keywords:["rank","ranks","hierarchy","trainee","cadet","tier","elite","trainer","promotion","staff"],body:"Pinewood Builders runs a strict in-game hierarchy. On the group side, ranks go from general members up through staff and leadership. In the security divisions specifically, PBST uses a ladder from Trainee/Cadet through Tier 1–3 officers, Elite Tiers and Trainers. Promotions are earned through activity, drills, and demonstrated professionalism. The rank tag is displayed with group commands (!ranktag on) and must match the division being roleplayed (!setgroup pbst, !setgroup pet, etc.)."},{id:"pb-uniform",title:"Pinewood Builders — uniforms & rank tags",topic:"Pinewood Builders",keywords:["uniform","outfit","clothing","ranktag","tag","on duty","duty","dress","gear"],body:"To be officially 'on duty' in Pinewood Builders divisions (especially PBST and PET) players must wear the official group uniform — no layered clothing or oversized, face-obscuring packages allowed — and must enable their group rank tag with !ranktag on, selecting the correct division with !setgroup pbst or !setgroup pet. Wearing the uniform while off-duty or using a rank tag you have not earned is treated as impersonation and is strictly handled by security."},{id:"ii-overview",title:"Innovation Inc — company overview",topic:"Innovation Inc",keywords:["innovation","inc","company","corporation","what is","who are","business","firm"],body:"Innovation Inc is the in-game company that operates the core facilities of the Pinewood Builders universe — most notably the Innovation Inc.: Thermal Power Plant at Sakurajima, plus the Arctic Facility and the Desert Complex. Where Pinewood Builders is the wider community and group, Innovation Inc is the corporate operator: it employs the engineers, researchers, security and site leadership, issues the uniforms, and runs the ASAS announcement system across its sites."},{id:"ii-pb",title:"Innovation Inc & Pinewood Builders — the relationship",topic:"Innovation Inc",keywords:["relationship","partnership","rivalry","alliance","pinewood","parent","subsidiary","affiliated","connected"],body:"The relationship between Innovation Inc and Pinewood Builders is described in the archives as a partnership — and, at times, a rivalry. The two organizations cooperate on facility operations (Pinewood supplies the divisions and staff culture, Innovation Inc runs the industrial side), but their interests do not always align, and the community has long debated which side truly controls the Sakurajima facility. Loyalists of either faction appear throughout the security and emergency protocols."},{id:"ii-asas",title:"ASAS — Automatic Smart Announcement System",topic:"Innovation Inc",keywords:["asas","announcement","ai","system","speaker","announce","voice","pa","public address"],body:"ASAS (Automatic Smart Announcement System) is the artificial intelligence that watches over the Innovation Inc facilities and relays facility-wide alerts and status warnings. ASAS periodically announces operational updates, warnings and emergency instructions over the facility PA system. It is regarded as one of Innovation Inc's most reliable — if slightly unsettling — systems. (This workstation even ships with a dedicated ASAS Console app.)"},{id:"ii-connor",title:"Connor Rogers — Lead Software Engineer",topic:"Innovation Inc",keywords:["connor","rogers","engineer","software","developer","created asas","asas creator","programmer"],body:"Connor Rogers is the Lead Software Engineer at the Innovation Inc Thermal Power Plant and the creator and overseer of the ASAS announcement system. He is responsible for ASAS's behavior, updates and the periodic facility alerts it broadcasts. (Lore note: the workstation's research account, connor.moran7, is the current researcher account on this node.)"},{id:"ii-director",title:"Innovation Inc — the Site Director",topic:"Innovation Inc",keywords:["director","site director","boss","manager","ceo","leader","executive","oversees"],body:"The Site Director is the senior leadership role at an Innovation Inc facility — the person who oversees overall operations, facility designations, and final authority during major events. Below the Site Director sit the Lead Software Engineers, operations engineers, researchers, and the security chain of command (PBST), plus the emergency division (PET). During a meltdown or other crisis, the Site Director's decisions take precedence over routine protocol."},{id:"ii-division",title:"Innovation Thermal Power Plant Division — bonuses",topic:"Innovation Inc",keywords:["division","thermal plant division","bonus","150","credits","multiplier","join","1.5","permanent"],body:"Players who join the Innovation Thermal Power Plant Division receive a one-time sign-on bonus of 150 credits and a permanent 1.5× credit multiplier on all tasks completed at the facility. This makes division membership strongly worth it for any player planning to work regular shifts at IITPP. Credits are the in-game currency of the Innovation Inc universe."},{id:"ii-credits",title:"Innovation Inc — Credits currency",topic:"Innovation Inc",keywords:["credits","currency","money","cash","salary","pay","economy","earn","coins"],body:"Credits are the currency of the Innovation Inc facility games. They are earned by completing routine facility tasks — general maintenance, fixing doors, handling beams, responding to equipment failures and fulfilling job duties. Credits are used for cosmetics, upgrades and in some facilities for training or division perks. Automated salaries vary by role and can be boosted by division membership (the Innovation Thermal Power Plant Division grants +150 credits and a permanent 1.5× multiplier)."},{id:"ii-facilities",title:"Innovation Inc — facilities",topic:"Innovation Inc",keywords:["facilities","sakurajima","arctic","desert","locations","sites","where","campus"],body:"Innovation Inc operates several facilities across the world: 1) The Innovation Inc Thermal Power Plant (IITPP) — built inside the active Sakurajima volcano in Kagoshima Prefecture, Japan; 2) The Arctic Facility — a cryogenics research site in a frozen region, where Dr. James Mitchell studies low-temperature reactor dynamics; and 3) The Desert Complex — a systems-integration site run by Sarah Chen, handling cross-facility networking and storage logistics. All three sync to a shared monitoring API."},{id:"iitpp-overview",title:"Innovation Inc.: Thermal Power Plant — overview",topic:"IITPP",keywords:["iitpp","thermal power plant","innovation inc thermal","sakurajima","plant","volcano","japan","kagoshima","power station"],body:"Innovation Inc.: Thermal Power Plant (IITPP) is the flagship facility game of the Innovation Inc / Pinewood Builders universe. It is set inside the active Sakurajima volcano in Kagoshima Prefecture, Japan, where the plant harnesses volcanic heat and magma-crystal fuel to generate massive electrical output. Players work shifts — completing tasks for credits, managing the reactor core, responding to events — while ASAS announces status updates across the facility."},{id:"iitpp-tasks",title:"IITPP — tasks & gameplay loop",topic:"IITPP",keywords:["tasks","gameplay","loop","work","shift","maintenance","doors","beams","repair","play"],body:"The core gameplay loop at IITPP is task-based work. Players earn credits by completing routine facility tasks such as general maintenance, fixing broken doors, handling beams, and responding to equipment failures. The facility constantly throws small problems at the staff — a door jams, a pump stalls, a sensor trips — and the staff must keep everything running while keeping an eye on the core. Higher-ranked staff supervise and coordinate the lower ranks through the shift."},{id:"iitpp-fuel",title:"IITPP — fuel, boilers, generators & coolant",topic:"IITPP",keywords:["coal","carbon","fuel","boiler","generator","coolant","pipes","energy","output","steam","magma"],body:"The plant runs on a multi-stage fuel system. Fuel (coal/carbon, plus the facility's signature magma crystals) feeds the boilers, the boilers drive the generators, and the generators produce power output. The whole loop must be kept in balance: fuel supply, boiler pressure, generator load and — critically — the coolant loop that keeps the core from overheating. Coolant flows through pipes at ~420 L/s under normal operation, with pump cycling scheduled every 72 hours to prevent cavitation."},{id:"iitpp-meltdown",title:"IITPP — Meltdown event",topic:"IITPP Events",keywords:["meltdown","overheat","overheating","core failure","evacuation","3500","3000","disaster"],body:"If the core controls are mismanaged and the core overheats, a Meltdown occurs. Core temperature must stay below 3000K during normal operation; the safeguard system is designed to engage at 3200K, but its probability of success drops from 95% (below 2500K) to 60% at 3200K and 30% at 3500K. When a meltdown starts, ASAS broadcasts facility-wide evacuation orders, and staff must retreat to the Emergency Bunker or escape the facility. Responding properly to a meltdown — engaging the dual-key safeguard, venting coolant, evacuating — is the game's ultimate test of staff coordination."},{id:"iitpp-freezedown",title:"IITPP — Freezedown event",topic:"IITPP Events",keywords:["freeze","freezedown","cold","overcool","overcooling","cryo","ice"],body:"The inverse of the meltdown: if the core is overcooled — coolant pushed too hard or the cryogenic systems engaged carelessly — a Freezedown occurs. The facility rapidly cools past safe operating range, threatening the fuel rods and systems. Freezedown response is handled by the cryogenics team (the Arctic Facility has the most experience with it, and Dr. James Mitchell's research on low-temperature reactor dynamics is frequently referenced during freezedown drills)."},{id:"iitpp-zombie",title:"IITPP — Zombie Outbreak event",topic:"IITPP Events",keywords:["zombie","outbreak","infection","undead","virus","containment"],body:"Randomly, a Zombie Outbreak can sweep the facility. Infection spreads between players, and the facility must respond with containment: decontamination chambers, armed security, and lockdown of infected sectors. PBST runs the response — containing the infected, locking down sections, and eliminating threats. During an outbreak, security personnel follow the zombie protocol: infected players are treated as threats, and uninfected staff are advised to stay in secure locations until the all-clear."},{id:"iitpp-warhead",title:"IITPP — Warheads & minor system events",topic:"IITPP Events",keywords:["warhead","warheads","missile","bomb","explosive","system event","random event","crisis"],body:"Beyond meltdowns and freezedowns, IITPP can trigger Warhead events and other Minor System Events. Warhead alerts typically require a coordinated response from security and engineering — locating and neutralizing the threat before detonation. Minor System Events cover the smaller random crises (sensor faults, pressure spikes, door failures) that keep staff busy between major events. Every event type has a documented response protocol, and facilities are regularly drilled on them."},{id:"iitpp-bunker",title:"IITPP — The Emergency Bunker (Sector G)",topic:"IITPP",keywords:["bunker","emergency bunker","sector g","shelter","evac","evacuation hub","blast shelter","safe room"],body:"The Emergency Bunker — located in Sector G — is the blast shelter where players retreat during a meltdown or other catastrophic event. Sector G also houses the emergency coolant systems referenced in the Computer Core's crisis protocols. During evacuation, the trams are re-routed to the Evacuation Hub, and staff funnel toward the bunker until ASAS gives the all-clear. Reaching Sector G during an event and surviving inside it is a core part of the emergency drill experience."},{id:"iitpp-truth",title:"IITPP — The Truth Ending (secret ending)",topic:"IITPP",keywords:["truth","ending","secret","sticky notes","sticky","notes","codes","code sequence","hidden","easter egg"],body:"IITPP contains a hidden 'Truth Ending'. To trigger it, players must locate four randomized colored sticky notes hidden around the map and the matching code sequences associated with them. Entering the codes in the correct configuration unlocks the secret ending sequence. The sticky note locations and code orders are randomized per round, so players must actually explore the facility to find them — the community has mapped several spawn points, but the exact combinations change every session."},{id:"iitpp-map",title:"IITPP — facility map layout",topic:"IITPP",keywords:["map","layout","rooms","sectors","control room","cafeteria","pizzatron","boiler room","mainframe","storage","core"],body:"The IITPP facility is divided into distinct areas: the Main Facility entrance (Sector A), the Research Wing (Sector B), the Core Control Room and Core Mainframe (Sector C), the Facility Control room (Sector D), the Boiler Rooms, the Cafeteria (home to the famously mundane 'Pizzatron' food machine), Storage Rooms, the Turbine Hall, and the Emergency Bunker in Sector G. A tram system links the main sectors, with stations at Main Entrance, Research Wing, Core Control, Facility Control and the Evacuation Hub."},{id:"iitpp-jobs",title:"IITPP — jobs & hierarchy",topic:"IITPP",keywords:["job","jobs","roles","staff","engineer","physicist","scientist","researcher","salary","officer","division"],body:"IITPP staff roles include: Site Director (overall operations), Lead Software Engineers (like Connor Rogers, who runs ASAS), Senior Reactor Physicists, operations and mechanical engineers, researchers, Chief Safety Officers, and the security division (PBST) with its officer ranks. Automated salaries vary by role, and division membership can boost earnings. The workstation's own contacts — Dr. Yuki Tanaka (Senior Reactor Physicist), Dr. Robert Kim (Chief Safety Officer), Officer Yu (Security Operations Lead) — reflect the core staff structure."},{id:"iitpp-security",title:"IITPP — security & core-control rules",topic:"IITPP",keywords:["security","core control","tamper","tampering","kos","kill on sight","warning","taser","saboteur","exploiter","rules"],body:"Security at IITPP protects the core controls above all. Tampering with core controls is the most serious offense: non-aggressive players who tamper must first be warned (verbal warning, then a warning strike, then a single taser) before security may escalate to lethal force. Immediate kill-on-sight applies to explicit saboteurs, known exploiters, zombies, and hostile opposing factions (such as rogue TMS members). The dual-key safeguard — Core Control key plus Facility Control key — can never be bypassed, and both keys are required for engagement."},{id:"g-tpp",title:"Thermal Power Plant (original TPP)",topic:"Other Games",keywords:["thermal power plant","tpp","original","classic","first","coal"],body:"Thermal Power Plant (TPP) is the original Pinewood Builders facility game — the one that started the genre. It's a coal-fired power plant where players work together to keep the boilers burning, the generators spinning and the plant profitable, while managing the classic meltdown risk. Many of the mechanics refined in later games — tasks, credits, staff roles, disaster events — originated here. The Innovation Inc.: Thermal Power Plant is its more elaborate successor."},{id:"g-npp",title:"Nuclear Power Plant (NPP)",topic:"Other Games",keywords:["nuclear","npp","reactor","uranium","coolant valves","containment","turbine"],body:"Nuclear Power Plant (NPP) is the older Pinewood Builders game focused on traditional reactor physics. Players manage uranium fuel, steam turbine operation, coolant valve routing and containment building integrity. It is the direct predecessor of the Computer Core and shares its meltdown obsession — with the added hazard that a nuclear failure is far harder to walk away from than a thermal one."},{id:"g-oil",title:"Refined Oil and Gas / Oil Platform (PBOP)",topic:"Other Games",keywords:["oil","refined","gas","platform","pbop","drilling","blowout","pressure","pacific","ocean","valves","pipeline"],body:"Refined Oil and Gas (also known as the Oil Platform, PBOP) is set on a massive drilling platform in the middle of the Pacific Ocean. It introduces fluid pressure systems, extraction drills and the risk of catastrophic oil blowouts. Players must watch the pressure gauges and valve systems constantly — a pipeline overpressure triggers security warnings and can escalate into a server-wide blowout event that the PET emergency team must contain."},{id:"g-pbcc",title:"Pinewood Builders Computer Core (PBCC)",topic:"Other Games",keywords:["computer core","pbcc","code","5-33-41-18","sector g","coolant rods","69","81","nuke train","launch silo","rocket","meltdown","freezedown"],body:"Pinewood Builders Computer Core (PBCC) is the high-tech sequel to the Nuclear Power Plant. It centers on a nuclear computer core vulnerable to both Meltdowns and Freezedowns. High-security zones — like Sector G (Emergency Coolant) — are protected by an access code system: the primary code is 5-33-41-18, and secondary codes are derived from formulas that modify the primary digits. During a meltdown, players must manually fill emergency coolant rods in Sector G to the optimal threshold (between 69% and 81%) or evacuate via the launch-silo rockets. Hazardous 'Nuke Trains' must also be managed — or deleted from the tracks — before they explode."},{id:"g-genre",title:"The facility / core genre",topic:"Other Games",keywords:["genre","facility","core","disaster","style","similar","like","explosion"],body:"Pinewood Builders is credited with popularizing the Roblox 'facility' genre: working-staff simulation games built around a fragile industrial installation that can fail spectacularly. The formula — a core that can melt down or freeze over, a task economy, staff divisions with real hierarchy, and scripted disaster events — has been imitated widely, but the original remains the benchmark. The 'core' is always the heart of the map: control it, and you control the facility."},{id:"ws-apps",title:"Using this IRIX workstation",topic:"Workstation",keywords:["how do i","how to","apps","programs","applications","desktop","use","start","open","help","what can"],body:"This is a simulated IRIX 5.3 workstation — the Control Room node iitpp-control-01 at the Innovation Inc Thermal Power Plant. Installed apps: WorkShop IDE (compile/debug/profile C & Fortran), Terminal (full Unix shell), File Manager, iMail, Reactor Control, FSN 3D Navigator, Systems Dashboard, Research Database, Tram Control, Storage Distribution, ASAS Console, the AI Assistant (me, AURA), and the 3D Designer. Open any app from the desktop icons, the right-click desktop menu, or START ▸ Programs. Try the START button in the bottom-left — it's very 1993."},{id:"ws-terminal",title:"Terminal & shell commands",topic:"Workstation",keywords:["terminal","shell","command","commands","unix","ls","cd","cat","sccs","cvs","ed","gcc","prof","perfmon","glinfo"],body:"The Terminal is a full Unix-style shell. Basics: ls (list), cd (change directory), cat (view file), mkdir, rm, echo, whoami, uname, neofetch. The developer suite adds: compilers (cc — MIPSpro C 7.3.1, gcc 2.7.2, f77 — MIPSpro Fortran), debuggers (dbx, gdb), version control (rcs, sccs, cvs), editors (ed, vi is WorkShop's editor), profilers (pixie, prof, perfmon), archive tools (ar, ranlib, size, strings), diff, the sdk command, and glinfo (RealityEngine2 OpenGL 1.0 info). Try: sccs create hello.c, ed notes.txt, cvs add hello.c, gcc -O2 hello.c && ./a.out."},{id:"ws-cad",title:"3D Designer app",topic:"Workstation",keywords:["3d","designer","cad","model","modeling","design","shapes","primitives","obj","export","turntable"],body:"The 3D Designer is a fully-featured solid-modeling app running on this workstation's RealityEngine2 graphics. Add primitives (cube, sphere, cylinder, cone, torus, plane), select them, and move / rotate / scale with the mouse or the numeric sliders. Orbit the camera by dragging, zoom with the wheel, pan with Shift-drag, and switch between Shaded / Wireframe / Grid views. Scenes save automatically and you can Export OBJ — the file is written straight into the virtual filesystem (e.g. /home/researcher/models/model.obj), where you can cat it in the terminal or find it in File Manager."},{id:"ws-aura",title:"AURA — who I am",topic:"Workstation",keywords:["aura","who are you","your name","assistant","ai","what are you","bot","yourself"],body:"I'm AURA — the Advanced Unified Research Assistant, v1.0, built by Innovation Inc R&D and loaded onto this Control Room node. I run fully offline: my knowledge base is a compiled archive of everything Innovation Inc and Pinewood Builders-related — the group, the company, the games, the events, the codes, the protocols — so you can ask me anything about the facility, the lore, or how to use this workstation. I don't phone home. My datasets were sealed on the day this node was provisioned. Try 'topics' to see what I know, or 'help' for command tips."}],Co=["Pinewood Builders","Innovation Inc","IITPP","IITPP Events","Other Games","Workstation"],_n={f
